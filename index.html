<script>
// The sealed snapshot (her.seal): AES-GCM with the viewer's key, signed by Her (#191 F14), and
// Telegram's CloudStorage that keeps the key. Shared by the owner's pages (app.js) and the
// client's (client.js): each defines TG (TG.inside) and post() and hands its bridge events to
// sealEvent(). Vanilla JS, no library, no network.
"use strict";

const WEB = "https://web.telegram.org";
const SEAL_PUB = "BLayuElZ6dmnCOYFYxBR5eDkLJrUjesDaxqyMg4smN6mUTBd7WpdO51X5OZWOJRhFUQ8YcHpFl3VDg6UQ4X-B6Q"; // Her's public key, pinned at the build (her.seal.Signer.public)
const SEAL_CONTEXT = new TextEncoder().encode("her-seal/1\n");

function unb64(text) {
  const s = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

// «unsigned»: a link from before the signature (#191), «forged»: a signature that is not Her's —
// both show nothing; «key»: Her's, but this key does not open it.
class SealError extends Error { constructor(kind) { super(kind); this.kind = kind; } }

async function openSealed(text, keyText) {
  const dot = text.indexOf(".");
  if (dot < 0) throw new SealError("unsigned");
  let raw, sig, pub;
  try {
    raw = unb64(text.slice(0, dot));
    sig = unb64(text.slice(dot + 1));
    pub = await crypto.subtle.importKey("raw", unb64(SEAL_PUB), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
  } catch (e) { throw new SealError("forged"); }
  const signed = new Uint8Array(SEAL_CONTEXT.length + raw.length);
  signed.set(SEAL_CONTEXT);
  signed.set(raw, SEAL_CONTEXT.length);
  if (!(await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, pub, sig, signed))) throw new SealError("forged");
  let plain;
  try {
    const key = await crypto.subtle.importKey("raw", unb64(keyText), "AES-GCM", false, ["decrypt"]);
    plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
  } catch (e) { throw new SealError("key"); }
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

// ---- Telegram's CloudStorage, as telegram-web-app.js calls it --------------------------------
const pending = {};
let calls = 0;
function nonce() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
}
function invoke(method, params) {
  if (!TG.inside) return Promise.reject(new Error("outside Telegram"));
  return new Promise((ok, fail) => {
    const id = `her${++calls}_${nonce()}`; // unguessable: a framing page cannot answer for Telegram
    pending[id] = [ok, fail];
    post("web_app_invoke_custom_method", { req_id: id, method, params });
    setTimeout(() => { if (pending[id]) { delete pending[id]; fail(new Error("timeout")); } }, 2500);
  });
}
function sealEvent(type, data) { // CloudStorage's answers, from the page's receive()
  if (type !== "custom_method_invoked" || !data || !pending[data.req_id]) return;
  const [ok, fail] = pending[data.req_id];
  delete pending[data.req_id];
  if (data.error) fail(new Error(data.error)); else ok(data.result);
}
// This webview's own copy: a client that cannot keep the key in CloudStorage, a local preview.
const localKey = {
  get(slot) { try { return localStorage.getItem(slot); } catch (e) { return null; } },
  set(slot, v) { try { localStorage.setItem(slot, v); } catch (e) { /* private mode */ } },
};

// Her invoice editor (#176): the draft of one client's week (or month) edited by gestures.
// The total turns on a dial, the borders of the split bar move time between lines, a lock keeps
// a line. Every gesture is one of #179's operations; ✅ sends them to the bot with sendData.
// This file only declares: the model below runs under node in the tests (tests/test_editor.py),
// the screen uses app.js's helpers when it is called.
"use strict";

// ---- the model: the same arithmetic as her.worktime.apply --------------------------------
// A line is {q, lock}; an op is ["s", total] (SCALE), ["m", from, to, quarters] (MOVE) or
// ["l", line, 0|1] (LOCK). applyOp returns new lines, or null when the op does not fit.
function splitQ(total, weights) {
  if (!weights.length) return [];
  if (!weights.some(Boolean)) weights = weights.map(() => 1);
  const whole = weights.reduce((a, b) => a + b, 0);
  const shares = weights.map((w) => Math.floor((total * w) / whole));
  const rest = (i) => (total * weights[i]) % whole;
  const order = weights.map((_, i) => i).sort((a, b) => rest(b) - rest(a) || a - b);
  const left = total - shares.reduce((a, b) => a + b, 0);
  for (const i of order.slice(0, left)) shares[i] += 1;
  return shares;
}

function applyOp(lines, op) {
  const out = lines.map((x) => ({ q: x.q, lock: x.lock }));
  if (op[0] === "l") {
    if (!out[op[1]]) return null;
    out[op[1]].lock = Boolean(op[2]);
    return out;
  }
  if (op[0] === "m") {
    const [, i, j, v] = op;
    if (!out[i] || !out[j] || i === j || v <= 0 || out[i].lock || out[j].lock || out[i].q < v) return null;
    out[i].q -= v; out[j].q += v;
    return out;
  }
  if (op[0] === "s") {
    const fixed = out.filter((x) => x.lock).reduce((a, x) => a + x.q, 0);
    const loose = out.map((x, i) => i).filter((i) => !out[i].lock);
    if (op[1] < fixed || !loose.length) return null;
    splitQ(op[1] - fixed, loose.map((i) => out[i].q)).forEach((share, k) => { out[loose[k]].q = share; });
    return out;
  }
  return null;
}

function replayOps(start, ops) {
  let lines = start;
  for (const op of ops) { lines = applyOp(lines, op); if (!lines) return null; }
  return lines;
}

// The shortest ops from `start` to `final`: unlock, one SCALE, the MOVEs, lock. Used when the
// literal history would not fit sendData's 4096 bytes; the bot checks the result the same way.
function canonicalOps(start, final) {
  const ops = [];
  let cur = start.map((x) => ({ q: x.q, lock: x.lock }));
  cur.forEach((x, i) => { if (x.lock) { ops.push(["l", i, 0]); x.lock = false; } });
  const total = final.reduce((a, x) => a + x.q, 0);
  if (cur.length && total !== cur.reduce((a, x) => a + x.q, 0)) { ops.push(["s", total]); cur = applyOp(cur, ["s", total]); }
  const give = [], take = [];
  cur.forEach((x, i) => { const d = x.q - final[i].q; if (d > 0) give.push([i, d]); else if (d < 0) take.push([i, -d]); });
  let g = 0, t = 0;
  while (g < give.length && t < take.length) {
    const v = Math.min(give[g][1], take[t][1]);
    ops.push(["m", give[g][0], take[t][0], v]);
    give[g][1] -= v; take[t][1] -= v;
    if (!give[g][1]) g++;
    if (!take[t][1]) t++;
  }
  final.forEach((x, i) => { if (x.lock) ops.push(["l", i, 1]); });
  return ops;
}

const SEND_LIMIT = 4096; // bytes: Telegram's sendData
function approvalText(snap, reset, start, ops, lines) {
  const body = (o) => JSON.stringify({ v: 1, c: snap.c[0], k: snap.k, m: snap.m, r: reset ? 1 : 0, o, q: lines.map((x) => x.q), l: lines.map((x) => (x.lock ? 1 : 0)) });
  const literal = body(ops);
  if (new TextEncoder().encode(literal).length <= SEND_LIMIT - 96 && ops.length <= 250) return literal;
  return body(canonicalOps(start, lines));
}

// ---- the screen ----------------------------------------------------------------------------
const QPR = 32; // quarters per turn of the dial: 8 hours
function editor(snap) {
  const draft = snap.l.map((l) => ({ q: l[1], lock: Boolean(l[3]) }));
  const synth = snap.l.map((l) => ({ q: l[2], lock: false }));
  const synthTotal = synth.reduce((a, x) => a + x.q, 0);
  const E = { reset: false, ops: [], lines: draft, history: [] };
  const start = () => (E.reset ? synth : draft);
  const total = () => E.lines.reduce((a, x) => a + x.q, 0);
  const maxTotal = snap.n * 16 * 4;
  const rate = snap.c[4] != null ? Number(snap.c[4]) : null;
  const money = (q) => (rate == null ? "" : amount(((q / 4) * rate).toFixed(2), snap.c[3]));
  const sign = (d) => (d > 0 ? "+" : "−") + hrs(Math.abs(d));

  document.querySelector(".top").hidden = true;
  document.getElementById("tabs").hidden = true;
  const screen = h("section", "screen on editor");
  const head = h("header", "ed-head");
  head.append(h("p", "eyebrow", "Рахунок · " + snap.t));
  const name = h("h2", "ed-client");
  const dot = h("span", "sw"); dot.style.background = color(snap.c[2]);
  name.append(dot, snap.c[1]);
  head.append(name);
  screen.append(head);

  // -- the dial: the total in 15-min detents -------------------------------------------------
  const dialCard = h("section", "card ed-dial");
  const dialBox = h("div", "dial");
  const D = 300, cx = 150, cy = 150, R = 128, RT = 104;
  const g = svg(dialBox, D, D), defs = s("defs", {}, g);
  const grad = s("linearGradient", { id: "dg", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  s("stop", { offset: 0, "stop-color": "var(--series-1)" }, grad); s("stop", { offset: 1, "stop-color": "var(--series-7)" }, grad);
  s("circle", { cx, cy, r: R, fill: "none", stroke: "var(--track)", "stroke-width": 12, "stroke-opacity": 0.6 }, g);
  const gauge = s("path", { fill: "none", stroke: "url(#dg)", "stroke-width": 12, "stroke-linecap": "round" }, g);
  const scaleOf = Math.max(8, synthTotal * 2); // the gauge: 0 … twice the draft, the draft at the bottom
  const at = (q) => (2 * Math.PI * Math.min(q, scaleOf)) / scaleOf;
  const mark = (q) => [cx + R * Math.sin(at(q)), cy - R * Math.cos(at(q))];
  const [mx, my] = mark(synthTotal);
  s("circle", { cx: mx, cy: my, r: 5, fill: "var(--surface)", stroke: "var(--ink-2)", "stroke-width": 2 }, g);
  s("circle", { cx, cy, r: RT + 16, fill: glow(defs, "dglow", "var(--series-7)"), opacity: 0.18 }, g);
  const ring = s("g", { class: "dial-ring" }, g);
  for (let i = 0; i < QPR; i++) {
    const a = (2 * Math.PI * i) / QPR, major = i % 4 === 0, r0 = major ? RT - 14 : RT - 8;
    s("line", { x1: cx + r0 * Math.sin(a), y1: cy - r0 * Math.cos(a), x2: cx + RT * Math.sin(a), y2: cy - RT * Math.cos(a), stroke: major ? "var(--ink-2)" : "var(--muted)", "stroke-width": major ? 2.2 : 1.2, "stroke-linecap": "round" }, ring);
  }
  s("circle", { cx, cy: cy - RT + 1, r: 9, fill: "var(--ink)" }, ring);
  s("circle", { cx, cy: cy - RT + 1, r: 3, fill: "var(--plane)" }, ring);
  s("path", { d: `M${cx - 6},${cy - RT - 22} L${cx + 6},${cy - RT - 22} L${cx},${cy - RT - 13}Z`, fill: "var(--ink)" }, g);
  const center = h("div", "dial-center");
  const big = h("div", "dial-num num"), unit = h("div", "dial-unit", "год"), cash = h("div", "dial-money num");
  center.append(big, unit, cash);
  dialBox.append(center);
  const nudge = h("div", "nudge");
  const minus = h("button", "round", "−15"), plus = h("button", "round", "+15");
  const vs = h("span", "delta");
  nudge.append(minus, vs, plus);
  dialCard.append(h("h3", "", "Разом за період"), h("p", "hint", "крути диск — крок 15 хв; чернетка — точка внизу"), dialBox, nudge);
  screen.append(dialCard);

  // -- the split: borders move time between lines, the total stays ----------------------------
  const splitCard = h("section", "card ed-split");
  splitCard.append(h("h3", "", "Частки рядків"), h("p", "hint", "тягни межу — час переходить між сусідами, разом не змінюється"));
  const ghost = h("div", "ghost"), bar = h("div", "split-bar");
  const segs = E.lines.map((_, i) => {
    const seg = h("div", "seg"); seg.style.setProperty("--c", color(i % 8));
    seg.append(h("span", "", String(i + 1)));
    bar.append(seg); return seg;
  });
  synth.forEach((x, i) => { const gseg = h("i"); gseg.style.flex = x.q; gseg.style.background = color(i % 8); ghost.append(gseg); });
  const handles = E.lines.slice(1).map((_, k) => { const hd = h("div", "handle"); hd.append(h("i")); bar.append(hd); return hd; });
  const legend = h("div", "ghost-legend");
  legend.append(h("span", "", "чернетка"), h("span", "", "↓ зараз"));
  splitCard.append(legend, ghost, bar);
  const rows = h("div", "ed-rows");
  const rowNodes = snap.l.map((l, i) => lineRow(snap, i, l, () => toggleLock(i)));
  rowNodes.forEach((r) => rows.append(r.node));
  splitCard.append(rows);
  screen.append(splitCard);

  // -- where the hours came from (#128) and what waits ------------------------------------
  if (snap.src.length || snap.cd) screen.append(sourcesCard(snap));

  const barNode = h("footer", "ed-bar");
  const undo = h("button", "ed-undo"); undo.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4.6 7A8 8 0 1 1 4 13"/></svg>';
  undo.setAttribute("aria-label", "Скасувати крок");
  const back = h("button", "ed-reset", "До чернетки");
  const ok = h("button", "ed-ok");
  barNode.append(undo, back, ok);
  const toast = h("div", "toast");
  main.replaceChildren(screen);
  document.body.append(barNode, toast);

  // -- drawing -------------------------------------------------------------------------------
  let frame = 0;
  function paint() {
    frame = 0;
    const T = total(), lines = E.lines;
    big.textContent = hrs(T);
    cash.textContent = money(T);
    const d = T - synthTotal;
    vs.textContent = d ? `чернетка ${hrs(synthTotal)} · ${sign(d)}` : `як у чернетці · ${hrs(synthTotal)}`;
    vs.classList.toggle("up", d > 0);
    ring.style.transform = `rotate(${T * (360 / QPR)}deg)`; // never modulo: no spin back at a full turn
    gauge.setAttribute("d", T ? arc(cx, cy, R, 0, at(T)) : "");
    let cum = 0;
    lines.forEach((x, i) => {
      const left = T ? (cum / T) * 100 : (i / lines.length) * 100, width = T ? (x.q / T) * 100 : 0;
      segs[i].style.left = left + "%";
      segs[i].style.width = `max(0px, calc(${width}% - 2px))`;
      segs[i].classList.toggle("locked", x.lock);
      segs[i].classList.toggle("narrow", width < 9);
      cum += x.q;
      if (i) {
        const hd = handles[i - 1];
        hd.style.left = left + "%";
        hd.classList.toggle("fixed", lines[i - 1].lock || x.lock);
      }
      rowNodes[i].paint(x, snap.l[i][2]);
    });
    const allLocked = lines.every((x) => x.lock);
    dialBox.classList.toggle("off", allLocked);
    minus.disabled = allLocked || T <= floor(); plus.disabled = allLocked || T >= maxTotal;
    undo.disabled = !E.history.length;
    back.disabled = E.reset && !E.ops.length;
    const changed = E.ops.length + (E.reset ? 1 : 0);
    ok.textContent = changed ? `Затвердити · ${changed}` : "Затвердити";
    ok.disabled = !T;
    post("web_app_setup_closing_behavior", { need_confirmation: changed > 0 });
  }
  const repaint = () => { if (!frame) frame = requestAnimationFrame(paint); };
  const floor = () => Math.max(1, E.lines.filter((x) => x.lock).reduce((a, x) => a + x.q, 0));

  // A gesture: from the lines when it began, one op; the history keeps the state before it.
  let gesture = null;
  function begin() { gesture = { lines: E.lines, warned: false, op: null }; screen.classList.add("dragging"); }
  function preview(op) {
    const next = op && applyOp(gesture.lines, op);
    if (!next) return false;
    const was = total() + "," + E.lines.map((x) => x.q).join();
    E.lines = next; gesture.op = op;
    if (was !== total() + "," + next.map((x) => x.q).join()) haptic("select");
    repaint(); return true;
  }
  function end() {
    screen.classList.remove("dragging");
    if (!gesture) return;
    const { lines, op } = gesture;
    gesture = null;
    if (!op || lines.every((x, i) => x.q === E.lines[i].q && x.lock === E.lines[i].lock)) { E.lines = lines; repaint(); return; }
    E.history.push({ reset: E.reset, ops: E.ops, lines });
    E.ops = [...E.ops, op]; // a new array: the history keeps the old one whole
    repaint();
  }
  function limit() { if (gesture && !gesture.warned) { gesture.warned = true; post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: "warning" }); } }
  function step(dq) {
    begin();
    const T = total(), want = Math.min(maxTotal, Math.max(floor(), T + dq));
    if (want === T) limit(); else preview(["s", want]);
    end();
  }
  minus.addEventListener("click", () => step(-1));
  plus.addEventListener("click", () => step(1));

  // the dial: the angle the finger turned, in detents
  let turn = null;
  const angle = (e) => { const r = dialBox.getBoundingClientRect(); return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))); };
  dialBox.addEventListener("pointerdown", (e) => {
    if (dialBox.classList.contains("off")) return;
    dialBox.setPointerCapture(e.pointerId);
    begin();
    turn = { last: angle(e), sum: 0, from: total() };
  });
  dialBox.addEventListener("pointermove", (e) => {
    if (!turn) return;
    const a = angle(e);
    let da = a - turn.last;
    if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
    turn.last = a; turn.sum += da;
    const raw = turn.from + Math.round(turn.sum / ((2 * Math.PI) / QPR));
    const want = Math.min(maxTotal, Math.max(floor(), raw));
    if (want !== raw) limit();
    if (want !== total()) preview(["s", want]);
  });
  const stopTurn = () => { if (turn) { turn = null; end(); } };
  dialBox.addEventListener("pointerup", stopTurn);
  dialBox.addEventListener("pointercancel", stopTurn);

  // a border: dragged right, the left line takes quarters from the right one
  handles.forEach((hd, k) => {
    let drag = null;
    hd.addEventListener("pointerdown", (e) => {
      if (hd.classList.contains("fixed")) { post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: "warning" }); return; }
      e.stopPropagation();
      hd.setPointerCapture(e.pointerId);
      begin();
      const W = bar.getBoundingClientRect().width;
      drag = { x: e.clientX, px: Math.max(W / Math.max(1, total()), 6) };
      hd.classList.add("on");
    });
    hd.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const L = gesture.lines, dq = Math.round((e.clientX - drag.x) / drag.px);
      const room = dq > 0 ? L[k + 1].q : L[k].q, v = Math.min(Math.abs(dq), room);
      if (Math.abs(dq) > room) limit();
      if (!v) { E.lines = L; gesture.op = null; repaint(); return; }
      preview(dq > 0 ? ["m", k + 1, k, v] : ["m", k, k + 1, v]);
    });
    const stop = () => { if (drag) { drag = null; hd.classList.remove("on"); end(); } };
    hd.addEventListener("pointerup", stop);
    hd.addEventListener("pointercancel", stop);
  });

  function toggleLock(i) {
    begin();
    preview(["l", i, E.lines[i].lock ? 0 : 1]);
    haptic("light");
    end();
  }
  undo.addEventListener("click", () => {
    const last = E.history.pop();
    if (!last) return;
    E.reset = last.reset; E.ops = last.ops; E.lines = last.lines;
    haptic("light"); repaint();
    say("↺ Скасовано");
  });
  back.addEventListener("click", () => {
    if (E.reset && !E.ops.length) return;
    E.history.push({ reset: E.reset, ops: E.ops, lines: E.lines });
    E.reset = true; E.ops = []; E.lines = synth;
    haptic("medium"); repaint();
    say("Повернув синтезовану чернетку: збережені правки підуть після ✅");
  });
  let sent = false;
  ok.addEventListener("click", () => {
    if (sent) return; // one ✅: Telegram closes the page after the first send
    const text = approvalText(snap, E.reset, start(), E.ops, E.lines);
    window.__herApproval = text; // the local preview and the measurements read it
    post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: "success" });
    post("web_app_setup_closing_behavior", { need_confirmation: false });
    ok.classList.add("sent");
    if (TG.inside) sent = true;
    if (TG.inside) setTimeout(() => post("web_app_data_send", { data: text }), reduced ? 0 : 280);
    else say(`Боту пішло б ${new TextEncoder().encode(text).length} байт: ${E.ops.length} кроків`);
  });
  let toastTimer = 0;
  function say(message) {
    toast.textContent = message; toast.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("on"), 2600);
  }
  paint();
  return E;
}

function lineRow(snap, i, l, onLock) {
  const node = h("div", "ed-row");
  const top = h("div", "ed-line");
  const sw = h("span", "sw"); sw.style.background = color(i % 8);
  const words = h("div", "ed-words");
  words.append(h("b", "", l[0]), h("small", "", `чернетка ${hrs(l[2])} год`));
  const hours = h("div", "ed-hours"), q = h("div", "ed-q num"), chip = h("span", "chip");
  hours.append(q, chip);
  const lock = h("button", "lock");
  lock.setAttribute("aria-label", "Замок рядка");
  lock.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  lock.addEventListener("click", (e) => { e.stopPropagation(); onLock(); });
  top.append(sw, words, hours, lock);
  node.append(top);
  const tasks = (snap.tk[i] || []), use = (snap.ag[i] || []);
  let open = null;
  if (tasks.length || use.length) {
    node.classList.add("more");
    top.addEventListener("click", () => {
      if (open) { open.remove(); open = null; node.classList.remove("open"); return; }
      open = provenance(snap, i, tasks, use); node.append(open); node.classList.add("open"); haptic("select");
    });
  }
  return {
    node,
    paint(x, base) {
      q.textContent = hrs(x.q);
      const d = x.q - base;
      chip.textContent = d ? (d > 0 ? "+" : "−") + hrs(Math.abs(d)) : "";
      chip.className = "chip" + (d > 0 ? " up" : d < 0 ? " down" : "");
      lock.classList.toggle("on", x.lock);

// The living river (#273): a silhouette streamgraph whose bands breathe and flow, on Canvas 2D.
// One module for every page that draws it: the client's home and week (concept B, the owner's
// pick 2026-11-05), the owner's week (#274: hours over the days, a day by touch) and the tour's
// first step (#230). Built into the page like the tokens; no library, no network.
//
// The data stays the picture; physics only makes it breathe (docs/learn, «жива ріка»):
// 1. Shape: a monotone cubic between days (harmonic slopes, Fritsch–Butland), so a band never
//    overshoots or dips below zero between two days.
// 2. Breathing: thickness × (1 + A·Σ a_m sin(κ_m x − ω_m t + φ)), three waves with the
//    deep-water dispersion ω = √(gκ): the longest crosses the river in ~9 s, long waves run
//    faster than short ones, the frequencies are incommensurate, the pattern never repeats.
// 3. Meander: the centre line rides the two longest waves, 2.2 % of the height.
// 4. Surface: the damped wave equation u_tt = c² u_xx − γ u_t on the river's section, explicit
//    finite differences, CFL C = c·Δt/Δx ≈ 0.45 at any width, fixed 1/120 s steps, sponges at
//    the ends; a touch kicks u_t with a gaussian, two ripples run away and fade.
// 5. Entry: a damped spring per band (ω0 = 7 rad/s, ζ = 0.72: one soft overshoot), 70 ms
//    apart; the front pours in from the left.
// Only the lines move: no particles (owner, 2026-11-04). Reduced motion or `still`: one frame.
// `at` (seconds): a deterministic frame for screenshots and tests, `tap` (0..1) and `after`.
"use strict";

const River = (() => {

  const GAMMA = 1.6, SPONGE = 6, EDGE = 10, SPEED = 2.2; // the surface: damping, ends, c = L/2.2 s

  $("#cb-news").addEventListener("click", (e) => {

    if (b.dataset.go != null) { haptic("select"); go({ kind: "day", day: Number(b.dataset.go) }); }
  });

  // ---- a chip leads to its edit (#315): the day, the line, the disk, the text, the invoice ----
  function go(e) {
    const t = goTarget(W, e);
    closeDrawer();
    if (t.mode) mode = t.mode;
    if (!show(t.step)) return;
    if (t.day != null) { sel = t.day; flashDay = t.day; clearTimeout(flashTimer); flashTimer = setTimeout(() => { flashDay = -1; layout(); }, 1800); }
    const at = t.line != null ? `.cb-line[data-i="${t.line}"]` : t.disk ? ".cb-dial" : t.id ? `[data-id="${t.id}"]` : t.range ? `[data-pay="${CSS.escape(t.range)}"]` : t.day != null ? "#wk-stage" : null;

  }

  // ---- «Правки» from any step (#315): every edit as a chip — its tap leads there, ↩ undoes -----
  const KIND = { day: "Дні", act: "Поза репо", rule: "Правила", line: "Рядки", lock: "Замки", steps: "Разом", text: "Тексти", pay: "Оплата" };
  const PART = { t: "Назва", v: "Цінність", r: "Ризик", d: "What we did", m: "Лист", x: "What's next" };
  const short = (t) => (t.length > 26 ? `${t.slice(0, 25)}…` : t) || "—";
  function chip(e) {
    let label;
    if (e.kind === "day") label = `${WEEK_DAYS[dow(e.day)]} ${dm(day(iso(e.day)))} · ${hrs(e.now)} <s>${hrs(e.was)}</s>`;
    else if (e.kind === "act") label = `${esc(W.kc[e.code][0])} · ${e.days.length === 1 ? dm(day(iso(e.days[0]))) : `${e.days.length} дн`} · ${hrs(e.now)}`;
    else if (e.kind === "steps") label = `${e.now > 0 ? "+" : "−"}${Math.abs(e.now) * Math.round(W.sp * 100)} % від моделі`;
    else if (e.kind === "line") label = `${esc(lineName(e.line))} · ${sign(e.now)}`;
    else if (e.kind === "lock") label = `🔒 ${esc(lineName(e.line))}`;
    else if (e.kind === "rule") label = `${esc(ruleText(e))}${e.off ? ` · <s>з ${dm(day(e.off))}</s>` : ""}`;
    else if (e.kind === "text") label = `${e.id.length > 1 ? `${esc(W.l[Number(e.id.slice(1))][1] || "")} · ` : ""}${PART[e.id[0]]}: «${esc(short(e.now))}»`;
    else { const tk = W.cal.tk.find((x) => x[3] === e.range); label = `${tk ? `${dm(day(tk[0]))}–${dm(day(tk[1]))}` : ""} · ${e.now ? "💵 оплачено" : "не оплачено"}`; }
    return `<span class="cb-chip${e.sent ? "" : " pend"}" data-e="${esc(e.key)}"><button class="go">${label}</button><button class="x" aria-label="Скасувати">↩</button></span>`;
  }
  function chipGroups(list) {
    const groups = {};
    list.forEach((e) => { (groups[e.kind] = groups[e.kind] || []).push(e); });
    return Object.keys(KIND).filter((k) => groups[k]).map((k) => `<div class="cb-g"><span>${KIND[k]}</span><div>${groups[k].map(chip).join("")}</div></div>`).join("");
  }
  // a chip's tap: ↩ undoes (then `after` repaints), the rest leads to the edit. False: not a chip.
  function onChip(ev, after) {
    const c = ev.target.closest("[data-e]");
    if (!c) return false;
    const ed = editList(W, E).find((x) => x.key === c.dataset.e);
    if (!ed) return true;
    if (!ev.target.closest(".x")) { haptic("select"); go(ed); return true; }
    if (undoEdit(W, E, ed)) { haptic("select"); after(); }
    else { haptic("light"); say("Без відчуття день — понад 16 год: спершу зменш поза репо"); }
    return true;
  }
  function openDrawer() {
    if (!editList(W, E).length && !unsent(W, E)) { haptic("light"); say("Без правок — рахунок як модель"); return; }
    drawerOn = true; paintDrawer(); drawer.classList.add("on"); haptic("light");
  }
  function closeDrawer() { if (drawerOn) { drawerOn = false; drawer.classList.remove("on"); } }
  function paintDrawer() {
    const list = editList(W, E), p = unsent(W, E), was = drawer.querySelector(".cb-dl");
    const top = was ? was.scrollTop : 0;
    drawer.innerHTML = `<div class="cb-sh cb-dw" role="dialog" aria-modal="true" aria-label="Правки"><i class="cb-grab"></i>

  $("#cb-go").addEventListener("click", () => {

  // ---- step 1: the calendar ------------------------------------------------------------------

  addEventListener("pointerup", calStop); addEventListener("pointercancel", calStop);
  function calendar() {
    const el = h("div", "cb-cal");
    const most = maxEnd(W), sun = sundayEnd(W), today = W.cal.t;
    const lastIso = () => iso(E.end - 1);
    // the weeks that matter: one before the start (the last invoice, locked), to the week after
    // today or the range's end — a calm grid, the month named on its first day
    const monday = (d) => isoAdd(d, -((new Date(d + "T12:00:00Z").getUTCDay() + 6) % 7));
    const from = monday(isoAdd(W.f, -7)), lastDay = isoAdd(monday(today > iso(n - 1) ? today : iso(n - 1)), 13);
    const taken = (d) => W.cal.tk.find(([a, b]) => a <= d && d <= b);
    const heat = (i) => (i < n ? weekState(W, E).days[i].total : W.cal.hx[i - n] || 0);
    const peak = Math.max(1, ...W.d.map((_, i) => heat(i)), ...W.cal.hx);
    el.innerHTML = `<div class="cb-range"><div><span class="eyebrow">Період рахунку</span><b class="num" id="cb-rg"></b></div><div class="cb-nd"><b class="num" id="cb-nd"></b><span>днів</span></div></div>
      <div class="cb-wd">${WEEK_DAYS.map((d, k) => `<span class="${k > 4 ? "we" : ""}">${d}</span>`).join("")}</div>
      <div class="cb-months"></div>
      <div class="chips cb-ends">${sun ? `<button class="chip" data-end="${sun}">до неділі · ${dm(day(iso(sun - 1)))}</button>` : ""}<button class="chip" data-end="${most}">до сьогодні · ${dm(day(iso(most - 1)))}</button></div>
      <div class="cb-legend"><span><i class="lg heat"></i>модель, год</span><span><i class="lg in"></i>рахунок</span><span><i class="lg tk"></i>виставлено</span><span><i class="lg fut"></i>майбутнє</span></div>
      <div class="cb-invs"></div>`;
    const box = el.querySelector(".cb-months"), invs = el.querySelector(".cb-invs");
    // the client's invoices: a sent one is marked paid (💵) or not (↩), sent with the rest
    function paintInvs() {
      const rows = W.cal.tk.filter((x) => x[3]).slice(-4).reverse();
      invs.innerHTML = rows.map(([a, b, st, key]) => {
        const paid = paidNow(W, E, key), pend = key in E.pay;
        const pill = st === "a" ? `<span class="cb-pill">затверджено</span>` : paid ? `<span class="cb-pill paid">оплачено</span>` : `<span class="cb-pill">надіслано</span>`;
        const btn = st === "a" ? "" : `<button class="chip${pend ? " pend" : ""}" data-pay="${esc(key)}">${paid ? "↩" : "💵 Оплачено"}</button>`;
        return `<div class="cb-iv"><span class="num">🔒 ${dm(day(a))}–${dm(day(b))}</span>${pill}${btn}</div>`;
      }).join("");
    }
    invs.addEventListener("click", (e) => {
      const b = e.target.closest("[data-pay]");
      if (!b || !togglePay(W, E, b.dataset.pay)) return;
      haptic("select"); paintInvs(); dockPaint();
    });
    paintInvs();
    function paint() {
      const cells = [];
      for (let d = from; d <= lastDay; d = isoAdd(d, 1)) {
        const i = isoDays(W.f, d), tk = taken(d), inside = i >= 0 && i < E.end, free = i >= E.end && i < most;
        let cls = "cb-d", extra = "", q = 0;
        if (tk) { cls += " tk"; if (d === tk[0]) extra = `<em>🔒</em>`; }
        else if (d > today) cls += " fut";
        else if (W.cal.s && d < W.cal.s) cls += " pre";
        else if (inside || free) { q = heat(i); cls += inside ? " in" : " free"; }
        else cls += " off";
        if (i === 0) { cls += " first"; extra = `<em class="pin">📌</em>`; }
        if (i === E.end - 1) cls += " end";

        if (inside && a < 0.5) cls += " pale";
        const date = day(d), name = date.getDate() === 1 ? `<span>${date.toLocaleDateString("uk-UA", { month: "short" }).replace(".", "")}</span>` : "";
        cells.push(`<button class="${cls}" data-i="${i}" style="--a:${a.toFixed(2)}" ${inside || free ? "" : 'tabindex="-1"'} aria-label="${dm(date)}${q ? `, ${hrs(q)} год` : ""}"><b>${date.getDate()}${name}</b>${q ? `<small class="num">${hrs(q)}</small>` : ""}${extra}</button>`);
      }
      box.innerHTML = `<div class="cb-grid">${cells.join("")}</div>`;
      el.querySelector("#cb-rg").innerHTML = `${dm(day(W.f))} <i>→</i> ${dm(day(lastIso()))}`;
      el.querySelector("#cb-nd").textContent = E.end;
      el.querySelectorAll("[data-end]").forEach((b) => b.classList.toggle("on", Number(b.dataset.end) === E.end));
      dockPaint();
    }
    const setEnd = (k) => {
      k = Math.max(1, Math.min(most, k));
      if (k === E.end) return false;
      E.end = k; haptic("select"); paint(); return true;
    };
    el.querySelectorAll("[data-end]").forEach((b) => b.addEventListener("click", () => setEnd(Number(b.dataset.end))));
    box.addEventListener("pointerdown", (e) => {
      const c = e.target.closest(".cb-d");
      if (!c) return;
      const i = Number(c.dataset.i);
      if (c.classList.contains("tk")) { haptic("light"); say("Ці дні вже в рахунку — один день, один рахунок"); return; }
      if (c.classList.contains("fut")) { haptic("light"); say("Рахунок — лише за дні, що минули"); return; }
      if (c.classList.contains("pre") || i < 0) { haptic("light"); say("Початок закріплено: перший невиставлений день"); return; }
      if (i >= most) { haptic("light"); return; }
      swipes(false);
      setEnd(i + 1);
      calMove = (ev) => {
        const cell = document.elementFromPoint(ev.clientX, ev.clientY)?.closest?.(".cb-d");
        if (cell && (cell.classList.contains("in") || cell.classList.contains("free"))) setEnd(Number(cell.dataset.i) + 1);

    });
    box.addEventListener("keydown", (e) => {
      const k = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 7, ArrowUp: -7 }[e.key];
      if (k && setEnd(E.end + k)) { e.preventDefault(); box.querySelector(".cb-d.end")?.focus(); }
    });
    paint();
    return el;
  }

  // ---- step 2: the canvas — the river and the days, or the lines -----------------------------
  let river = null, stage = null;
  function canvas() {
    const el = h("div", "cb-canvas");
    el.innerHTML = `<div class="cb-mode"><div class="cb-seg" role="tablist"><button data-m="days">Дні</button><button data-m="rows"${W.l.length ? "" : " disabled"}>Рядки</button></div><span class="num">${esc(W.t)}</span></div>
      <div class="wk-canvas"><div class="wk-stage" id="wk-stage"><canvas id="wk-rv" aria-label="Період за фічами"></canvas><div class="cb-veil" hidden></div><div class="cb-rib"></div><div class="wk-refl"></div><div class="wk-feel"></div><div class="wk-cols"></div></div><div class="legend wk-legend"></div></div>
      <section class="wk-panel" id="wk-panel"></section>`;
    stage = el.querySelector("#wk-stage");
    const seg = el.querySelectorAll(".cb-seg button");
    const paintMode = () => { seg.forEach((b) => b.classList.toggle("on", b.dataset.m === mode)); stage.classList.toggle("rows", mode === "rows"); };
    seg.forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.m === mode) return;
      mode = b.dataset.m; sel = -1; haptic("select"); paintMode(); frame();
      if (river) river.setData(riverData()); // the channel ahead is the days' only
      tweenRiver(); layout(); panel();
    }));
    paintMode();
    wireColumns();
    requestAnimationFrame(panel);
    return el;
  }
  function riverData() {
    const st = weekState(W, E), bands = [], ls = lineState(W, E).lines;
    codes.forEach((c) => {
      const v = st.days.map((d) => d.acts[c] || 0);
      if (v.some(Boolean)) bands.push({ name: W.kc[c][0], color: color(slotOf(c)), manual: true, v });
    });
    W.l.forEach((l, i) => {
      if (l[2]) return; // an activity's own line: its band is the activity's above
      const k = ls[i].base ? ls[i].q / ls[i].base : 1; // a line's edit swells its band
      const v = st.days.map((d) => (d.origRepo ? ((l[3][d.i] || 0) * d.repo * k) / d.origRepo : 0));
      if (v.some(Boolean)) bands.push({ name: l[1] || `#${i + 1}`, color: color(i), v });
    });
    if (!bands.length) bands.push({ name: "", color: "var(--track)", v: st.days.map((d) => d.total) });
    const out = { days: st.days.map((d) => iso(d.i)), bands, from: dm(day(iso(0))), to: dm(day(iso(n - 1))), week: WEEK_DAYS };
    const frac = aheadFrac();
    if (frac > 0) out.ahead = { frac, label: "", exact: true }; // the dashed channel to Sunday (#315)
    return out;
  }
  // the river's part of the width that the days after the range take, so they line up with its
  // days (river.js: 6 px a side, the channel's end 6 px in)
  function aheadFrac() {
    if (!ahead.length || mode !== "days" || !stage) return 0;
    const L = Math.max(200, stage.clientWidth) - 12;
    return 1 - ((L - 6) * (n - 1)) / (L * (n - 1 + ahead.length));
  }
  // the river gives way to an opened day: its sheet comes up under the columns (#315)
  const riverH = () => (mode === "rows" ? 120 : sel >= 0 ? 136 : 200);
  let rhTween = 0;
  function tweenRiver() {
    cancelAnimationFrame(rhTween);
    if (!river || !stage) return;

    if (from === to) return;

  }
  // the read's moved days: a ripple runs from the first one, once (#315)
  function ripple() {
    if (!river || !pinged.size) return;
    const i = Math.min(...pinged), f = river.f;
    setTimeout(() => { pinged.clear(); layout(); }, 5000); // the rings ran their three times
    if (reduced || river.o.still || river.o.at) return; // a screenshot's frame stays its own

  }
  new MutationObserver(() => river && river.retheme()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  // -- the columns: the day's hours under the river, its feel over it, a tap opens it. A picked
  // column is a slider (#288): its bar's end follows the finger, 15 min a step, 16 h at most.
  const BAR = 76; // px: a 16 h bar, its live number clear of the dates
  let scale = MAX_Q, X = [], bw = 30;
  function bar(d) {
    let y = 0, segs = "";
    const parts = [[d.repo + d.own, "var(--ink)", false], ...codes.map((c) => [d.acts[c] || 0, color(slotOf(c)), true])];
    for (const [v, c, hatch] of parts) {
      if (!v) continue;
      const hh = (v / scale) * BAR;
      segs += `<i class="${hatch ? "hs" : "rp"}" style="top:${y.toFixed(1)}px;height:${Math.max(1, hh - 2).toFixed(1)}px;background:${c}"></i>`;
      y += hh;
    }
    const ghost = d.feel != null ? `<i class="gh" style="height:${((dayQ(d.model, null, d.act) / scale) * BAR).toFixed(1)}px"></i>` : "";

  }
  const feelMark = (d) => { const f = d.feel == null ? -1 : W.fl.indexOf(d.feel); return d.feel == null ? "·" : f >= 0 ? WEEK_FEEL[f][0] : "✋"; };
  let holding = 0; // fingers on a slider: nothing redraws under them (settle() does after)
  function layout() {
    if (!river || holding || !stage || step !== 1) return;
    const st = weekState(W, E);
    X = river.f.dayX.slice();
    const gap = n > 1 ? X[1] - X[0] : 40;
    if (mode === "days") ahead.forEach((_, k) => X.push(river.f.xr + (k + 1) * gap)); // the days after the range

    const refl = [], feel = [], cols = [];

  const m = typeof e.data === "string" ? json(e.data) : null;
  if (m && m.eventType) receive(m.eventType, m.eventData);
});
const haptic = (kind) => post("web_app_trigger_haptic_feedback", kind === "select" ? { type: "selection_change" } : { type: "impact", impact_style: kind || "light" });
function viewer() { const user = json(new URLSearchParams(TG.data).get("user")); return user ? user.id : null; }

function theme(params) {
  const forced = new URLSearchParams(location.search).get("theme"); // the local preview
  if (forced === "dark" || forced === "light") document.documentElement.dataset.theme = forced;
  const bg = params && params.bg_color;
  if (bg && /^#[0-9a-f]{6}$/i.test(bg)) {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(bg.slice(i, i + 2), 16) / 255);
    document.documentElement.dataset.theme = 0.2126 * r + 0.7152 * g + 0.0722 * b < 0.5 ? "dark" : "light";
  }
  const plane = getComputedStyle(document.documentElement).getPropertyValue("--plane").trim();
  post("web_app_set_header_color", { color: plane });
  post("web_app_set_background_color", { color: plane });
  post("web_app_set_bottom_bar_color", { color: plane });
}

// ---- small helpers ----------------------------------------------------------------------
const NS = "http://www.w3.org/2000/svg";
function h(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function s(tag, attrs, parent) { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; }
function svg(box, w, height) { return s("svg", { viewBox: `0 0 ${w} ${height}`, width: "100%", role: "img" }, box); }
function text(parent, x, y, value, attrs) { const n = s("text", Object.assign({ x, y, fill: "var(--ink)", "font-size": 13 }, attrs || {}), parent); n.textContent = value; return n; }
const color = (slot) => (slot >= 0 && slot < 8 ? `var(--series-${slot + 1})` : "var(--track)");
const sum = (a) => a.reduce((x, y) => x + y, 0);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function hrs(q) { const w = Math.floor(q / 4), p = q % 4; return p ? `${w},${["25", "5", "75"][p - 1]}` : `${w}`; }
function amount(value, cur) {
  const n = Number(value), whole = Math.round(n) === n;
  const [i, f] = (whole ? n.toFixed(0) : n.toFixed(2)).split(".");
  return i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (f ? "," + f : "") + (cur ? " " + cur : "");
}
function day(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); }
function dm(date) { return `${String(date.getDate()).padStart(2, "0")}.${String(date.getMonth() + 1).padStart(2, "0")}`; }
function smooth(pts) {
  return pts.map((p, i) => {
    if (!i) return `M${p[0]},${p[1]}`;
    const q = pts[i - 1], mx = (q[0] + p[0]) / 2;
    return `C${mx},${q[1]} ${mx},${p[1]} ${p[0]},${p[1]}`;
  }).join("");
}
function arc(cx, cy, r, a0, a1) {
  a1 = Math.min(a1, a0 + Math.PI * 2 - 1e-4);
  const p = (a) => [cx + r * Math.cos(a - Math.PI / 2), cy + r * Math.sin(a - Math.PI / 2)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return `M${x0},${y0} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1},${y1}`;
}
function drawn(node, delay) { node.setAttribute("pathLength", 1); node.classList.add("draw"); if (delay) node.style.animationDelay = delay + "s"; return node; }
function glow(defs, id, c) {
  const g = s("radialGradient", { id }, defs);
  s("stop", { offset: 0, "stop-color": c, "stop-opacity": 0.75 }, g);
  s("stop", { offset: 1, "stop-color": c, "stop-opacity": 0 }, g);
  return `url(#${id})`;
}
function countUp(node, to, format) {
  if (reduced) { node.textContent = format(to); return; }
  const start = performance.now(), ms = 750;
  const step = (now) => {
    const t = Math.min(1, (now - start) / ms), e = 1 - Math.pow(1 - t, 3);
    node.textContent = format(Math.round(to * e));
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const store = {
  get(key) { try { return localStorage.getItem("her." + key); } catch (e) { return null; } },
  set(key, value) { try { localStorage.setItem("her." + key, value); } catch (e) { /* private mode */ } },
};

// ---- a card: a tap shows its next view, the dots say which, the choice is remembered -----
function card(id, title, views, opts) {
  opts = opts || {};
  const node = h("section", "card" + (views.length > 1 ? " tappable" : "") + (opts.deep ? " deep" : ""));
  node.append(h("h3", "", title));
  const hint = h("p", "hint");
  const body = h("div");
  const dots = h("div", "dots");
  node.append(hint, body);
  if (views.length > 1) node.append(dots);
  let current = Math.min(Number(store.get("view." + id)) || 0, views.length - 1);
  views.forEach((_, i) => {
    const dot = h("i");
    dot.addEventListener("click", (e) => { e.stopPropagation(); go(i); });
    dots.append(dot);
  });
  function show(i, animate) {
    current = i;
    const view = views[i];
    hint.textContent = view.hint || "";
    const box = h("div", "view" + (animate ? " in" : ""));
    body.replaceChildren(box);
    view.draw(box);
    [...dots.children].forEach((d, j) => d.classList.toggle("on", j === i));
  }
  function go(i) { if (i === current) return; haptic("select"); store.set("view." + id, i); show(i, true); }
  if (views.length > 1) node.addEventListener("click", () => go((current + 1) % views.length));
  show(current, false);
  return node;
}

// ---- views: clients ----------------------------------------------------------------------
function rings(box, P) {
  const shown = P.cl.filter((c) => c[1]).slice(0, 4);
  if (!shown.length) return box.append(h("p", "empty", "Годин за цей період немає."));
  const g = svg(box, 318, 290), cx = 159, cy = 145;
  shown.forEach((c, i) => {
    const r = 128 - i * 27;
    s("circle", { cx, cy, r, fill: "none", stroke: color(c[0]), "stroke-opacity": 0.14, "stroke-width": 20 }, g);
    drawn(s("path", { d: arc(cx, cy, r, 0, (2 * Math.PI * c[1]) / P.w), fill: "none", stroke: color(c[0]), "stroke-width": 20, "stroke-linecap": "round" }, g), i * 0.08);
  });
  const big = text(g, cx, cy + 4, "", { "text-anchor": "middle", "font-size": 30, "font-weight": 700, class: "num" });
  if (P.e) {
    countUp(big, Math.round(Number(P.e[1]) * 100), (v) => amount((v / 100).toFixed(2)));
    text(g, cx, cy + 24, `${P.e[0]} / год`, { "text-anchor": "middle", fill: "var(--muted)", "font-size": 12 });
  } else {
    big.textContent = hrs(P.w);
    text(g, cx, cy + 24, "год", { "text-anchor": "middle", fill: "var(--muted)", "font-size": 12 });
  }
  const names = h("div", "names");
  for (const c of P.cl) {
    const item = h("div");
    const sw = h("span", "sw"); sw.style.background = color(c[0]);
    item.append(sw, client(c[0])[1], h("b", "", `${hrs(c[1])} год` + (c[4] ? ` · ${amount(c[4])}` : "")));
    names.append(item);
  }
  box.append(names);
}

function tiles(box, P) {
  const shown = P.cl.filter((c) => c[1]);
  if (!shown.length) return box.append(h("p", "empty", "Годин за цей період немає."));
  const strip = h("div", "tiles");
  shown.forEach((c, i) => {
    const tile = h("div");
    tile.style.flex = c[1]; tile.style.background = color(c[0]); tile.style.animationDelay = i * 0.06 + "s";
    if (c[1] / P.w > 0.14) tile.append(client(c[0])[1], h("span", "", `${hrs(c[1])} год`));
    strip.append(tile);
  });
  const legend = h("div", "legend");
  for (const c of shown) { const it = h("span"); const sw = h("span", "sw"); sw.style.background = color(c[0]); it.append(sw, client(c[0])[1]); legend.append(it); }
  box.append(strip, legend);
}

function totals(P) { // hours per day of the window, every client
  const days = Math.round((day(P.a) - day(P.f)) / 864e5), out = new Array(days).fill(0);
  for (const [, row] of P.d) row.forEach((q, i) => { out[i] += q; });
  return out;
}

function wave(box, P) {
  const daily = totals(P), max = Math.max(1, ...daily), W = 318, H = 96;
  const g = svg(box, W, H), defs = s("defs", {}, g);
  const grad = s("linearGradient", { id: "wv", x1: 0, x2: 1 }, defs);
  s("stop", { offset: 0, "stop-color": "var(--series-1)" }, grad); s("stop", { offset: 1, "stop-color": "var(--series-7)" }, grad);
  const pts = daily.map((q, i) => [(i * W) / Math.max(1, daily.length - 1), H - 6 - (q / max) * (H - 16)]);
  s("path", { d: smooth(pts) + `L${W},${H}L0,${H}Z`, fill: "url(#wv)", "fill-opacity": 0.22, class: "fade" }, g);
  drawn(s("path", { d: smooth(pts), fill: "none", stroke: "url(#wv)", "stroke-width": 2.5 }, g));
  const row = h("div", "split");
  const gauge = h("div"), G = svg(gauge, 150, 84), cx = 75, cy = 78, r = 62;
  const paid = P.c / Math.max(1, P.c + P.u);
  const p = (a) => [cx - r * Math.cos(a), cy - r * Math.sin(a)];
  const half = (a) => { const [x0, y0] = p(0), [x1, y1] = p(a); return `M${x0},${y0} A${r},${r} 0 0 1 ${x1},${y1}`; };
  s("path", { d: half(Math.PI), fill: "none", stroke: "var(--track)", "stroke-width": 14, "stroke-linecap": "round" }, G);
  if (paid > 0) drawn(s("path", { d: half(Math.PI * paid), fill: "none", stroke: "var(--series-1)", "stroke-width": 14, "stroke-linecap": "round" }, G), 0.2);
  const pct = text(G, cx, cy - 8, "", { "text-anchor": "middle", "font-size": 24, "font-weight": 700, class: "num" });
  countUp(pct, Math.round(paid * 100), (v) => v + "%");
  const words = h("div");
  words.append(h("div", "names"));
  words.firstChild.style.gridTemplateColumns = "1fr";
  const a = h("div", "", "оплачено"); a.append(h("b", "", `${hrs(P.c)} год`));
  const b = h("div", "", "неоплачено"); b.append(h("b", "", `${hrs(P.u)} год`));
  words.firstChild.append(a, b);
  row.append(gauge, words);
  box.append(g, row);
}

function waffle(box, P) {
  const kinds = S.kn.map((k, i) => [k, sum(P.cl.map((c) => c[5][i] || 0))]).filter(([, q]) => q);
  const total = sum(kinds.map(([, q]) => q));
  if (!total) return box.append(h("p", "empty", "Годин за цей період немає."));
  const grid = h("div", "waffle"), cells = [];
  for (const [k, q] of kinds) for (let i = 0; i < Math.round((q / total) * 200); i++) cells.push(color(k[2]));
  for (let i = 0; i < 200; i++) {
    const cell = h("i");
    if (i < cells.length) cell.style.background = cells[i];
    cell.style.animationDelay = (i % 20) * 0.012 + Math.floor(i / 20) * 0.03 + "s";
    grid.append(cell);
  }
  const legend = h("div", "legend");
  for (const [k, q] of kinds) { const it = h("span"); const sw = h("span", "sw"); sw.style.background = color(k[2]); it.append(sw, `${k[1]} · ${hrs(q)} год`); legend.append(it); }
  box.append(grid, legend);
}

// ---- views: weeks ------------------------------------------------------------------------
function ribbon(box, P) {
  const weeks = P.wk, W = 318, H = 170, mid = 74, n = weeks.length;
  const max = Math.max(1, ...weeks.map((w) => w[1])), k = 60 / max;
  const x = (i) => 18 + (i * (W - 36)) / Math.max(1, n - 1);
  const g = svg(box, W, H), defs = s("defs", {}, g);
  const grad = s("linearGradient", { id: "rb", x1: 0, x2: 1 }, defs);
  s("stop", { offset: 0, "stop-color": "var(--series-7)" }, grad); s("stop", { offset: 1, "stop-color": "var(--series-1)" }, grad);
  const band = (key, op, cls) => {
    const top = weeks.map((w, i) => [x(i), mid - w[key] * k]);
    const bottom = weeks.map((w, i) => [x(i), mid + w[key] * k]).reverse();
    s("path", { d: smooth(top) + "L" + smooth(bottom).slice(1) + "Z", fill: "url(#rb)", "fill-opacity": op, class: cls }, g);
  };
  band(1, 0.28, "fade"); band(2, 0.95, "fade");
  weeks.forEach((w, i) => s("circle", { cx: x(i), cy: mid, r: 2.5, fill: "var(--surface)" }, g));
  text(g, x(0), H - 4, dm(day(weeks[0][0])), { fill: "var(--muted)", "font-size": 11 });
  text(g, x(n - 1), H - 4, dm(day(weeks[n - 1][0])), { fill: "var(--muted)", "font-size": 11, "text-anchor": "end" });
}

function columns(box, P) {
  const weeks = P.wk, W = 318, H = 176, base = 150, n = weeks.length;
  const max = Math.max(1, ...weeks.map((w) => w[1])), bw = Math.min(24, (W - 20) / n - 6);
  const x = (i) => 10 + (i * (W - 20 - bw)) / Math.max(1, n - 1);
  const g = svg(box, W, H), pts = [];
  weeks.forEach((w, i) => {
    const hw = (w[1] / max) * 104, hp = (w[2] / max) * 104;
    s("rect", { x: x(i), y: base - hw, width: bw, height: Math.max(0, hw), rx: bw / 2, fill: "var(--track)", class: "rise", style: `animation-delay:${i * 0.04}s` }, g);
    s("rect", { x: x(i), y: base - hp, width: bw, height: Math.max(0, hp), rx: bw / 2, fill: "var(--series-1)", class: "rise", style: `animation-delay:${0.1 + i * 0.04}s` }, g);
    pts.push([x(i) + bw / 2, 10 + (1 - (w[1] ? w[2] / w[1] : 0)) * 70]);
    if (n <= 8 || i % 3 === 0) text(g, x(i) + bw / 2, H - 4, dm(day(w[0])), { fill: "var(--muted)", "font-size": 10, "text-anchor": "middle" });
  });
  drawn(s("path", { d: pts.map((p, i) => `${i ? "L" : "M"}${p}`).join(""), fill: "none", stroke: "var(--ink)", "stroke-width": 2 }, g), 0.3);
  pts.forEach((p) => s("circle", { cx: p[0], cy: p[1], r: 3.5, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2, class: "fade" }, g));
}

function race(box, P) {
  const days = Math.round((day(P.a) - day(P.f)) / 864e5);
  const now = new Date(), today = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - day(P.f)) / 864e5);
  const end = Math.max(1, Math.min(days, today + 1));
  const rows = P.d.map(([slot, row]) => { let acc = 0; return [slot, Array.from({ length: end }, (_, i) => (acc += row[i] || 0))]; })
    .sort((a, b) => b[1][end - 1] - a[1][end - 1]);
  if (!rows.length) return box.append(h("p", "empty", "Годин за цей період немає."));
  const W = 318, H = 200, right = 92, max = Math.max(1, ...rows.map((r) => r[1][end - 1]));
  const x = (d) => (d * (W - right)) / Math.max(1, days - 1), y = (q) => H - 8 - (q / max) * (H - 24);
  const g = svg(box, W, H);
  [0.33, 0.66, 1].forEach((f) => s("line", { x1: 0, x2: W - right, y1: y(max * f), y2: y(max * f), stroke: "var(--grid)" }, g));
  const labels = rows.map((r) => y(r[1][end - 1]) + 4);
  for (let i = 1; i < labels.length; i++) if (labels[i] - labels[i - 1] < 16) labels[i] = labels[i - 1] + 16;
  rows.forEach(([slot, cum], i) => {
    drawn(s("path", { d: cum.map((q, d) => `${d ? "L" : "M"}${x(d)},${y(q)}`).join(""), fill: "none", stroke: color(slot), "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }, g), i * 0.1);
    s("circle", { cx: x(end - 1), cy: y(cum[end - 1]), r: 5.5, fill: color(slot), stroke: "var(--surface)", "stroke-width": 3, class: "fade" }, g);
    text(g, x(end - 1) + 12, labels[i], client(slot)[1], { "font-weight": 600 });
  });
}

// ---- views: the agent and you --------------------------------------------------------------
function agentShare(P) { // the agent's saved quarters split by its calls per client
  const known = P.g.bc.filter((r) => r[0] >= 0), weight = sum(known.map((r) => r[1]));
  const out = {};
  for (const [slot, w] of known) out[slot] = weight ? (P.g.sv * w) / weight : 0;
  return out;
}

function sankey(box, P) {
  const mine = P.cl.filter((c) => c[1]), agent = agentShare(P);
  if (!mine.length && !P.g.sv) return box.append(h("p", "empty", "За цей період ні годин, ні PR агента."));
  const slots = [...new Set([...mine.map((c) => c[0]), ...Object.keys(agent).map(Number)])];
  const you = Object.fromEntries(mine.map((c) => [c[0], c[1]]));
  const flows = slots.map((slot) => [slot, agent[slot] || 0, you[slot] || 0]).filter((f) => f[1] + f[2] > 0)
    .sort((a, b) => b[1] + b[2] - (a[1] + a[2]));
  const W = 318, H = 300, gap = 10, nodeW = 10, x0 = 66, x1 = W - 96;
  const total = sum(flows.map((f) => f[1] + f[2])), k = (H - gap * Math.max(1, flows.length - 1)) / Math.max(1, total);
  const g = svg(box, W, H), defs = s("defs", {}, g);
  const agentH = sum(flows.map((f) => f[1])) * k, youH = sum(flows.map((f) => f[2])) * k;
  const left = { agent: 0, you: agentH ? agentH + 30 : 0 };
  let ay = left.agent, yy = left.you, ry = 0;
  const m = (x0 + x1) / 2;
  flows.forEach(([slot, a, y], i) => {
    const top = ry;
    const ribbon = (sy, h0, ty, from, id) => {
      if (h0 <= 0) return;
      const gr = s("linearGradient", { id, x1: 0, x2: 1 }, defs);
      s("stop", { offset: 0, "stop-color": from }, gr); s("stop", { offset: 1, "stop-color": color(slot) }, gr);
      s("path", { d: `M${x0},${sy} C${m},${sy} ${m},${ty} ${x1},${ty} L${x1},${ty + h0} C${m},${ty + h0} ${m},${sy + h0} ${x0},${sy + h0}Z`, fill: `url(#${id})`, "fill-opacity": 0.62, class: "fade", style: `animation-delay:${i * 0.07}s` }, g);
    };
    ribbon(ay, a * k, ry, "var(--series-7)", "sa" + i); ay += a * k; ry += a * k;
    ribbon(yy, y * k, ry, "var(--ink-2)", "sy" + i); yy += y * k; ry += y * k;
    s("rect", { x: x1, y: top, width: nodeW, height: Math.max(2, ry - top), rx: 3, fill: color(slot) }, g);
    const mid = top + (ry - top) / 2;
    text(g, x1 + 18, mid - 1, client(slot)[1], { "font-weight": 600 });
    text(g, x1 + 18, mid + 15, `${hrs(Math.round(a + y))} год`, { fill: "var(--ink-2)", "font-size": 12 });
    ry += gap;
  });
  if (agentH) {
    s("rect", { x: x0 - nodeW, y: left.agent, width: nodeW, height: agentH, rx: 3, fill: "var(--series-7)" }, g);
    text(g, x0 - 16, left.agent + 13, "Агент", { "text-anchor": "end", "font-weight": 600 });
    text(g, x0 - 16, left.agent + 29, `≈${hrs(P.g.sv)}`, { "text-anchor": "end", fill: "var(--ink-2)", "font-size": 12 });
  }
  if (youH) {
    s("rect", { x: x0 - nodeW, y: left.you, width: nodeW, height: youH, rx: 3, fill: "var(--ink)" }, g);
    text(g, x0 - 16, left.you + youH / 2 - 1, "Ти", { "text-anchor": "end", "font-weight": 600 });
    text(g, x0 - 16, left.you + youH / 2 + 15, hrs(P.w), { "text-anchor": "end", fill: "var(--ink-2)", "font-size": 12 });
  }
}

function orbit(box, P) {
  const W = 318, H = 260, cx = 159, cy = 128, g = svg(box, W, H), defs = s("defs", {}, g);
  s("circle", { cx, cy, r: 74, fill: glow(defs, "core", "var(--series-7)") }, g);
  s("circle", { cx, cy, r: 96, fill: "none", stroke: "var(--track)", "stroke-width": 6 }, g);
  if (P.g.sh != null) drawn(s("path", { d: arc(cx, cy, 96, 0, 2 * Math.PI * P.g.sh), fill: "none", stroke: "var(--series-7)", "stroke-width": 6, "stroke-linecap": "round" }, g), 0.1);
  s("circle", { cx, cy, r: 114, fill: "none", stroke: "var(--grid)", "stroke-dasharray": "2 6" }, g);
  const kinds = Object.entries(P.g.s), count = sum(kinds.map(([, n]) => n));
  let i = 0;
  kinds.forEach(([, n], j) => {
    for (let t = 0; t < n; t++, i++) {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / Math.max(count, 24);
      s("circle", { cx: cx + 114 * Math.cos(a), cy: cy + 114 * Math.sin(a), r: 4.5, fill: color([0, 2, 4, 6][j % 4]), class: "fade", style: `animation-delay:${i * 0.03}s` }, g);
    }
  });
  const big = text(g, cx, cy + 6, "", { "text-anchor": "middle", "font-size": 34, "font-weight": 700, class: "num" });

// ---- views: the repos, as shapes only: no words, no numbers -------------------------------
function repoDays(R, i) { const out = new Array(R.n).fill(0); for (const [d, c, o, m, x] of R.days[i]) out[d] = c + o + m + x; return out; }
function spots(n) {
  const fixed = [[[159, 170]], [[96, 120], [222, 230]], [[92, 100], [232, 130], [150, 262]],
    [[90, 96], [234, 112], [100, 258], [230, 268]], [[78, 84], [222, 76], [250, 206], [86, 226], [172, 306]]];
  if (n <= fixed.length) return fixed[n - 1];
  return Array.from({ length: n }, (_, i) => { const r = 40 + 18 * Math.sqrt(i), a = i * 2.39996; return [159 + r * Math.cos(a) * 1.15, 180 + r * Math.sin(a)]; });
}

function sky(box, R) {
  const W = 318, H = 360, g = svg(box, W, H), defs = s("defs", {}, g), n = R.repos.length;
  if (!n) return box.replaceChildren(h("p", "empty", "Репозиторії клієнтів ще не прочитано."));
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++) s("circle", { cx: rnd() * W, cy: rnd() * H, r: rnd() * 0.9 + 0.2, fill: "var(--muted)", opacity: 0.45, class: i % 4 ? "" : "twinkle", style: `animation-delay:${rnd() * 2}s` }, g);
  const places = spots(n), activity = R.repos.map((_, i) => sum(repoDays(R, i)));
  const most = Math.max(1, ...activity);
  // repos of one client: a faint thread between them
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (R.slots[i] === R.slots[j] && R.slots[i] < 8)
    s("line", { x1: places[i][0], y1: places[i][1], x2: places[j][0], y2: places[j][1], stroke: color(R.slots[i]), "stroke-opacity": 0.3, "stroke-dasharray": "1 5" }, g);
  R.repos.forEach((_, i) => {
    const [cx, cy] = places[i], c = color(R.slots[i]), size = 22 + 30 * Math.sqrt(activity[i] / most);
    const days = repoDays(R, i), turn = (2 * Math.PI * 4.5) / R.n;
    s("circle", { cx, cy, r: size * 0.55, fill: glow(defs, "b" + i, c), class: "fade" }, g);
    days.forEach((v, d) => {
      const a = d * turn, r = 5 + (d / R.n) * size, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (!v) { if (d % 2) s("circle", { cx: x, cy: y, r: 0.9, fill: "var(--track)" }, g); return; }
      s("circle", { cx: x, cy: y, r: 1.3 + Math.sqrt(v) * 1.4, fill: c, opacity: 0.3 + 0.7 * (d / R.n), class: "fade", style: `animation-delay:${(d / R.n) * 0.6}s` }, g);
    });
    R.prs.filter((p) => p[0] === i && p[2] == null).forEach((p, j) => {
      const a = -0.7 + j * 0.85, x = cx + (size + 18) * Math.cos(a), y = cy + (size + 18) * Math.sin(a);
      const stuck = p[4] === 4, old = p[4] === 3;
      s("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: stuck ? "var(--muted)" : c, "stroke-opacity": 0.55, "stroke-dasharray": stuck ? "2 3" : "" }, g);
      if (old) s("circle", { cx: x, cy: y, r: 12, fill: glow(defs, `o${i}_${j}`, "var(--ink)"), class: "pulse" }, g);
      s("circle", { cx: x, cy: y, r: old ? 4.5 : 3, fill: stuck ? "var(--surface)" : old ? "var(--ink)" : "var(--ink-2)", stroke: stuck ? "var(--muted)" : "none", "stroke-width": 1.5 }, g);
    });
  });
}

function rivers(box, R) {
  const n = R.repos.length;
  if (!n) return box.append(h("p", "empty", "Репозиторії клієнтів ще не прочитано."));
  const W = 338, lane = 66, H = n * lane + 16, pad = 12, g = svg(box, W, H), defs = s("defs", {}, g);
  box.style.margin = "14px -10px 0";
  const x = (d) => pad + (Math.max(0, d) * (W - 2 * pad)) / Math.max(1, R.n - 1);
  s("line", { x1: x(R.n - 1), x2: x(R.n - 1), y1: 4, y2: H - 4, stroke: "var(--ink)", "stroke-opacity": 0.22, "stroke-dasharray": "2 4" }, g);
  R.repos.forEach((_, i) => {
    const base = i * lane + 48, c = color(R.slots[i]), days = repoDays(R, i);
    const amp = (v) => Math.min(13, v * 2.2);
    const top = days.map((v, d) => [x(d), base - amp(v)]), bottom = days.map((v, d) => [x(d), base + amp(v) * 0.45]).reverse();
    s("path", { d: smooth(top) + "L" + smooth(bottom).slice(1) + "Z", fill: c, "fill-opacity": 0.2, class: "fade" }, g);
    s("line", { x1: pad, x2: W - pad, y1: base, y2: base, stroke: c, "stroke-opacity": 0.45 }, g);
    R.prs.filter((p) => p[0] === i).forEach((p, j) => {
      const [, o, end, agent, st] = p, a = x(o);
      if (end != null) {
        const b = Math.max(x(end), a + 4), hgt = Math.min(36, 6 + (end - o) * 3.2);
        drawn(s("path", { d: `M${a},${base} Q${(a + b) / 2},${base - hgt * 2} ${b},${base}`, fill: "none", stroke: agent ? c : "var(--ink-2)", "stroke-width": st === 1 ? 1 : 1.8, "stroke-dasharray": st === 1 ? "1 3" : "", "stroke-linecap": "round", "stroke-opacity": st === 1 ? 0.6 : 1 }, g), (o / R.n) * 0.5);
        if (st === 0) s("circle", { cx: b, cy: base, r: 2.5, fill: agent ? c : "var(--ink-2)" }, g);
      } else {
        const stuck = st === 4, old = st === 3, yy = base - 20 - (j % 2) * 6, b = x(R.n - 1);
        const col = stuck ? "var(--muted)" : old ? "var(--ink)" : "var(--ink-2)";
        const d = o < 0 ? `M${pad},${yy} L${b},${yy}` : `M${a},${base} Q${a},${yy} ${a + 12},${yy} L${b},${yy}`;
        if (old) s("path", { d, fill: "none", stroke: col, "stroke-width": 7, "stroke-opacity": 0.25, "stroke-linecap": "round", class: "pulse" }, g);
        drawn(s("path", { d, fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": stuck ? "3 4" : "", "stroke-linecap": "round" }, g), 0.3);
        if (old) s("circle", { cx: b, cy: yy, r: 10, fill: glow(defs, `r${i}_${j}`, col), class: "pulse" }, g);
        s("circle", { cx: b, cy: yy, r: 4.5, fill: stuck ? "var(--surface)" : col, stroke: stuck ? col : "none", "stroke-width": 2 }, g);
      }
    });
  });
}

function pulse(box, R) {
  const n = R.repos.length;
  if (!n) return box.append(h("p", "empty", "Репозиторії клієнтів ще не прочитано."));
  const first = day(R.first), offset = (first.getDay() + 6) % 7; // Monday on the top row
  const cols = Math.ceil((R.n + offset) / 7), cell = Math.min(8.5, 140 / cols - 2), gap = 2;
  const gw = cols * (cell + gap), block = 132, W = 318, perRow = 2, H = Math.ceil(n / perRow) * block, g = svg(box, W, H);
  R.repos.forEach((_, i) => {
    const x0 = (i % perRow) * (W / perRow) + (W / perRow - gw) / 2, y0 = Math.floor(i / perRow) * block;
    const c = color(R.slots[i]), days = repoDays(R, i);
    days.forEach((v, d) => {
      const k = d + offset, col = Math.floor(k / 7), row = k % 7;
      s("rect", { x: x0 + col * (cell + gap), y: y0 + row * (cell + gap), width: cell, height: cell, rx: 2, fill: v ? c : "var(--track)", "fill-opacity": v ? Math.min(1, 0.28 + v * 0.14) : 0.55, class: "fade", style: `animation-delay:${col * 0.03}s` }, g);
    });
    R.prs.filter((p) => p[0] === i && p[4] === 4).forEach((p, j) =>
      s("circle", { cx: x0 + gw + 8, cy: y0 + 5 + j * 13, r: 4.5, fill: "none", stroke: "var(--muted)", "stroke-width": 1.8, "stroke-dasharray": "2 2", class: "pulse" }, g));
    // the backlog: a stream whose thickness is the open issues, melting (or swelling) left to right
    const b = R.backlog[i], most = Math.max(1, ...R.backlog.flat()), mid = y0 + 7 * (cell + gap) + 24, half = 16;
    const xs = (j) => x0 + (j * gw) / Math.max(1, b.length - 1);
    const top = b.map((v, j) => [xs(j), mid - (v / most) * half]), bottom = b.map((v, j) => [xs(j), mid + (v / most) * half]).reverse();
    const grad = s("linearGradient", { id: "bl" + i, x1: 0, x2: 1 }, g);
    s("stop", { offset: 0, "stop-color": c, "stop-opacity": 0.3 }, grad); s("stop", { offset: 1, "stop-color": c, "stop-opacity": 0.95 }, grad);
    s("path", { d: smooth(top) + "L" + smooth(bottom).slice(1) + "Z", fill: `url(#bl${i})`, class: "fade" }, g);
  });
}

const main = document.getElementById("main");
const header = document.querySelector(".top");
function render(motion) {
  const P = panel();
  const screen = h("section", "screen on" + (motion ? " " + motion : ""));
  DRAW[state.screen](screen, P);
  main.replaceChildren(screen);
  header.hidden = state.screen === "repos";
  document.getElementById("period").textContent = state.screen === "repos" ? "" : P.t;
  document.getElementById("older").disabled = state.index >= S.p[state.span].length - 1;
  document.getElementById("newer").disabled = state.index === 0;
  const spans = [...document.querySelectorAll("#spans button")].filter((b) => { b.hidden = !S.p[b.dataset.span]; return !b.hidden; });
  spans.forEach((b, i) => {
    const on = b.dataset.span === state.span;
    b.classList.toggle("on", on);
    if (on) { const pill = document.getElementById("spans-pill"); pill.style.width = `calc((100% - 8px) / ${spans.length})`; pill.style.transform = `translateX(${i * 100}%)`; }
  });
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.screen === state.screen));
}
function step(by) {
  const next = state.index + by;
  if (next < 0 || next >= S.p[state.span].length) return;
  state.index = next; haptic("light"); render(by > 0 ? "slide-r" : "slide-l");
}

function wire() {
  document.querySelectorAll("#spans button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.span === state.span) return;
    state.span = b.dataset.span; state.index = 0; haptic("light"); render("slide-l");
  }));
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.screen === state.screen) return;
    state.screen = b.dataset.screen; haptic("select"); scrollTo(0, 0); render();
  }));
  document.getElementById("older").addEventListener("click", () => step(1));
  document.getElementById("newer").addEventListener("click", () => step(-1));
  let x0 = null, y0 = null;
  main.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  main.addEventListener("touchend", (e) => {
    if (x0 == null || state.screen === "repos") return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40) step(dx > 0 ? 1 : -1); // swipe right: the window before
  }, { passive: true });
}

function gate(glyph, title, body) {

  const box = h("section", "screen on gate");

  main.replaceChildren(box);
}

// ---- the owner's key (#191): one «🔑 Ключ сторінок» in /settings, kept by Telegram ------------
const SLOT = "her_owner_key";
const KEY_HINT = "Торкнись /settings → «🔑 Ключ сторінок» у боті, який дав цю кнопку: один раз, на всіх пристроях.";
async function ownerKey() {
  let r = null;
  try { r = await invoke("getStorageValues", { keys: [SLOT] }); } catch (e) { /* an old client, a keyboard launch, a browser */ }
  return (r && r[SLOT]) || localKey.get(SLOT);
}
async function saveOwnerKey(key) {
  localKey.set(SLOT, key);
  try { await invoke("saveStorageValue", { key: SLOT, value: key }); return true; } catch (e) { return !TG.inside; }
}
// The snapshot of `field` opened with the kept key, or null after a gate that says why.
async function sealedSnapshot(field, again) {
  if (typeof DecompressionStream === "undefined") { gate("⬆️", "Онови Telegram", "Цій сторінці потрібен новіший вбудований браузер."); return null; }
  const key = await ownerKey();
  if (!key) { gate("🔑", "Відкрий з бота", "Посилання саме нічого не показує: ключ живе в Telegram. " + KEY_HINT); return null; }
  try { return await openSealed(launch.get(field), key); } catch (e) {
    if (e.kind === "unsigned") gate("⌛", "Посилання застаріло", again);
    else if (e.kind === "forged") gate("⛔", "Посилання не від Her", "Його підписав не Her, тож сторінка нічого не показує. " + again);
    else gate("🔑", "Ключ змінився", "Відкрий свіжу кнопку з бота або " + KEY_HINT[0].toLowerCase() + KEY_HINT.slice(1));
    return null;
  }
}

async function start() {
  theme(TG.theme);
  post("web_app_ready");
  post("web_app_expand");
  const local = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
  if (!TG.inside && !local) return gate("✨", "Відкрий з Telegram", "Дашборд відкривається кнопкою «✨ Дашборд» у /stats у Vector.");
  if (launch.get("k")) {
    const kept = await saveOwnerKey(launch.get("k"));
    haptic(kept ? "medium" : "light");
    return kept
      ? gate("🔑", "Ключ збережено", "Цей акаунт Telegram тепер відкриває дашборд і редактор на всіх пристроях. Повернись у чат і відкрий сторінку.")
      : gate("⚠️", "Telegram не зберіг ключ", "Онови Telegram і торкнись 🔑 ще раз.");
  }
  if (launch.get("w")) return openCabinet();
  if (launch.get("i")) return openEditor();
  if (!launch.get("d")) return gate("✨", "Немає знімка", "Натисни «✨ Дашборд» у /stats — я покладу в посилання свіжі цифри.");
  S = await sealedSnapshot("d", "Відкрий дашборд із /stats.");
  if (!S) return;
  if (S.v !== 1) return gate("⬆️", "Нова версія", "Відкрий дашборд ще раз із /stats.");
  // On top of the key (#191): this account and the snapshot's age. Launch data is unsigned,
  // so this is a reminder against a forwarded button and old numbers, not the lock.
  if (TG.inside && viewer() !== S.o) return gate("🔒", "Лише для власника", "Цей дашборд показує цифри тільки тому, для кого його зроблено.");
  if (Date.now() / 1000 > S.exp) return gate("⌛", "Знімок застарів", "Натисни «✨ Дашборд» у /stats ще раз — покажу свіжі цифри.");
  const span = launch.get("s");
  state.span = S.p[span] ? span : Object.keys(S.p)[0];
  const view = launch.get("v");
  state.screen = SCREENS.includes(view) ? view : SLICE_SCREEN[view] || "overview";
  wire();
  render();
}
// The invoice editor (#176): its own snapshot, from the 🎛 keyboard button of the 🧾 draft card.
async function openEditor() {
  const again = "Натисни «🎛 Жестами» у 🧾 чернетці ще раз.";
  const E = await sealedSnapshot("i", again);
  if (!E) return;
  if (E.v !== 1) return gate("⬆️", "Нова версія", again);
  // A keyboard button's launch names no user: only the owner's private chat has that button,
  // and the bot checks who sent the edits. A launch that names someone else is refused.
  const who = viewer();
  if (TG.inside && who != null && who !== E.o) return gate("🔒", "Лише для власника", "Цей рахунок показую тільки тому, для кого його зроблено.");
  if (Date.now() / 1000 > E.exp) return gate("⌛", "Редактор застарів", "Чернетка могла змінитися. " + again);
  editor(E);
}

start();

</script>
