<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Her · Дашборд</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --track: #d9d8d0;
  --good: #006300;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --text-hero: 52px;
  --text-title: 26px;
  --text-subtitle: 17px;
  --text-body: 16px;
  --text-label: 14px;
  --text-caption: 12px;
  --weight-regular: 400;
  --weight-medium: 510;
  --weight-semibold: 590;
  --weight-bold: 700;
  --chart-bar-max: 24;
  --chart-bar-radius: 4;
  --chart-line: 2;
  --chart-marker-radius: 4;
  --chart-gap: 2;
  --chart-grid: 1;
  --chart-area-alpha: 0.1;
  --chart-radius: 16;
  --chart-pad: 32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --track: #3a3a37;
    --good: #0ca30c;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --track: #3a3a37;
  --good: #0ca30c;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}

/* Her dashboard (#174). Colors, type and marks come from her.design (the tokens above). */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--plane); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px); overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; overflow: visible; }
[hidden] { display: none !important; } /* a gate hides the tabs: .tabs' flex would win */

/* the period: segmented control and the window, swipe to step */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--plane); padding-bottom: 6px; margin: 0 -16px; padding-inline: 16px; }
.spans { position: relative; display: flex; padding: 4px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.spans button { position: relative; z-index: 1; flex: 1; font: var(--weight-medium) 14px/32px var(--font); color: var(--muted); transition: color .3s; }
.spans button.on { color: var(--plane); }
.spans-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: var(--ink); transition: transform .45s cubic-bezier(.3,1.3,.5,1), width .45s; }
.period { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.step { width: 36px; height: 28px; font-size: 22px; line-height: 1; color: var(--ink-2); border-radius: 10px; transition: opacity .2s; }
.step:disabled { opacity: .18; }
.eyebrow { font: var(--weight-semibold) 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }

/* screens */
main { position: relative; }
.screen { display: none; }
.screen.on { display: block; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.screen.slide-l { animation: from-r .45s cubic-bezier(.2,.8,.2,1) both; }
.screen.slide-r { animation: from-l .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes from-r { from { opacity: 0; transform: translateX(40px); } }
@keyframes from-l { from { opacity: 0; transform: translateX(-40px); } }

.hero { font: var(--weight-bold) 64px/1 var(--font); letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 18px; }
.hero small { font-size: 22px; letter-spacing: 0; color: var(--ink-2); font-weight: var(--weight-medium); margin-left: 6px; }
.sub { font: 15px/1.35 var(--font); color: var(--ink-2); margin-top: 8px; font-variant-numeric: tabular-nums; }
.delta { display: inline-block; font: var(--weight-semibold) 13px/1 var(--font); margin-top: 10px; padding: 6px 10px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink-2); }
.delta.up { color: var(--good); }

/* cards: a tap shows the next view, the dots say which */
.card { position: relative; background: var(--surface); border-radius: 24px; box-shadow: inset 0 0 0 1px var(--border); padding: 20px 20px 14px; margin-top: 12px; overflow: hidden; transition: transform .2s; }
.card.tappable:active { transform: scale(.985); }
.card.deep { background: radial-gradient(120% 90% at 50% 0%, color-mix(in oklab, var(--series-7) 14%, var(--surface)), var(--surface)); }
.card h3 { font: var(--weight-semibold) 17px/1.2 var(--font); }
.card .hint { font: 13px/1.3 var(--font); color: var(--muted); margin-top: 3px; min-height: 17px; }
.view { margin-top: 14px; }
.view.in { animation: view-in .42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes view-in { from { opacity: 0; transform: translateX(24px) scale(.98); } }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--track); transition: width .35s cubic-bezier(.3,1.3,.5,1), background .35s; }
.dots i.on { width: 18px; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 13px/1.2 var(--font); color: var(--ink-2); margin-top: 12px; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 14px; }
.names div { font: 14px/1.2 var(--font); color: var(--ink-2); }
.names b { display: block; font: var(--weight-semibold) 17px/1.25 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
.empty { font: 15px/1.4 var(--font); color: var(--muted); padding: 28px 0 18px; text-align: center; }
.num { font-variant-numeric: tabular-nums; }

/* tiles (treemap strip), waffle */
.tiles { display: flex; gap: 3px; height: 128px; border-radius: 14px; overflow: hidden; }
.tiles div { min-width: 6px; border-radius: 6px; padding: 10px; color: #fff; font: var(--weight-semibold) 14px/1.2 var(--font); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
.tiles span { font: var(--weight-medium) 12px var(--font); opacity: .85; }
@keyframes grow { from { transform: scaleX(.2); opacity: 0; } }
.waffle { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.waffle i { aspect-ratio: 1; border-radius: 3px; background: var(--track); animation: pop .35s both; }
@keyframes pop { from { transform: scale(0); } }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }

/* the SVG marks animate in */
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fade .8s ease both; }
@keyframes fade { from { opacity: 0; } }
.rise { transform-box: fill-box; transform-origin: 50% 100%; animation: rise-bar .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise-bar { from { transform: scaleY(0); } }
.twinkle { animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.35); opacity: .55; } }

/* the bottom navigation */
.tabs { position: fixed; z-index: 4; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; padding: 6px; border-radius: 24px; background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.18); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 18px; font: var(--weight-medium) 11px/1 var(--font); color: var(--muted); transition: color .25s, background .25s; }
.tabs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--ink); background: var(--plane); }

/* the invoice screen: navigation only, the editor is #176 */
.invoice-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--grid); }
.invoice-row:first-of-type { border-top: 0; }
.invoice-row .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.invoice-row .bar i { display: block; height: 100%; border-radius: 5px; }
.invoice-row b { font: var(--weight-semibold) 15px var(--font); min-width: 92px; }
.soon { font: 13px/1.4 var(--font); color: var(--muted); margin-top: 10px; }

/* the invoice editor (#176): a dial for the total, a split bar for the shares, no keyboard */
.editor { padding-bottom: 8px; }
.ed-head { padding-top: 6px; }
.ed-head .eyebrow { text-align: left; }
.ed-client { font: var(--weight-bold) var(--text-title)/1.15 var(--font); letter-spacing: -.01em; margin-top: 8px; }
.ed-client .sw { width: 12px; height: 12px; border-radius: 6px; margin-right: 10px; vertical-align: 2px; }
.dial { position: relative; width: min(100%, 300px); margin: 6px auto 0; touch-action: none; cursor: grab; }
.dial:active { cursor: grabbing; }
.dial.off { opacity: .45; cursor: not-allowed; }
.dial-ring { transform-box: view-box; transform-origin: 150px 150px; transition: transform .38s cubic-bezier(.3,1.3,.5,1); }
.dragging .dial-ring { transition: none; }
.dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.dial-num { font: var(--weight-bold) var(--text-hero)/1 var(--font); letter-spacing: -.03em; }
.dial-unit { font: var(--weight-medium) 15px/1 var(--font); color: var(--ink-2); margin-top: 4px; }
.dial-money { font: var(--weight-medium) 14px/1 var(--font); color: var(--muted); margin-top: 10px; min-height: 14px; }
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.nudge .delta { margin-top: 0; }
.round { width: 54px; height: 40px; border-radius: 20px; background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); font: var(--weight-semibold) 14px/1 var(--font); font-variant-numeric: tabular-nums; transition: transform .15s, opacity .2s; }
.round:active { transform: scale(.94); }
.round:disabled, .ed-bar button:disabled { opacity: .35; }

.ghost-legend { display: flex; justify-content: space-between; font: var(--weight-medium) 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
.ghost { display: flex; gap: 2px; height: 6px; margin-top: 6px; border-radius: 3px; overflow: hidden; opacity: .5; }
.ghost i { min-width: 0; }
.split-bar { position: relative; height: 64px; margin-top: 8px; touch-action: none; }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 14px; background: var(--c); overflow: hidden; transition: left .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1); }
.dragging .seg { transition: none; }
.seg span { position: absolute; left: 10px; top: 9px; font: var(--weight-semibold) 13px/1 var(--font); color: #fff; opacity: .9; }
.seg.narrow span { display: none; }
.seg.locked { background: repeating-linear-gradient(135deg, var(--c) 0 6px, color-mix(in oklab, var(--c) 62%, var(--surface)) 6px 12px); }
.handle { position: absolute; top: -8px; bottom: -8px; width: 44px; margin-left: -23px; display: flex; align-items: center; justify-content: center; cursor: ew-resize; z-index: 1; transition: left .3s cubic-bezier(.2,.8,.2,1); }
.dragging .handle { transition: none; }
.handle i { width: 6px; height: 40px; border-radius: 3px; background: var(--surface); box-shadow: 0 1px 6px rgba(0,0,0,.28), inset 0 0 0 1px var(--border); transition: transform .2s cubic-bezier(.3,1.3,.5,1), height .2s; }
.handle.on i { transform: scaleX(1.5); height: 52px; }
.handle.fixed { cursor: not-allowed; }
.handle.fixed i { width: 2px; height: 64px; border-radius: 0; background: var(--surface); box-shadow: none; }

.ed-rows { margin-top: 16px; }
.ed-row { border-top: 1px solid var(--grid); }
.ed-line { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
.ed-row.more .ed-line { cursor: pointer; }
.ed-words { flex: 1; min-width: 0; }
.ed-words b { display: block; font: var(--weight-semibold) 15px/1.25 var(--font); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ed-words small { font: 12px/1.3 var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
.ed-row.more .ed-words small::after { content: " · звідки ›"; }
.ed-row.open .ed-words small::after { content: " · сховати"; }
.ed-hours { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 52px; }
.ed-q { font: var(--weight-semibold) 20px/1 var(--font); }
.chip { font: var(--weight-semibold) 11px/1 var(--font); font-variant-numeric: tabular-nums; padding: 3px 7px; border-radius: 99px; color: var(--muted); }
.chip:empty { display: none; }
.chip.up { color: var(--good); background: color-mix(in oklab, var(--good) 12%, transparent); }
.chip.down { color: var(--ink-2); background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); }
.lock { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background .2s, color .2s, transform .15s; }
.lock:active { transform: scale(.9); }
.lock svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
.lock .shackle { transition: transform .3s cubic-bezier(.3,1.3,.5,1); transform-origin: 16px 11px; transform: rotate(28deg) translateY(-1px); }
.lock.on { color: var(--plane); background: var(--ink); }
.lock.on .shackle { transform: none; }
.ed-row.locked .ed-q { color: var(--ink-2); }

/* owner-only provenance: threads from a line to its tasks, their repos' days, the agent */
.prov { padding: 2px 0 16px; animation: view-in .38s cubic-bezier(.2,.8,.2,1) both; }
.prov-note { font: var(--weight-medium) 11px/1.3 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.threads { position: relative; margin-top: 10px; padding-left: 34px; min-height: 40px; }
.thread-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.thread-node { position: absolute; left: 4px; top: 8px; width: 14px; height: 14px; border-radius: 7px; box-shadow: 0 0 0 4px color-mix(in oklab, var(--surface) 70%, transparent); }
.thread { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; }
.task { grid-column: 1 / -1; justify-self: start; max-width: 100%; font: 13px/1.3 var(--font); padding: 6px 10px; border-radius: 10px; background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task em { font-style: normal; font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.thread small { font: 11px/1 var(--font); color: var(--muted); padding-left: 10px; }
.heat { display: flex; gap: 2px; justify-self: end; }
.heat i { width: 9px; height: 9px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; animation: pop .35s both; }
.heat i::after { content: ""; position: absolute; inset: 0; background: var(--c); opacity: var(--a); }
.agent-use { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.agent-use svg { width: 104px; flex: none; }
.agent-words h4 { font: var(--weight-semibold) 14px/1.2 var(--font); }
.agent-words b { display: block; font: var(--weight-semibold) 13px/1.3 var(--font); margin-top: 8px; font-variant-numeric: tabular-nums; }
.agent-words .legend { margin-top: 4px; font-size: 12px; gap: 4px 10px; }

.src-strip { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 14px; }
.src-strip i { min-width: 3px; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }

/* the action bar replaces the tabs in the editor */
.ed-bar { position: fixed; z-index: 4; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 6px; padding: 6px; border-radius: 24px; background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.18); }
.ed-bar button { height: 48px; border-radius: 18px; font: var(--weight-semibold) 15px/1 var(--font); white-space: nowrap; transition: transform .15s, opacity .2s, background .2s; }
.ed-bar button:active { transform: scale(.96); }
.ed-undo { display: flex; align-items: center; justify-content: center; width: 52px; color: var(--ink-2); }
.ed-undo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ed-reset { padding: 0 14px; color: var(--ink-2); }
.ed-ok { flex: 1; background: var(--ink); color: var(--plane); font-variant-numeric: tabular-nums; }
.ed-ok::before { content: "✓"; margin-right: 8px; font-weight: var(--weight-bold); }
.ed-ok.sent { animation: sent .5s cubic-bezier(.3,1.3,.5,1); }
@keyframes sent { 40% { transform: scale(1.04); } }
.toast { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--plane); font: var(--weight-medium) 13px/1.35 var(--font); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* skeletons instead of spinners */
.sk { border-radius: 16px; background: linear-gradient(90deg, var(--surface) 0%, var(--grid) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.sk-hero { height: 64px; width: 62%; margin-top: 18px; }
.sk-line { height: 16px; width: 45%; margin-top: 12px; }
.sk-card { height: 300px; margin-top: 16px; border-radius: 24px; }
.sk-card.short { height: 160px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* when the page cannot show the numbers */
.gate { text-align: center; padding: 72px 12px; }
.gate .glyph { font-size: 44px; }
.gate h2 { font: var(--weight-semibold) 20px/1.3 var(--font); margin-top: 14px; }
.gate p { font: 15px/1.45 var(--font); color: var(--ink-2); margin-top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .draw { stroke-dashoffset: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation-delay: 0s !important; } }

/* The owner's cabinet (#303): the week's canvas (#274, concept B «Одне полотно») in a
   three-step wizard, the reference S. Tokens from her.design. */
.wk { margin: 0 -16px; padding-bottom: 24px; }
.wk-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 4px 20px 0; }
.wk-head .eyebrow { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-t { font: 12px/1 var(--font); color: var(--muted); white-space: nowrap; }
.wk-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 20px; margin-top: 14px; }
.wk-hero { font: var(--weight-bold) clamp(56px, 18vw, 76px)/0.95 var(--font); letter-spacing: -.055em; white-space: nowrap; }
.wk-hero small { font-size: 20px; letter-spacing: 0; font-weight: var(--weight-medium); color: var(--ink-2); margin-left: 6px; }
.wk-money { font: var(--weight-semibold) 18px/1 var(--font); color: var(--ink-2); white-space: nowrap; }
.wk-rng { padding: 0 20px; margin-top: 16px; }
.wk-rng .tr { position: relative; height: 4px; border-radius: 2px; background: var(--track); }
.wk-rng .band { position: absolute; top: 0; bottom: 0; border-radius: 2px; background: color-mix(in oklab, var(--status-good) 60%, var(--track)); }
.wk-rng .past { position: absolute; top: -3px; width: 10px; height: 10px; margin-left: -5px; border-radius: 5px; background: var(--plane); box-shadow: inset 0 0 0 1.5px var(--muted); }
.wk-rng .me { position: absolute; top: -8px; width: 4px; height: 20px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 3px var(--plane); transition: left .45s cubic-bezier(.3,1.3,.5,1); }
.wk-rng .lbl { position: relative; height: 14px; margin-top: 8px; font: 11px/14px var(--font); color: var(--muted); }
.wk-rng .lbl span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wk-rng .cap { margin-top: 4px; font: 11px/1.3 var(--font); color: var(--muted); }
.wk-canvas { margin-top: 18px; padding: 14px 0 12px; background: radial-gradient(120% 70% at 50% 30%, color-mix(in oklab, var(--series-7) 10%, var(--plane)), var(--plane)); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.wk-lens { display: flex; gap: 4px; padding: 0 20px 8px; }
.wk-lens button { font: var(--weight-medium) 12px/1 var(--font); padding: 7px 11px; border-radius: 99px; color: var(--muted); transition: background .25s, color .25s; }
.wk-lens button.on { background: var(--ink); color: var(--plane); }
.wk-stage { position: relative; margin: 0 12px; height: calc(var(--rh, 200px) + 152px); transition: height .35s; }
.wk-stage canvas { position: absolute; top: 18px; left: 0; width: 100%; display: block; }
.wk-refl { position: absolute; left: 0; right: 0; top: calc(var(--rh, 200px) + 26px); height: 100px; pointer-events: none; }
.wk-refl .rb { position: absolute; top: 0; height: 100px; transition: opacity .3s; }
.wk-refl .rb i { position: absolute; left: 0; right: 0; border-radius: 3px 3px 6px 6px; }
.wk-refl .rb i.rp { opacity: .8; }
.wk-refl .rb i.hs { background-image: repeating-linear-gradient(135deg, transparent 0 2px, color-mix(in oklab, var(--plane) 45%, transparent) 2px 3.5px) !important; }
.wk-refl .rt { position: absolute; left: 50%; transform: translateX(-50%); font: var(--weight-semibold) 12px/1 var(--font); color: var(--ink); white-space: nowrap; }
.wk-refl .rt em { font-style: normal; margin-left: 3px; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 8px; background: var(--status-warning); color: #3a2a00; font: 800 10px/1 var(--font); vertical-align: 1px; }
.wk-feel { position: absolute; left: 0; right: 0; top: 0; height: 18px; pointer-events: none; }
.wk-feel span { position: absolute; transform: translateX(-50%); font: 13px/18px var(--font); color: var(--muted); }
.wk-cols { position: absolute; inset: 0; }
.wk-cols button { position: absolute; top: 0; bottom: 0; border-radius: 16px; transition: background .25s; }
.wk-cols button span { position: absolute; bottom: -2px; left: 0; right: 0; text-align: center; font: 11px/1.15 var(--font); color: var(--muted); }
.wk-cols button span b { display: block; font-weight: var(--weight-semibold); color: var(--ink-2); }
.wk-cols button.sel { background: color-mix(in oklab, var(--ink) 8%, transparent); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--ink) 25%, transparent); }
.wk-cols button.sel span b { color: var(--ink); }
/* the picked column is a slider (#288): the finger owns it, the page neither scrolls nor closes */
.wk-stage { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.wk-cols button.sel { touch-action: none; cursor: ns-resize; }
.wk-refl .rb .kn { position: absolute; left: -6px; right: -6px; height: 4px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--plane); }
.wk-refl .rb.sel .rt { font-size: 15px; }
.wk-stage.picked .rb:not(.sel) { opacity: .35; }
.wk-stage .wk-refl, .wk-stage .wk-feel, .wk-stage .wk-cols { transition: opacity .3s; }
.wk-stage.client { height: 246px; }
.wk-stage.client .wk-refl, .wk-stage.client .wk-feel, .wk-stage.client .wk-cols { opacity: 0; pointer-events: none; }
.wk-legend { padding: 18px 20px 0; margin-top: 0; font-size: 12px; gap: 5px 12px; }
.sw.hatch, .wk .sw.hatch { background-image: repeating-linear-gradient(135deg, transparent 0 2px, color-mix(in oklab, var(--surface) 45%, transparent) 2px 3.5px) !important; }
.wk-panel { padding: 18px 20px 0; }
.wk-panel.in > * { animation: wk-in .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes wk-in { from { opacity: 0; transform: translateY(8px); } }
.wk-sgs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wk-sgs b { display: block; font: var(--weight-bold) 30px/1 var(--font); letter-spacing: -.035em; }
.wk-sgs b span, .wk-plw b + span { font-size: 14px; margin-left: 2px; vertical-align: 10px; }
.wk-sgs > div > span { display: block; font: 11px/1.2 var(--font); color: var(--muted); margin-top: 5px; }
.wk .up { color: var(--good); font-weight: var(--weight-bold); }
.wk .down { color: var(--status-serious); font-weight: var(--weight-bold); }
.wk-planes { display: flex; gap: 2px; height: 10px; margin: 20px 0 8px; }
.wk-planes i { border-radius: 4px; }
.wk-plw { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12px/1.3 var(--font); color: var(--ink-2); }
.wk-plw b { color: var(--ink); }
.wk-plw b + span { font-size: 11px; vertical-align: 0; }
.wk-cov { display: flex; gap: 14px; align-items: center; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
.wk-cov > div:last-child { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font: 13px/1.3 var(--font); color: var(--ink-2); }
.wk-cov b { color: var(--ink); font-weight: var(--weight-semibold); }
.wk-cov .muted { color: var(--muted); font-size: 12px; }
.wk-blind { font: 13px/1.3 var(--font); color: var(--ink-2); text-align: left; padding: 2px 0; }
.wk .ring { width: 66px; height: 66px; flex: none; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--ink) calc(var(--p) * 1%), var(--track) 0); position: relative; }
.wk .ring::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--plane); }
.wk .ring b { position: relative; z-index: 1; font: var(--weight-bold) 19px/1 var(--font); letter-spacing: -.03em; }
.wk .ring small { font-size: 11px; }
.wk-deeper { display: block; margin: 18px auto 0; padding: 8px 12px; font: var(--weight-medium) 13px/1 var(--font); color: var(--muted); }

/* the day, opened in place */
.wk-dh { display: flex; justify-content: space-between; align-items: flex-end; }
.wk-dh .eyebrow { text-align: left; }
.wk-dt { font: var(--weight-bold) 40px/1 var(--font); letter-spacing: -.03em; margin-top: 8px; }
.wk-dt small { font-size: 17px; color: var(--ink-2); font-weight: var(--weight-medium); letter-spacing: 0; }
.wk .flag { display: inline-block; margin-left: 8px; padding: 3px 7px; border-radius: 6px; font: var(--weight-semibold) 11px/1.2 var(--font); color: #3a2a00; background: var(--status-warning); vertical-align: 8px; letter-spacing: 0; }
.wk-git { text-align: right; font: 12px/1.3 var(--font); color: var(--muted); }
.wk-git b { font: var(--weight-semibold) 17px/1.2 var(--font); color: var(--ink-2); }
.wk-sig { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 14px; border-radius: 16px; overflow: hidden; background: var(--border); box-shadow: 0 0 0 1px var(--border); }
.wk-sig div { background: var(--surface); padding: 10px 10px 9px; }
.wk-sig b { display: block; font: var(--weight-semibold) 20px/1.1 var(--font); letter-spacing: -.02em; }
.wk-sig b i { font-style: normal; color: var(--muted); font-weight: 400; margin: 0 2px; }
.wk-sig span { font: 11px/1.2 var(--font); color: var(--muted); }
.wk .eyebrow.l { text-align: left; margin: 16px 0 8px; }
.wk .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.wk .chip { display: inline-flex; align-items: center; gap: 4px; padding: 9px 12px; border-radius: 99px; font: var(--weight-medium) 13px/1 var(--font); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); background: var(--surface); transition: transform .15s, background .2s, color .2s; }
.wk .chip:active { transform: scale(.94); }
.wk .chip.on { background: var(--ink); color: var(--plane); box-shadow: none; }
.wk .chip.less { padding: 9px 13px; font-weight: var(--weight-semibold); }
.wk .chip.reset { padding: 9px 12px; color: var(--ink); }
/* an activity outside git: a slider 0–16 h (#288) — name and hours over the track, «−» after it */
.wk-acts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.wk-acts:empty { display: none; }
.wk-act { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; }
.wk-an { justify-self: start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; font: var(--weight-medium) 13px/1.2 var(--font); color: var(--ink); }
.wk-an span { color: var(--muted); font-size: 11px; }
.wk-av { font: var(--weight-semibold) 15px/1 var(--font); }
.wk-tr { position: relative; height: 40px; touch-action: pan-y; cursor: ew-resize; outline: none; }
.wk-tr i { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: linear-gradient(to right, var(--c) var(--p), var(--track) var(--p)); }
.wk-tr b { position: absolute; top: 50%; left: var(--p); width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 5px rgba(0,0,0,.22), inset 0 0 0 1.5px var(--ink); transition: transform .15s; }
.wk-tr:active b, .wk-tr[data-busy] b { transform: scale(1.18); }
.wk-tr:focus-visible b { box-shadow: 0 0 0 3px color-mix(in oklab, var(--ink) 30%, transparent), inset 0 0 0 1.5px var(--ink); }
.wk .chip .sw { margin-right: 2px; }
.wk-lines { margin-top: 14px; font: 13px/1.4 var(--font); color: var(--ink-2); }
.wk-lines summary { list-style: none; cursor: pointer; color: var(--muted); font-weight: var(--weight-medium); padding: 6px 0; }
.wk-lines summary::-webkit-details-marker { display: none; }
.wk-lines .row-t { display: flex; gap: 6px; align-items: center; padding: 7px 0; border-top: 1px solid var(--border); }
.wk-lines .row-t em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 12px; }

/* #315: after 🔄 — the river gives way to a day, the days after the range, the rules' ribbons */
.wk-stage.tw { transition: none; }
.cb-veil { position: absolute; top: 14px; bottom: 34px; border-left: 1.5px dashed color-mix(in oklab, var(--ink) 28%, transparent); background: linear-gradient(to right, color-mix(in oklab, var(--plane) 55%, transparent), color-mix(in oklab, var(--plane) 25%, transparent)); pointer-events: none; }
.cb-veil span { position: absolute; top: 2px; left: 8px; font: var(--weight-medium) 10px/1 var(--font); letter-spacing: .02em; color: var(--muted); white-space: nowrap; }
.wk-refl .rb.out { opacity: .32; }
.wk-refl .rb.out .rt { font-size: 10.5px; color: var(--ink-2); }
.wk-refl .rb.fut { height: 30px; border: 1px dashed color-mix(in oklab, var(--ink) 30%, transparent); border-top: 0; border-radius: 0 0 6px 6px; opacity: .8; }
.wk-stage.picked .rb.out, .wk-stage.picked .rb.fut { opacity: .18; }
.wk-cols button.ax span, .wk-cols button.ax span b { color: color-mix(in oklab, var(--muted) 70%, transparent); }
.wk-refl .rb.new::after, .wk-refl .rb.flash::after { content: ""; position: absolute; left: -7px; right: -7px; top: -6px; height: 92px; border-radius: 12px; box-shadow: 0 0 0 2px var(--series-1); opacity: 0; animation: cb-ping 1.6s ease-out 3; }
.wk-refl .rb.flash::after { box-shadow: 0 0 0 2px var(--ink); animation-iteration-count: 1; }
@keyframes cb-ping { 0% { opacity: .9; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.12); } }
.cb-rib { position: absolute; left: 0; right: 0; top: calc(var(--rh, 200px) + 21px); height: 0; pointer-events: none; }
.cb-rib i { position: absolute; height: 0; }
.cb-rib .ln { border-top: 1px solid color-mix(in oklab, var(--c) 55%, transparent); }
.cb-rib .dt { height: 3px; margin-top: -1px; border-radius: 2px; background: var(--c); }
.cb-rib .fu { border-top: 2px dotted color-mix(in oklab, var(--c) 70%, transparent); margin-top: -.5px; }
.cb-rib .pl { position: absolute; transform: translateY(-100%); margin-top: -4px; padding: 3px 7px; border-radius: 99px; font: var(--weight-semibold) 9.5px/1 var(--font); color: var(--ink-2); background: var(--surface); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--c) 60%, transparent); white-space: nowrap; }

/* #315: the banner after 🔄 — what changed, the days the owner holds, ↩ */
.cb-news { margin: 12px 16px 0; padding: 9px 8px 9px 12px; border-radius: 16px; background: color-mix(in oklab, var(--series-1) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--series-1) 24%, transparent); animation: wk-in .45s cubic-bezier(.2,.8,.2,1) both; }
.cb-nt { display: flex; align-items: center; gap: 8px; font: 13px/1.25 var(--font); color: var(--ink-2); }
.cb-nt > i { font-style: normal; }
.cb-nt span { flex: 1; min-width: 0; }
.cb-nt b { color: var(--ink); font-weight: var(--weight-semibold); }
.cb-nt small { font: 11px/1 var(--font); color: var(--muted); }
.cb-nx { width: 28px; height: 28px; border-radius: 14px; color: var(--muted); font-size: 12px; }
.cb-npl { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.cb-np { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 99px; font: var(--weight-medium) 12px/1 var(--font); color: var(--ink-2); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.cb-np b { color: var(--good, var(--status-good)); font-weight: var(--weight-semibold); }
.cb-np.held { padding: 0; overflow: hidden; }
.cb-np.held > button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 4px 6px 10px; font: inherit; color: inherit; }
.cb-np.held small { font: 11px/1 var(--font); color: var(--muted); }
.cb-np .x { width: 30px; align-self: stretch; justify-content: center; padding: 0; border-left: 1px solid var(--border); color: var(--ink); }

/* a chip's place, rung when a chip leads there */
.cb-flash { animation: cb-flash 1.6s ease-out; border-radius: 14px; }
@keyframes cb-flash { 0%, 40% { box-shadow: 0 0 0 3px color-mix(in oklab, var(--series-1) 70%, transparent); background-color: color-mix(in oklab, var(--series-1) 10%, transparent); } }

/* ---- the cabinet's frame: the steps, the hint, the dock ---------------------------------- */
.cab { padding-top: 2px; }
.cb-head { display: flex; align-items: center; gap: 10px; padding: 6px 16px 0; }
.cb-steps { flex: 1; display: flex; margin: 0; padding: 0; list-style: none; position: relative; }
.cb-steps li { flex: 1; position: relative; }
.cb-steps li + li::before { content: ""; position: absolute; top: 15px; right: 50%; width: 100%; height: 2px; background: var(--track); transition: background .35s; }
.cb-steps li:has(.on, .done) + li::before { background: var(--ink); }
.cb-steps li:has(.done) + li:has(.done, .on)::before { background: var(--ink); }
.cb-steps button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; font: 12px/1 var(--font); color: var(--muted); }
.cb-steps i { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 15px; font: var(--weight-semibold) 13px/1 var(--font); font-style: normal; background: var(--plane); box-shadow: inset 0 0 0 1.5px var(--track); transition: background .3s, color .3s, box-shadow .3s, transform .3s cubic-bezier(.3,1.4,.5,1); }
.cb-steps .on { color: var(--ink); font-weight: var(--weight-semibold); }
.cb-steps .on i { box-shadow: inset 0 0 0 2px var(--ink), 0 0 0 5px color-mix(in oklab, var(--ink) 10%, transparent); transform: scale(1.06); }
.cb-steps .done i { background: var(--ink); color: transparent; box-shadow: none; position: relative; }
.cb-steps .done i::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--plane); font-size: 14px; }
.cb-gh { flex: none; width: 46px; height: 46px; border-radius: 23px; display: grid; place-items: center; align-content: center; gap: 1px; box-shadow: inset 0 0 0 1px var(--border); background: var(--surface); color: var(--ink); transition: transform .15s; }
.cb-gh:active { transform: scale(.92) rotate(-30deg); }
.cb-gh svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cb-gh small { font: 9px/1 var(--font); color: var(--muted); }
.cb-hint { display: flex; align-items: center; gap: 8px; margin: 12px 16px 0; font: 13px/1.3 var(--font); color: var(--ink-2); }
.cb-hint b { padding: 3px 6px; border-radius: 6px; background: var(--ink); color: var(--plane); font: var(--weight-semibold) 11px/1 var(--font); }
.cb-body { padding-top: 14px; }
.cb-body.in > * { animation: wk-in .45s cubic-bezier(.2,.8,.2,1) both; }
.cb-dock { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 16px calc(env(safe-area-inset-bottom, 0px) + 14px); background: color-mix(in oklab, var(--plane) 88%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--border); }
.cb-sum { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 10px; }
.cb-sum b { font: var(--weight-bold) 32px/1 var(--font); letter-spacing: -.04em; white-space: nowrap; }
.cb-sum b small { font-size: 15px; letter-spacing: 0; font-weight: var(--weight-medium); color: var(--ink-2); }
.cb-sum span { font: var(--weight-medium) 15px/1 var(--font); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-st { grid-column: 1 / -1; justify-self: start; margin: 3px 0 0 -6px; padding: 3px 6px; border-radius: 8px; font: 12px/1.2 var(--font); color: var(--muted); text-align: left; }
.cb-st.pend { color: var(--ink); font-weight: var(--weight-medium); }
.cb-st:not(:disabled):active { background: color-mix(in oklab, var(--ink) 8%, transparent); }
.cab .dot, .cb-dock .dot, .cb-drw .dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 4px; background: var(--status-warning); vertical-align: 1px; animation: cb-pulse 1.8s ease-in-out infinite; }
@keyframes cb-pulse { 50% { opacity: .35; } }
.cb-go { flex: none; height: 54px; padding: 0 22px; border-radius: 27px; background: var(--ink); color: var(--plane); font: var(--weight-semibold) 16px/1 var(--font); box-shadow: 0 8px 22px rgba(0,0,0,.18); transition: transform .15s, background .3s; white-space: nowrap; max-width: 62%; overflow: hidden; text-overflow: ellipsis; }
.cb-go:active { transform: scale(.95); }
.cb-go.ok { background: var(--status-good); color: #fff; }
.cb-go:disabled { opacity: .35; }
.cb-go.sent { animation: sent .5s cubic-bezier(.3,1.3,.5,1); }
body:has(.cab) { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); }

/* ---- step 1: the calendar --------------------------------------------------------------- */
.cb-cal { padding: 0 16px; }
.cb-range { display: flex; justify-content: space-between; align-items: flex-end; }
.cb-range .eyebrow { display: block; text-align: left; }
.cb-range b { display: block; margin-top: 6px; font: var(--weight-bold) clamp(34px, 11vw, 44px)/1 var(--font); letter-spacing: -.04em; }
.cb-range b i { font-style: normal; font-weight: 300; color: var(--muted); }
.cb-nd { text-align: right; }
.cb-nd b { font-size: clamp(34px, 11vw, 44px); }
.cb-nd span { font: 12px/1 var(--font); color: var(--muted); }
.cb-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 20px 0 6px; text-align: center; font: 11px/1 var(--font); color: var(--muted); }
.cb-wd .we { opacity: .7; }
.cb-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; touch-action: none; -webkit-user-select: none; user-select: none; }
.cb-d { position: relative; aspect-ratio: 1 / .92; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: var(--weight-semibold) 15px/1 var(--font); color: var(--ink-2); transition: background .25s, color .25s, transform .2s cubic-bezier(.3,1.4,.5,1), box-shadow .25s; }
.cb-d small { font: 10px/1 var(--font); opacity: .85; }
.cb-d em { position: absolute; top: -5px; right: -4px; font-style: normal; font-size: 11px; }
.cb-d.pre, .cb-d.off { color: color-mix(in oklab, var(--muted) 60%, transparent); }
.cb-d.fut { color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); background-image: repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in oklab, var(--border) 70%, transparent) 5px 6px); }
.cb-d.tk { background: color-mix(in oklab, var(--ink) 9%, var(--plane)); color: var(--muted); }
.cb-d.in { color: #fff; background: color-mix(in oklab, var(--series-1) calc(var(--a) * 100%), color-mix(in oklab, var(--series-1) 22%, var(--plane))); box-shadow: 0 0 0 0 transparent; }
.cb-d.in small { color: rgba(255,255,255,.88); }
.cb-d.in.pale, .cb-d.in.pale small { color: var(--ink); }

.cb-d.free { background: color-mix(in oklab, var(--series-1) calc(var(--a) * 22%), var(--plane)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--series-1) 30%, var(--border)); }
.cb-d.first em.pin { top: -7px; left: -5px; right: auto; font-size: 13px; }

.cb-d:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.cb-ends { margin-top: 18px; }
.cab .chip { display: inline-flex; align-items: center; gap: 4px; padding: 10px 14px; border-radius: 99px; font: var(--weight-medium) 13px/1 var(--font); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); background: var(--surface); transition: transform .15s, background .2s, color .2s; }
.cab .chip.on { background: var(--ink); color: var(--plane); box-shadow: none; }
.cab .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cb-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 16px; font: 11px/1.3 var(--font); color: var(--muted); }
.cb-legend span { display: inline-flex; align-items: center; gap: 5px; }
.lg { width: 14px; height: 10px; border-radius: 3px; display: inline-block; }
.lg.heat { background: linear-gradient(to right, color-mix(in oklab, var(--series-1) 30%, var(--plane)), var(--series-1)); }
.lg.in { box-shadow: inset 0 0 0 1.5px var(--ink); }
.lg.tk { background: color-mix(in oklab, var(--ink) 14%, var(--plane)); }
.lg.fut { box-shadow: inset 0 0 0 1px var(--border); background-image: repeating-linear-gradient(135deg, transparent 0 2px, var(--border) 2px 3px); }

/* ---- step 2: the canvas ----------------------------------------------------------------- */
.cb-mode { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 10px; }
.cb-mode > span { font: 12px/1 var(--font); color: var(--muted); }
.cb-seg { display: flex; padding: 3px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.cb-seg button { padding: 9px 20px; border-radius: 11px; font: var(--weight-medium) 14px/1 var(--font); color: var(--ink-2); transition: background .25s, color .25s; }
.cb-seg button.on { background: var(--ink); color: var(--plane); }
.cb-seg button:disabled { opacity: .35; }
.cab .wk-canvas { margin-top: 0; }
.wk-stage.rows { height: 150px; }
.wk-stage.rows .wk-refl, .wk-stage.rows .wk-feel, .wk-stage.rows .wk-cols { opacity: 0; pointer-events: none; }
.wk-refl .rb i.gh { left: -3px; right: -3px; top: 0; border-radius: 4px; background: none !important; box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--ink) 45%, transparent); border: 0; opacity: .7; }
.wk-refl .rt u { display: block; text-decoration: none; margin-top: 2px; font: var(--weight-semibold) 10px/1 var(--font); color: var(--series-1); }
.cb-was { display: inline-block; margin-top: 6px; font: 12px/1 var(--font); color: var(--muted); }
button.cb-was { color: var(--ink-2); padding: 5px 9px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--border); }

/* «Рядки»: the disk, the strip, the lines */
.cb-rows { padding-bottom: 8px; }
.cb-disk { display: flex; align-items: center; justify-content: center; gap: 14px; }
.cb-disk .round { width: 48px; height: 48px; border-radius: 24px; font: 300 26px/1 var(--font); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); background: var(--surface); transition: transform .15s; }
.cb-disk .round:active { transform: scale(.9); }
.cb-dial { position: relative; width: min(62vw, 240px); aspect-ratio: 1; touch-action: none; cursor: grab; outline: none; -webkit-user-select: none; user-select: none; }
.cb-dial svg { width: 100%; height: 100%; overflow: visible; }
.cb-dial .dial-ring { transform-origin: 50% 50%; transform-box: view-box; transition: transform .12s ease-out; }
.cb-dial.off { opacity: .45; cursor: not-allowed; }
.cb-dial:focus-visible { box-shadow: 0 0 0 3px color-mix(in oklab, var(--ink) 25%, transparent); border-radius: 50%; }
.cb-dc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.cb-dc b { font: var(--weight-bold) 44px/1 var(--font); letter-spacing: -.04em; }
.cb-dc span { font: 13px/1 var(--font); color: var(--ink-2); margin-top: 2px; }
.cb-dc em { font: var(--weight-medium) 14px/1 var(--font); font-style: normal; color: var(--muted); margin-top: 8px; }
.cb-dv { margin: 10px 16px 0; text-align: center; font: 13px/1.3 var(--font); color: var(--muted); }
.cb-dv b { color: var(--ink); font-weight: var(--weight-semibold); }
.cb-dv .ln { display: inline-block; width: 14px; height: 2px; margin-right: 4px; vertical-align: 4px; background: var(--ink-2); opacity: .55; }
.cb-strip { margin: 18px 16px 0; }
.cb-ghost { display: flex; gap: 2px; height: 4px; opacity: .45; margin-bottom: 6px; }
.cb-ghost i { border-radius: 2px; }
.cb-bar { display: flex; align-items: stretch; height: 52px; touch-action: none; -webkit-user-select: none; user-select: none; }
.cb-bar .seg { min-width: 4px; border-radius: 12px; background: var(--c); transition: flex .18s ease-out; position: relative; }
.cb-bar .seg.locked { background-image: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in oklab, var(--plane) 40%, transparent) 4px 6px); }
.cb-bar .seg.manual { background-image: repeating-linear-gradient(135deg, transparent 0 2px, color-mix(in oklab, var(--plane) 45%, transparent) 2px 3.5px); opacity: .85; }
.cb-bar .hd { flex: none; width: 14px; margin: 0 -2px; position: relative; z-index: 1; display: grid; place-items: center; cursor: ew-resize; }
.cb-bar .hd i { width: 5px; height: 30px; border-radius: 3px; background: var(--plane); box-shadow: 0 0 0 1px var(--border), 0 1px 4px rgba(0,0,0,.2); transition: transform .15s; }
.cb-bar .hd.on i { transform: scaleY(1.2) scaleX(1.3); }
.cb-bar .hd.fixed { cursor: not-allowed; }
.cb-bar .hd.fixed i { opacity: .35; }
.cb-lh { display: flex; justify-content: space-between; margin: 22px 16px 4px; }
.cb-lh .eyebrow { text-align: left; }
.cb-list { padding: 0 16px; }
.cb-line { display: grid; grid-template-columns: auto 1fr auto auto auto; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); }
.cb-line .sw { width: 10px; height: 10px; border-radius: 5px; }
.cb-ln { min-width: 0; }
.cb-ln b { display: block; font: var(--weight-semibold) 15px/1.25 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cb-ln small { font: 12px/1.3 var(--font); color: var(--muted); }
.cb-ln u { text-decoration: none; color: var(--series-1); font-weight: var(--weight-semibold); }
.cb-lq { font: var(--weight-semibold) 18px/1 var(--font); }
.cb-pm { display: flex; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--border); }
.cb-pm button { width: 36px; height: 36px; font: 18px/1 var(--font); color: var(--ink-2); }
.cb-pm button:disabled { opacity: .25; }
.cb-line .cb-lock { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); }
.cb-line .cb-lock svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
.cb-line .cb-lock .shackle { transition: transform .25s; transform-origin: 16px 11px; }
.cb-line .cb-lock:not(.on) .shackle { transform: translateY(-2px) rotate(25deg); }
.cb-line .cb-lock.on { color: var(--ink); }
.cb-line .cb-lock:disabled { opacity: .2; }
.cb-line.locked .cb-lq { color: var(--ink-2); }

/* ---- step 3: the review ----------------------------------------------------------------- */
.cb-review { padding: 0 16px; }
.cb-inv { text-align: center; padding: 6px 0 18px; }
.cb-big { margin-top: 10px; font: var(--weight-bold) clamp(64px, 21vw, 88px)/.95 var(--font); letter-spacing: -.06em; }
.cb-big small { font-size: 22px; letter-spacing: 0; font-weight: var(--weight-medium); color: var(--ink-2); margin-left: 4px; }
.cb-cash { margin-top: 6px; font: var(--weight-semibold) 22px/1 var(--font); color: var(--ink-2); }
.cb-vs { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px 12px; max-width: 320px; margin: 20px auto 0; font: 12px/1 var(--font); color: var(--muted); text-align: left; }
.cb-vs i { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.cb-vs i b { display: block; height: 100%; border-radius: 3px; background: var(--ink-2); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.cb-vs i.me b { background: linear-gradient(to right, var(--series-1), var(--series-7)); }
.cb-vs em { font-style: normal; color: var(--ink); font-weight: var(--weight-semibold); }
.cb-sum-l { border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 1px var(--border); padding: 4px 14px; }
.cb-sum-l > div { display: flex; align-items: center; gap: 8px; padding: 11px 0; font: 14px/1.3 var(--font); }
.cb-sum-l > div + div { border-top: 1px solid var(--border); }
.cb-sum-l b { font-weight: var(--weight-medium); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb-sum-l u { text-decoration: none; color: var(--series-1); font: var(--weight-semibold) 12px/1 var(--font); }
.cb-sum-l em { margin-left: auto; font-style: normal; color: var(--ink-2); white-space: nowrap; }
.cb-ed { margin-top: 22px; }
.cb-eh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font: 12px/1 var(--font); }
.cb-eh .eyebrow { text-align: left; }
.cb-ok { color: var(--muted); }
.cb-ok::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 4px; margin-right: 5px; background: var(--status-good); }
.cb-pd { color: var(--ink); font-weight: var(--weight-medium); }
.cb-g { display: grid; grid-template-columns: 76px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.cb-g > span { font: 12px/30px var(--font); color: var(--muted); }
.cb-g > div { display: flex; flex-wrap: wrap; gap: 6px; }
.cb-chip { display: inline-flex; align-items: stretch; overflow: hidden; border-radius: 99px; font: var(--weight-medium) 13px/1.1 var(--font); color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); transition: transform .15s; }
.cb-chip .go { display: inline-flex; align-items: center; gap: 5px; padding: 7px 6px 7px 11px; font: inherit; color: inherit; text-align: left; }
.cb-chip .x { width: 32px; display: grid; place-items: center; border-left: 1px solid var(--border); color: var(--ink-2); font-size: 13px; }
.cb-chip button:active { background: color-mix(in oklab, var(--ink) 8%, transparent); }
.cb-chip s { color: var(--muted); font-weight: 400; }
.cb-chip.pend { box-shadow: inset 0 0 0 1.5px var(--status-warning); }
.cb-none { margin: 10px 0; text-align: center; font: 14px/1.4 var(--font); color: var(--muted); }
.cb-reset, .cb-save { display: block; margin: 14px auto 0; padding: 11px 18px; border-radius: 99px; font: var(--weight-medium) 14px/1 var(--font); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); }
.cb-reset:disabled, .cb-save:disabled { opacity: .35; }
.cb-save { margin-bottom: 8px; color: var(--ink); }
.cb-meter { position: relative; margin-top: 22px; padding: 12px 14px 12px; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--border); font: 12px/1.4 var(--font); color: var(--ink-2); overflow: hidden; }
.cb-meter > i { position: absolute; left: 0; top: 0; height: 3px; background: var(--status-good); }
.cb-meter.over > i { background: var(--status-serious); }
.cb-meter b { color: var(--ink); font-weight: var(--weight-semibold); }

/* #314: what the client reads — a calm paper, every text edited in place */
.cb-paper { margin-top: 22px; }
.cb-ph { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cb-ph .eyebrow { text-align: left; }
.cb-lang { font: var(--weight-semibold) 10px/1 var(--font); letter-spacing: .08em; color: var(--muted); padding: 4px 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--border); }
.cb-mail, .cb-sheet-p { border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 1px var(--border); padding: 14px 16px; }
.cb-mail { margin-bottom: 10px; }
.cb-mail h4, .cb-ps h4 { margin: 0 0 6px; font: var(--weight-semibold) 11px/1 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cb-ps + .cb-ps { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.cb-pl + .cb-pl { margin-top: 12px; }
.cb-plt { display: flex; align-items: baseline; gap: 8px; }
.cb-plt .sw { flex: none; width: 8px; height: 8px; border-radius: 4px; transform: translateY(-1px); }
.cb-plt em { margin-left: auto; flex: none; font: 12px/1.2 var(--font); font-style: normal; color: var(--muted); white-space: nowrap; }
.cb-plv, .cb-plr { padding-left: 16px; }
.cb-plr { color: var(--muted); }
.cb-tx { display: inline; outline: none; border-radius: 4px; font: 14px/1.45 var(--font); color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; transition: background .2s, box-shadow .2s; }
.cb-tx.t { font-weight: var(--weight-semibold); color: var(--ink); }
.cb-plr .cb-tx { font-size: 12.5px; color: var(--muted); }
.cb-tx.long { display: block; }
.cb-tx:empty::before { content: attr(data-ph); color: var(--axis); }
.cb-tx:focus { background: color-mix(in oklab, var(--series-1) 9%, transparent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--series-1) 9%, transparent); }
.cb-tx.chg { box-shadow: inset 0 -1.5px 0 var(--status-warning); }
.cb-rv { margin-left: 6px; padding: 3px 7px; border-radius: 99px; font: var(--weight-medium) 11px/1 var(--font); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); white-space: nowrap; }
.cb-tx.long + .cb-rv { margin: 6px 0 0; }
/* «Рядки»: the name renames in place, a hand-made line says where it comes from */
.cb-rn { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; max-width: 100%; text-align: left; font: var(--weight-semibold) 15px/1.25 var(--font); color: var(--ink); overflow: hidden; overflow-wrap: anywhere; }
.cb-rn::after { content: " ✎"; color: var(--axis); font-weight: 400; font-size: 12px; }
.cb-ren { width: 100%; font: var(--weight-semibold) 15px/1.25 var(--font); color: var(--ink); background: var(--plane); border: 0; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; outline: 2px solid color-mix(in oklab, var(--series-1) 40%, transparent); }
.cb-hand { color: var(--ink-2); }
.cb-ln .cb-rv { margin-left: 6px; vertical-align: 1px; }
/* a day's rules: ↻ from this day, or the rule that laid it and «вимкнути» */
.cb-rls { display: grid; gap: 6px; margin: 4px 0 12px; }
.cb-rl { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font: 12.5px/1.3 var(--font); color: var(--ink-2); }
.cb-rl span { margin-right: auto; }
.cab .cb-rl .chip { padding: 7px 10px; font-size: 12px; }
/* the calendar's invoices: 💵 marks a sent one paid */
.cb-invs { display: grid; gap: 2px; margin-top: 14px; }
.cb-iv { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); font: 13px/1 var(--font); color: var(--ink-2); }
.cb-iv .cb-pill { margin-right: auto; }
.cb-pill { padding: 4px 8px; border-radius: 99px; font: var(--weight-medium) 11px/1 var(--font); color: var(--muted); background: color-mix(in oklab, var(--ink) 6%, transparent); }
.cb-pill.paid { color: var(--status-good); background: color-mix(in oklab, var(--status-good) 12%, transparent); }
.cab .chip.pend { box-shadow: inset 0 0 0 1.5px var(--status-warning); }
.cab .cb-iv .chip { padding: 8px 12px; font-size: 12.5px; }

/* the sheet: what closing the app will do, before it does */
.cb-sheet { position: fixed; inset: 0; z-index: 6; display: flex; align-items: flex-end; justify-content: center; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .25s; }
.cb-sheet.on { opacity: 1; pointer-events: auto; }
.cb-sh { width: 100%; max-width: 560px; padding: 22px 20px calc(env(safe-area-inset-bottom, 0px) + 18px); border-radius: 24px 24px 0 0; background: var(--plane); transform: translateY(24px); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.cb-sheet.on .cb-sh { transform: none; }
.cb-sh h3 { margin: 0 0 8px; font: var(--weight-bold) 20px/1.2 var(--font); }
.cb-sh p { margin: 0 0 18px; font: 14px/1.45 var(--font); color: var(--ink-2); }
.cb-sh:not(.cb-dw) div { display: flex; gap: 10px; }
.cb-sh:not(.cb-dw) > div > button { flex: 1; height: 50px; border-radius: 25px; font: var(--weight-semibold) 15px/1 var(--font); box-shadow: inset 0 0 0 1px var(--border); }
.cb-sh .cb-yes { background: var(--ink); color: var(--plane); box-shadow: none; }

/* «Правки» from any step (#315): a sheet over the step, chips lead to their edit */
.cb-drw { z-index: 5; }
.cb-dw { max-height: 78vh; display: flex; flex-direction: column; padding-top: 10px; }
.cb-grab { display: block; width: 38px; height: 4px; margin: 0 auto 12px; border-radius: 2px; background: var(--track); }
.cb-dw h3 { margin: 0; font: var(--weight-bold) 20px/1.2 var(--font); }
.cb-dw h3 span { margin-left: 4px; font-size: 14px; color: var(--muted); font-weight: var(--weight-medium); }
.cb-dl { overflow-y: auto; overscroll-behavior: contain; margin: 0 -4px; padding: 0 4px; }
.cb-dw .cb-g { grid-template-columns: 70px 1fr; }
.cb-dw p.cb-dh { margin: 10px 0 0; font: 11px/1.3 var(--font); color: var(--muted); text-align: center; }
.cb-dw .cb-df { display: flex; gap: 10px; margin-top: 12px; }
.cb-dw .cb-df button { flex: 1; height: 48px; margin: 0; border-radius: 24px; font: var(--weight-semibold) 14px/1 var(--font); box-shadow: inset 0 0 0 1px var(--border); }
.cb-dw .cb-dsave { background: var(--ink); color: var(--plane); box-shadow: none !important; }

/* desktop: the cabinet stays a calm column */
@media (min-width: 700px) {
  .cab { max-width: 520px; margin: 0 auto; }
  .cb-d:hover:not(.tk, .fut, .pre, .off) { transform: scale(1.05); }
}
@media (prefers-reduced-motion: reduce) { .cab *, .cab *::after, .cb-dock, .cb-sheet * { animation: none !important; transition: none !important; } }

</style>

<body>
<header class="top">
  <nav class="spans" id="spans" role="tablist">
    <span class="spans-pill" id="spans-pill"></span>
    <button role="tab" data-span="week">Тиждень</button>
    <button role="tab" data-span="month">Місяць</button>
    <button role="tab" data-span="quarter">Квартал</button>
  </nav>
  <div class="period">
    <button class="step" id="older" aria-label="Попередній період">‹</button>
    <span class="eyebrow" id="period">&nbsp;</span>
    <button class="step" id="newer" aria-label="Наступний період">›</button>
  </div>
</header>
<main id="main">
  <section class="screen on skeleton" aria-hidden="true">
    <div class="sk sk-hero"></div><div class="sk sk-line"></div>
    <div class="sk sk-card"></div><div class="sk sk-card short"></div>
  </section>
</main>
<nav class="tabs" id="tabs">
  <button data-screen="overview"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Огляд</button>
  <button data-screen="weeks"><svg viewBox="0 0 24 24"><path d="M3 15c3-6 5-6 7-2s4 4 6-1 3-4 5-2"/></svg>Тижні</button>
  <button data-screen="agent"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg>Агент</button>
  <button data-screen="repos"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="17" cy="6" r="1.5"/><circle cx="15" cy="16" r="2.5"/><circle cx="6" cy="17" r="1.2"/></svg>Репо</button>
  <button data-screen="invoice"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Рахунок</button>
