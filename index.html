<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Her · Дашборд</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --track: #d9d8d0;
  --good: #006300;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --text-hero: 52px;
  --text-title: 26px;
  --text-subtitle: 17px;
  --text-body: 16px;
  --text-label: 14px;
  --text-caption: 12px;
  --weight-regular: 400;
  --weight-medium: 510;
  --weight-semibold: 590;
  --weight-bold: 700;
  --chart-bar-max: 24;
  --chart-bar-radius: 4;
  --chart-line: 2;
  --chart-marker-radius: 4;
  --chart-gap: 2;
  --chart-grid: 1;
  --chart-area-alpha: 0.1;
  --chart-radius: 16;
  --chart-pad: 32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --track: #3a3a37;
    --good: #0ca30c;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --track: #3a3a37;
  --good: #0ca30c;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}

/* Her dashboard (#174). Colors, type and marks come from her.design (the tokens above). */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--plane); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px); overscroll-behavior-y: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; overflow: visible; }

/* the period: segmented control and the window, swipe to step */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--plane); padding-bottom: 6px; margin: 0 -16px; padding-inline: 16px; }
.spans { position: relative; display: flex; padding: 4px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); }
.spans button { position: relative; z-index: 1; flex: 1; font: var(--weight-medium) 14px/32px var(--font); color: var(--muted); transition: color .3s; }
.spans button.on { color: var(--plane); }
.spans-pill { position: absolute; top: 4px; bottom: 4px; left: 4px; border-radius: 10px; background: var(--ink); transition: transform .45s cubic-bezier(.3,1.3,.5,1), width .45s; }
.period { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.step { width: 36px; height: 28px; font-size: 22px; line-height: 1; color: var(--ink-2); border-radius: 10px; transition: opacity .2s; }
.step:disabled { opacity: .18; }
.eyebrow { font: var(--weight-semibold) 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }

/* screens */
main { position: relative; }
.screen { display: none; }
.screen.on { display: block; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.screen.slide-l { animation: from-r .45s cubic-bezier(.2,.8,.2,1) both; }
.screen.slide-r { animation: from-l .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes from-r { from { opacity: 0; transform: translateX(40px); } }
@keyframes from-l { from { opacity: 0; transform: translateX(-40px); } }

.hero { font: var(--weight-bold) 64px/1 var(--font); letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 18px; }
.hero small { font-size: 22px; letter-spacing: 0; color: var(--ink-2); font-weight: var(--weight-medium); margin-left: 6px; }
.sub { font: 15px/1.35 var(--font); color: var(--ink-2); margin-top: 8px; font-variant-numeric: tabular-nums; }
.delta { display: inline-block; font: var(--weight-semibold) 13px/1 var(--font); margin-top: 10px; padding: 6px 10px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink-2); }
.delta.up { color: var(--good); }

/* cards: a tap shows the next view, the dots say which */
.card { position: relative; background: var(--surface); border-radius: 24px; box-shadow: inset 0 0 0 1px var(--border); padding: 20px 20px 14px; margin-top: 12px; overflow: hidden; transition: transform .2s; }
.card.tappable:active { transform: scale(.985); }
.card.deep { background: radial-gradient(120% 90% at 50% 0%, color-mix(in oklab, var(--series-7) 14%, var(--surface)), var(--surface)); }
.card h3 { font: var(--weight-semibold) 17px/1.2 var(--font); }
.card .hint { font: 13px/1.3 var(--font); color: var(--muted); margin-top: 3px; min-height: 17px; }
.view { margin-top: 14px; }
.view.in { animation: view-in .42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes view-in { from { opacity: 0; transform: translateX(24px) scale(.98); } }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 12px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--track); transition: width .35s cubic-bezier(.3,1.3,.5,1), background .35s; }
.dots i.on { width: 18px; background: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 13px/1.2 var(--font); color: var(--ink-2); margin-top: 12px; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 6px; vertical-align: 1px; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 14px; }
.names div { font: 14px/1.2 var(--font); color: var(--ink-2); }
.names b { display: block; font: var(--weight-semibold) 17px/1.25 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
.empty { font: 15px/1.4 var(--font); color: var(--muted); padding: 28px 0 18px; text-align: center; }
.num { font-variant-numeric: tabular-nums; }

/* tiles (treemap strip), waffle */
.tiles { display: flex; gap: 3px; height: 128px; border-radius: 14px; overflow: hidden; }
.tiles div { min-width: 6px; border-radius: 6px; padding: 10px; color: #fff; font: var(--weight-semibold) 14px/1.2 var(--font); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }
.tiles span { font: var(--weight-medium) 12px var(--font); opacity: .85; }
@keyframes grow { from { transform: scaleX(.2); opacity: 0; } }
.waffle { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.waffle i { aspect-ratio: 1; border-radius: 3px; background: var(--track); animation: pop .35s both; }
@keyframes pop { from { transform: scale(0); } }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }

/* the SVG marks animate in */
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { animation: fade .8s ease both; }
@keyframes fade { from { opacity: 0; } }
.rise { transform-box: fill-box; transform-origin: 50% 100%; animation: rise-bar .7s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise-bar { from { transform: scaleY(0); } }
.twinkle { animation: twinkle 2.6s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .35; } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.35); opacity: .55; } }

/* the bottom navigation */
.tabs { position: fixed; z-index: 4; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; padding: 6px; border-radius: 24px; background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.18); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 18px; font: var(--weight-medium) 11px/1 var(--font); color: var(--muted); transition: color .25s, background .25s; }
.tabs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--ink); background: var(--plane); }

/* the invoice screen: navigation only, the editor is #176 */
.invoice-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--grid); }
.invoice-row:first-of-type { border-top: 0; }
.invoice-row .bar { flex: 1; height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.invoice-row .bar i { display: block; height: 100%; border-radius: 5px; }
.invoice-row b { font: var(--weight-semibold) 15px var(--font); min-width: 92px; }
.soon { font: 13px/1.4 var(--font); color: var(--muted); margin-top: 10px; }

/* the invoice editor (#176): a dial for the total, a split bar for the shares, no keyboard */
.editor { padding-bottom: 8px; }
.ed-head { padding-top: 6px; }
.ed-head .eyebrow { text-align: left; }
.ed-client { font: var(--weight-bold) var(--text-title)/1.15 var(--font); letter-spacing: -.01em; margin-top: 8px; }
.ed-client .sw { width: 12px; height: 12px; border-radius: 6px; margin-right: 10px; vertical-align: 2px; }
.dial { position: relative; width: min(100%, 300px); margin: 6px auto 0; touch-action: none; cursor: grab; }
.dial:active { cursor: grabbing; }
.dial.off { opacity: .45; cursor: not-allowed; }
.dial-ring { transform-box: view-box; transform-origin: 150px 150px; transition: transform .38s cubic-bezier(.3,1.3,.5,1); }
.dragging .dial-ring { transition: none; }
.dial-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.dial-num { font: var(--weight-bold) var(--text-hero)/1 var(--font); letter-spacing: -.03em; }
.dial-unit { font: var(--weight-medium) 15px/1 var(--font); color: var(--ink-2); margin-top: 4px; }
.dial-money { font: var(--weight-medium) 14px/1 var(--font); color: var(--muted); margin-top: 10px; min-height: 14px; }
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
.nudge .delta { margin-top: 0; }
.round { width: 54px; height: 40px; border-radius: 20px; background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); font: var(--weight-semibold) 14px/1 var(--font); font-variant-numeric: tabular-nums; transition: transform .15s, opacity .2s; }
.round:active { transform: scale(.94); }
.round:disabled, .ed-bar button:disabled { opacity: .35; }

.ghost-legend { display: flex; justify-content: space-between; font: var(--weight-medium) 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 14px; }
.ghost { display: flex; gap: 2px; height: 6px; margin-top: 6px; border-radius: 3px; overflow: hidden; opacity: .5; }
.ghost i { min-width: 0; }
.split-bar { position: relative; height: 64px; margin-top: 8px; touch-action: none; }
.seg { position: absolute; top: 0; bottom: 0; border-radius: 14px; background: var(--c); overflow: hidden; transition: left .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1); }
.dragging .seg { transition: none; }
.seg span { position: absolute; left: 10px; top: 9px; font: var(--weight-semibold) 13px/1 var(--font); color: #fff; opacity: .9; }
.seg.narrow span { display: none; }
.seg.locked { background: repeating-linear-gradient(135deg, var(--c) 0 6px, color-mix(in oklab, var(--c) 62%, var(--surface)) 6px 12px); }
.handle { position: absolute; top: -8px; bottom: -8px; width: 44px; margin-left: -23px; display: flex; align-items: center; justify-content: center; cursor: ew-resize; z-index: 1; transition: left .3s cubic-bezier(.2,.8,.2,1); }
.dragging .handle { transition: none; }
.handle i { width: 6px; height: 40px; border-radius: 3px; background: var(--surface); box-shadow: 0 1px 6px rgba(0,0,0,.28), inset 0 0 0 1px var(--border); transition: transform .2s cubic-bezier(.3,1.3,.5,1), height .2s; }
.handle.on i { transform: scaleX(1.5); height: 52px; }
.handle.fixed { cursor: not-allowed; }
.handle.fixed i { width: 2px; height: 64px; border-radius: 0; background: var(--surface); box-shadow: none; }

.ed-rows { margin-top: 16px; }
.ed-row { border-top: 1px solid var(--grid); }
.ed-line { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
.ed-row.more .ed-line { cursor: pointer; }
.ed-words { flex: 1; min-width: 0; }
.ed-words b { display: block; font: var(--weight-semibold) 15px/1.25 var(--font); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ed-words small { font: 12px/1.3 var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
.ed-row.more .ed-words small::after { content: " · звідки ›"; }
.ed-row.open .ed-words small::after { content: " · сховати"; }
.ed-hours { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 52px; }
.ed-q { font: var(--weight-semibold) 20px/1 var(--font); }
.chip { font: var(--weight-semibold) 11px/1 var(--font); font-variant-numeric: tabular-nums; padding: 3px 7px; border-radius: 99px; color: var(--muted); }
.chip:empty { display: none; }
.chip.up { color: var(--good); background: color-mix(in oklab, var(--good) 12%, transparent); }
.chip.down { color: var(--ink-2); background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); }
.lock { width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--muted); transition: background .2s, color .2s, transform .15s; }
.lock:active { transform: scale(.9); }
.lock svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }
.lock .shackle { transition: transform .3s cubic-bezier(.3,1.3,.5,1); transform-origin: 16px 11px; transform: rotate(28deg) translateY(-1px); }
.lock.on { color: var(--plane); background: var(--ink); }
.lock.on .shackle { transform: none; }
.ed-row.locked .ed-q { color: var(--ink-2); }

/* owner-only provenance: threads from a line to its tasks, their repos' days, the agent */
.prov { padding: 2px 0 16px; animation: view-in .38s cubic-bezier(.2,.8,.2,1) both; }
.prov-note { font: var(--weight-medium) 11px/1.3 var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.threads { position: relative; margin-top: 10px; padding-left: 34px; min-height: 40px; }
.thread-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.thread-node { position: absolute; left: 4px; top: 8px; width: 14px; height: 14px; border-radius: 7px; box-shadow: 0 0 0 4px color-mix(in oklab, var(--surface) 70%, transparent); }
.thread { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; }
.task { grid-column: 1 / -1; justify-self: start; max-width: 100%; font: 13px/1.3 var(--font); padding: 6px 10px; border-radius: 10px; background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task em { font-style: normal; font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; }
.thread small { font: 11px/1 var(--font); color: var(--muted); padding-left: 10px; }
.heat { display: flex; gap: 2px; justify-self: end; }
.heat i { width: 9px; height: 9px; border-radius: 2px; background: var(--track); position: relative; overflow: hidden; animation: pop .35s both; }
.heat i::after { content: ""; position: absolute; inset: 0; background: var(--c); opacity: var(--a); }
.agent-use { display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.agent-use svg { width: 104px; flex: none; }
.agent-words h4 { font: var(--weight-semibold) 14px/1.2 var(--font); }
.agent-words b { display: block; font: var(--weight-semibold) 13px/1.3 var(--font); margin-top: 8px; font-variant-numeric: tabular-nums; }
.agent-words .legend { margin-top: 4px; font-size: 12px; gap: 4px 10px; }

.src-strip { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 14px; }
.src-strip i { min-width: 3px; transform-origin: left; animation: grow .6s cubic-bezier(.2,.8,.2,1) both; }

/* the action bar replaces the tabs in the editor */
.ed-bar { position: fixed; z-index: 4; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; gap: 6px; padding: 6px; border-radius: 24px; background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.18); }
.ed-bar button { height: 48px; border-radius: 18px; font: var(--weight-semibold) 15px/1 var(--font); white-space: nowrap; transition: transform .15s, opacity .2s, background .2s; }
.ed-bar button:active { transform: scale(.96); }
.ed-undo { display: flex; align-items: center; justify-content: center; width: 52px; color: var(--ink-2); }
.ed-undo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ed-reset { padding: 0 14px; color: var(--ink-2); }
.ed-ok { flex: 1; background: var(--ink); color: var(--plane); font-variant-numeric: tabular-nums; }
.ed-ok::before { content: "✓"; margin-right: 8px; font-weight: var(--weight-bold); }
.ed-ok.sent { animation: sent .5s cubic-bezier(.3,1.3,.5,1); }
@keyframes sent { 40% { transform: scale(1.04); } }
.toast { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--plane); font: var(--weight-medium) 13px/1.35 var(--font); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* skeletons instead of spinners */
.sk { border-radius: 16px; background: linear-gradient(90deg, var(--surface) 0%, var(--grid) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.sk-hero { height: 64px; width: 62%; margin-top: 18px; }
.sk-line { height: 16px; width: 45%; margin-top: 12px; }
.sk-card { height: 300px; margin-top: 16px; border-radius: 24px; }
.sk-card.short { height: 160px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* when the page cannot show the numbers */
.gate { text-align: center; padding: 72px 12px; }
.gate .glyph { font-size: 44px; }
.gate h2 { font: var(--weight-semibold) 20px/1.3 var(--font); margin-top: 14px; }
.gate p { font: 15px/1.45 var(--font); color: var(--ink-2); margin-top: 8px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .draw { stroke-dashoffset: 0; }
}
@media (prefers-reduced-motion: reduce) { * { animation-delay: 0s !important; } }

</style>
</head>
<body>
<header class="top">
  <nav class="spans" id="spans" role="tablist">
    <span class="spans-pill" id="spans-pill"></span>
    <button role="tab" data-span="week">Тиждень</button>
    <button role="tab" data-span="month">Місяць</button>
    <button role="tab" data-span="quarter">Квартал</button>
  </nav>
  <div class="period">
    <button class="step" id="older" aria-label="Попередній період">‹</button>
    <span class="eyebrow" id="period">&nbsp;</span>
    <button class="step" id="newer" aria-label="Наступний період">›</button>
  </div>
</header>
<main id="main">
  <section class="screen on skeleton" aria-hidden="true">
    <div class="sk sk-hero"></div><div class="sk sk-line"></div>
    <div class="sk sk-card"></div><div class="sk sk-card short"></div>
  </section>
</main>
<nav class="tabs" id="tabs">
  <button data-screen="overview"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>Огляд</button>
  <button data-screen="weeks"><svg viewBox="0 0 24 24"><path d="M3 15c3-6 5-6 7-2s4 4 6-1 3-4 5-2"/></svg>Тижні</button>
  <button data-screen="agent"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg>Агент</button>
  <button data-screen="repos"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2"/><circle cx="17" cy="6" r="1.5"/><circle cx="15" cy="16" r="2.5"/><circle cx="6" cy="17" r="1.2"/></svg>Репо</button>
  <button data-screen="invoice"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Рахунок</button>
</nav>
<script>
// Her invoice editor (#176): the draft of one client's week (or month) edited by gestures.
// The total turns on a dial, the borders of the split bar move time between lines, a lock keeps
// a line. Every gesture is one of #179's operations; ✅ sends them to the bot with sendData.
// This file only declares: the model below runs under node in the tests (tests/test_editor.py),
// the screen uses app.js's helpers when it is called.
"use strict";

// ---- the model: the same arithmetic as her.worktime.apply --------------------------------
// A line is {q, lock}; an op is ["s", total] (SCALE), ["m", from, to, quarters] (MOVE) or
// ["l", line, 0|1] (LOCK). applyOp returns new lines, or null when the op does not fit.
function splitQ(total, weights) {
  if (!weights.length) return [];
  if (!weights.some(Boolean)) weights = weights.map(() => 1);
  const whole = weights.reduce((a, b) => a + b, 0);
  const shares = weights.map((w) => Math.floor((total * w) / whole));
  const rest = (i) => (total * weights[i]) % whole;
  const order = weights.map((_, i) => i).sort((a, b) => rest(b) - rest(a) || a - b);
  const left = total - shares.reduce((a, b) => a + b, 0);
  for (const i of order.slice(0, left)) shares[i] += 1;
  return shares;
}

function applyOp(lines, op) {
  const out = lines.map((x) => ({ q: x.q, lock: x.lock }));
  if (op[0] === "l") {
    if (!out[op[1]]) return null;
    out[op[1]].lock = Boolean(op[2]);
    return out;
  }
  if (op[0] === "m") {
    const [, i, j, v] = op;
    if (!out[i] || !out[j] || i === j || v <= 0 || out[i].lock || out[j].lock || out[i].q < v) return null;
    out[i].q -= v; out[j].q += v;
    return out;
  }
  if (op[0] === "s") {
    const fixed = out.filter((x) => x.lock).reduce((a, x) => a + x.q, 0);
    const loose = out.map((x, i) => i).filter((i) => !out[i].lock);
    if (op[1] < fixed || !loose.length) return null;
    splitQ(op[1] - fixed, loose.map((i) => out[i].q)).forEach((share, k) => { out[loose[k]].q = share; });
    return out;
  }
  return null;
}

function replayOps(start, ops) {
  let lines = start;
  for (const op of ops) { lines = applyOp(lines, op); if (!lines) return null; }
  return lines;
}

// The shortest ops from `start` to `final`: unlock, one SCALE, the MOVEs, lock. Used when the
// literal history would not fit sendData's 4096 bytes; the bot checks the result the same way.
function canonicalOps(start, final) {
  const ops = [];
  let cur = start.map((x) => ({ q: x.q, lock: x.lock }));
  cur.forEach((x, i) => { if (x.lock) { ops.push(["l", i, 0]); x.lock = false; } });
  const total = final.reduce((a, x) => a + x.q, 0);
  if (cur.length && total !== cur.reduce((a, x) => a + x.q, 0)) { ops.push(["s", total]); cur = applyOp(cur, ["s", total]); }
  const give = [], take = [];
  cur.forEach((x, i) => { const d = x.q - final[i].q; if (d > 0) give.push([i, d]); else if (d < 0) take.push([i, -d]); });
  let g = 0, t = 0;
  while (g < give.length && t < take.length) {
    const v = Math.min(give[g][1], take[t][1]);
    ops.push(["m", give[g][0], take[t][0], v]);
    give[g][1] -= v; take[t][1] -= v;
    if (!give[g][1]) g++;
    if (!take[t][1]) t++;
  }
  final.forEach((x, i) => { if (x.lock) ops.push(["l", i, 1]); });
  return ops;
}

const SEND_LIMIT = 4096; // bytes: Telegram's sendData
function approvalText(snap, reset, start, ops, lines) {
  const body = (o) => JSON.stringify({ v: 1, c: snap.c[0], k: snap.k, m: snap.m, r: reset ? 1 : 0, o, q: lines.map((x) => x.q), l: lines.map((x) => (x.lock ? 1 : 0)) });
  const literal = body(ops);
  if (new TextEncoder().encode(literal).length <= SEND_LIMIT - 96 && ops.length <= 250) return literal;
  return body(canonicalOps(start, lines));
}

// ---- the screen ----------------------------------------------------------------------------
const QPR = 32; // quarters per turn of the dial: 8 hours
function editor(snap) {
  const draft = snap.l.map((l) => ({ q: l[1], lock: Boolean(l[3]) }));
  const synth = snap.l.map((l) => ({ q: l[2], lock: false }));
  const synthTotal = synth.reduce((a, x) => a + x.q, 0);
  const E = { reset: false, ops: [], lines: draft, history: [] };
  const start = () => (E.reset ? synth : draft);
  const total = () => E.lines.reduce((a, x) => a + x.q, 0);
  const maxTotal = snap.n * 16 * 4;
  const rate = snap.c[4] != null ? Number(snap.c[4]) : null;
  const money = (q) => (rate == null ? "" : amount(((q / 4) * rate).toFixed(2), snap.c[3]));
  const sign = (d) => (d > 0 ? "+" : "−") + hrs(Math.abs(d));

  document.querySelector(".top").hidden = true;
  document.getElementById("tabs").hidden = true;
  const screen = h("section", "screen on editor");
  const head = h("header", "ed-head");
  head.append(h("p", "eyebrow", "Рахунок · " + snap.t));
  const name = h("h2", "ed-client");
  const dot = h("span", "sw"); dot.style.background = color(snap.c[2]);
  name.append(dot, snap.c[1]);
  head.append(name);
  screen.append(head);

  // -- the dial: the total in 15-min detents -------------------------------------------------
  const dialCard = h("section", "card ed-dial");
  const dialBox = h("div", "dial");
  const D = 300, cx = 150, cy = 150, R = 128, RT = 104;
  const g = svg(dialBox, D, D), defs = s("defs", {}, g);
  const grad = s("linearGradient", { id: "dg", x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  s("stop", { offset: 0, "stop-color": "var(--series-1)" }, grad); s("stop", { offset: 1, "stop-color": "var(--series-7)" }, grad);
  s("circle", { cx, cy, r: R, fill: "none", stroke: "var(--track)", "stroke-width": 12, "stroke-opacity": 0.6 }, g);
  const gauge = s("path", { fill: "none", stroke: "url(#dg)", "stroke-width": 12, "stroke-linecap": "round" }, g);
  const scaleOf = Math.max(8, synthTotal * 2); // the gauge: 0 … twice the draft, the draft at the bottom
  const at = (q) => (2 * Math.PI * Math.min(q, scaleOf)) / scaleOf;
  const mark = (q) => [cx + R * Math.sin(at(q)), cy - R * Math.cos(at(q))];
  const [mx, my] = mark(synthTotal);
  s("circle", { cx: mx, cy: my, r: 5, fill: "var(--surface)", stroke: "var(--ink-2)", "stroke-width": 2 }, g);
  s("circle", { cx, cy, r: RT + 16, fill: glow(defs, "dglow", "var(--series-7)"), opacity: 0.18 }, g);
  const ring = s("g", { class: "dial-ring" }, g);
  for (let i = 0; i < QPR; i++) {
    const a = (2 * Math.PI * i) / QPR, major = i % 4 === 0, r0 = major ? RT - 14 : RT - 8;
    s("line", { x1: cx + r0 * Math.sin(a), y1: cy - r0 * Math.cos(a), x2: cx + RT * Math.sin(a), y2: cy - RT * Math.cos(a), stroke: major ? "var(--ink-2)" : "var(--muted)", "stroke-width": major ? 2.2 : 1.2, "stroke-linecap": "round" }, ring);
  }
  s("circle", { cx, cy: cy - RT + 1, r: 9, fill: "var(--ink)" }, ring);
  s("circle", { cx, cy: cy - RT + 1, r: 3, fill: "var(--plane)" }, ring);
  s("path", { d: `M${cx - 6},${cy - RT - 22} L${cx + 6},${cy - RT - 22} L${cx},${cy - RT - 13}Z`, fill: "var(--ink)" }, g);
  const center = h("div", "dial-center");
  const big = h("div", "dial-num num"), unit = h("div", "dial-unit", "год"), cash = h("div", "dial-money num");
  center.append(big, unit, cash);
  dialBox.append(center);
  const nudge = h("div", "nudge");
  const minus = h("button", "round", "−15"), plus = h("button", "round", "+15");
  const vs = h("span", "delta");
  nudge.append(minus, vs, plus);
  dialCard.append(h("h3", "", "Разом за період"), h("p", "hint", "крути диск — крок 15 хв; чернетка — точка внизу"), dialBox, nudge);
  screen.append(dialCard);

  // -- the split: borders move time between lines, the total stays ----------------------------
  const splitCard = h("section", "card ed-split");
  splitCard.append(h("h3", "", "Частки рядків"), h("p", "hint", "тягни межу — час переходить між сусідами, разом не змінюється"));
  const ghost = h("div", "ghost"), bar = h("div", "split-bar");
  const segs = E.lines.map((_, i) => {
    const seg = h("div", "seg"); seg.style.setProperty("--c", color(i % 8));
    seg.append(h("span", "", String(i + 1)));
    bar.append(seg); return seg;
  });
  synth.forEach((x, i) => { const gseg = h("i"); gseg.style.flex = x.q; gseg.style.background = color(i % 8); ghost.append(gseg); });
  const handles = E.lines.slice(1).map((_, k) => { const hd = h("div", "handle"); hd.append(h("i")); bar.append(hd); return hd; });
  const legend = h("div", "ghost-legend");
  legend.append(h("span", "", "чернетка"), h("span", "", "↓ зараз"));
  splitCard.append(legend, ghost, bar);
  const rows = h("div", "ed-rows");
  const rowNodes = snap.l.map((l, i) => lineRow(snap, i, l, () => toggleLock(i)));
  rowNodes.forEach((r) => rows.append(r.node));
  splitCard.append(rows);
  screen.append(splitCard);

  // -- where the hours came from (#128) and what waits ------------------------------------
  if (snap.src.length || snap.cd) screen.append(sourcesCard(snap));

  const barNode = h("footer", "ed-bar");
  const undo = h("button", "ed-undo"); undo.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 7H4V2"/><path d="M4.6 7A8 8 0 1 1 4 13"/></svg>';
  undo.setAttribute("aria-label", "Скасувати крок");
  const back = h("button", "ed-reset", "До чернетки");
  const ok = h("button", "ed-ok");
  barNode.append(undo, back, ok);
  const toast = h("div", "toast");
  main.replaceChildren(screen);
  document.body.append(barNode, toast);

  // -- drawing -------------------------------------------------------------------------------
  let frame = 0;
  function paint() {
    frame = 0;
    const T = total(), lines = E.lines;
    big.textContent = hrs(T);
    cash.textContent = money(T);
    const d = T - synthTotal;
    vs.textContent = d ? `чернетка ${hrs(synthTotal)} · ${sign(d)}` : `як у чернетці · ${hrs(synthTotal)}`;
    vs.classList.toggle("up", d > 0);
    ring.style.transform = `rotate(${T * (360 / QPR)}deg)`; // never modulo: no spin back at a full turn
    gauge.setAttribute("d", T ? arc(cx, cy, R, 0, at(T)) : "");
    let cum = 0;
    lines.forEach((x, i) => {
      const left = T ? (cum / T) * 100 : (i / lines.length) * 100, width = T ? (x.q / T) * 100 : 0;
      segs[i].style.left = left + "%";
      segs[i].style.width = `max(0px, calc(${width}% - 2px))`;
      segs[i].classList.toggle("locked", x.lock);
      segs[i].classList.toggle("narrow", width < 9);
      cum += x.q;
      if (i) {
        const hd = handles[i - 1];
        hd.style.left = left + "%";
        hd.classList.toggle("fixed", lines[i - 1].lock || x.lock);
      }
      rowNodes[i].paint(x, snap.l[i][2]);
    });
    const allLocked = lines.every((x) => x.lock);
    dialBox.classList.toggle("off", allLocked);
    minus.disabled = allLocked || T <= floor(); plus.disabled = allLocked || T >= maxTotal;
    undo.disabled = !E.history.length;
    back.disabled = E.reset && !E.ops.length;
    const changed = E.ops.length + (E.reset ? 1 : 0);
    ok.textContent = changed ? `Затвердити · ${changed}` : "Затвердити";
    ok.disabled = !T;
    post("web_app_setup_closing_behavior", { need_confirmation: changed > 0 });
  }
  const repaint = () => { if (!frame) frame = requestAnimationFrame(paint); };
  const floor = () => Math.max(1, E.lines.filter((x) => x.lock).reduce((a, x) => a + x.q, 0));

  // A gesture: from the lines when it began, one op; the history keeps the state before it.
  let gesture = null;
  function begin() { gesture = { lines: E.lines, warned: false, op: null }; screen.classList.add("dragging"); }
  function preview(op) {
    const next = op && applyOp(gesture.lines, op);
    if (!next) return false;
    const was = total() + "," + E.lines.map((x) => x.q).join();
    E.lines = next; gesture.op = op;
    if (was !== total() + "," + next.map((x) => x.q).join()) haptic("select");
    repaint(); return true;
  }
  function end() {
    screen.classList.remove("dragging");
    if (!gesture) return;
    const { lines, op } = gesture;
    gesture = null;
    if (!op || lines.every((x, i) => x.q === E.lines[i].q && x.lock === E.lines[i].lock)) { E.lines = lines; repaint(); return; }
    E.history.push({ reset: E.reset, ops: E.ops, lines });
    E.ops = [...E.ops, op]; // a new array: the history keeps the old one whole
    repaint();
  }
  function limit() { if (gesture && !gesture.warned) { gesture.warned = true; post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: "warning" }); } }
  function step(dq) {
    begin();
    const T = total(), want = Math.min(maxTotal, Math.max(floor(), T + dq));
    if (want === T) limit(); else preview(["s", want]);
    end();
  }
  minus.addEventListener("click", () => step(-1));
  plus.addEventListener("click", () => step(1));

  // the dial: the angle the finger turned, in detents
  let turn = null;
  const angle = (e) => { const r = dialBox.getBoundingClientRect(); return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))); };
  dialBox.addEventListener("pointerdown", (e) => {
    if (dialBox.classList.contains("off")) return;
    dialBox.setPointerCapture(e.pointerId);
    begin();
    turn = { last: angle(e), sum: 0, from: total() };
  });
  dialBox.addEventListener("pointermove", (e) => {
    if (!turn) return;
    const a = angle(e);
    let da = a - turn.last;
    if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
    turn.last = a; turn.sum += da;
    const raw = turn.from + Math.round(turn.sum / ((2 * Math.PI) / QPR));
    const want = Math.min(maxTotal, Math.max(floor(), raw));
    if (want !== raw) limit();
    if (want !== total()) preview(["s", want]);
  });
  const stopTurn = () => { if (turn) { turn = null; end(); } };
  dialBox.addEventListener("pointerup", stopTurn);
  dialBox.addEventListener("pointercancel", stopTurn);

  // a border: dragged right, the left line takes quarters from the right one
  handles.forEach((hd, k) => {
    let drag = null;
    hd.addEventListener("pointerdown", (e) => {
      if (hd.classList.contains("fixed")) { post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: "warning" }); return; }
      e.stopPropagation();
      hd.setPointerCapture(e.pointerId);
      begin();
      const W = bar.getBoundingClientRect().width;
      drag = { x: e.clientX, px: Math.max(W / Math.max(1, total()), 6) };
      hd.classList.add("on");
    });
    hd.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const L = gesture.lines, dq = Math.round((e.clientX - drag.x) / drag.px);
      const room = dq > 0 ? L[k + 1].q : L[k].q, v = Math.min(Math.abs(dq), room);
      if (Math.abs(dq) > room) limit();
      if (!v) { E.lines = L; gesture.op = null; repaint(); return; }
      preview(dq > 0 ? ["m", k + 1, k, v] : ["m", k, k + 1, v]);
    });
    const stop = () => { if (drag) { drag = null; hd.classList.remove("on"); end(); } };
    hd.addEventListener("pointerup", stop);
    hd.addEventListener("pointercancel", stop);
  });

  function toggleLock(i) {
    begin();
    preview(["l", i, E.lines[i].lock ? 0 : 1]);
    haptic("light");
    end();
  }
  undo.addEventListener("click", () => {
    const last = E.history.pop();
    if (!last) return;
    E.reset = last.reset; E.ops = last.ops; E.lines = last.lines;
    haptic("light"); repaint();
    say("↺ Скасовано");
  });
  back.addEventListener("click", () => {
    if (E.reset && !E.ops.length) return;
    E.history.push({ reset: E.reset, ops: E.ops, lines: E.lines });
    E.reset = true; E.ops = []; E.lines = synth;
    haptic("medium"); repaint();
    say("Повернув синтезовану чернетку: збережені правки підуть після ✅");
  });
  let sent = false;
  ok.addEventListener("click", () => {
    if (sent) return; // one ✅: Telegram closes the page after the first send
    const text = approvalText(snap, E.reset, start(), E.ops, E.lines);
    window.__herApproval = text; // the local preview and the measurements read it
    post("web_app_trigger_haptic_feedback", { type: "notification", notification_type: "success" });
    post("web_app_setup_closing_behavior", { need_confirmation: false });
    ok.classList.add("sent");
    if (TG.inside) sent = true;
    if (TG.inside) setTimeout(() => post("web_app_data_send", { data: text }), reduced ? 0 : 280);
    else say(`Боту пішло б ${new TextEncoder().encode(text).length} байт: ${E.ops.length} кроків`);
  });
  let toastTimer = 0;
  function say(message) {
    toast.textContent = message; toast.classList.add("on");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("on"), 2600);
  }
  paint();
  return E;
}

function lineRow(snap, i, l, onLock) {
  const node = h("div", "ed-row");
  const top = h("div", "ed-line");
  const sw = h("span", "sw"); sw.style.background = color(i % 8);
  const words = h("div", "ed-words");
  words.append(h("b", "", l[0]), h("small", "", `чернетка ${hrs(l[2])} год`));
  const hours = h("div", "ed-hours"), q = h("div", "ed-q num"), chip = h("span", "chip");
  hours.append(q, chip);
  const lock = h("button", "lock");
  lock.setAttribute("aria-label", "Замок рядка");
  lock.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path class="shackle" d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  lock.addEventListener("click", (e) => { e.stopPropagation(); onLock(); });
  top.append(sw, words, hours, lock);
  node.append(top);
  const tasks = (snap.tk[i] || []), use = (snap.ag[i] || []);
  let open = null;
  if (tasks.length || use.length) {
    node.classList.add("more");
    top.addEventListener("click", () => {
      if (open) { open.remove(); open = null; node.classList.remove("open"); return; }
      open = provenance(snap, i, tasks, use); node.append(open); node.classList.add("open"); haptic("select");
    });
  }
  return {
    node,
    paint(x, base) {
      q.textContent = hrs(x.q);
      const d = x.q - base;
      chip.textContent = d ? (d > 0 ? "+" : "−") + hrs(Math.abs(d)) : "";
      chip.className = "chip" + (d > 0 ? " up" : d < 0 ? " down" : "");
      lock.classList.toggle("on", x.lock);
      node.classList.toggle("locked", x.lock);
    },
  };
}

// Owner-only: the line's tasks, threads from them to their repos' days, the agent's share.
function provenance(snap, i, tasks, use) {
  const box = h("div", "prov");
  box.append(h("p", "prov-note", "лише тобі: клієнт цього не бачить ні в PDF, ні у звіті"));
  if (tasks.length) {
    const web = h("div", "threads");
    const lines = svg(web, 100, 100); lines.setAttribute("class", "thread-lines"); lines.setAttribute("preserveAspectRatio", "none");
    const node = h("span", "thread-node"); node.style.background = color(i % 8);
    web.append(node);
    const list = h("div", "thread-list");
    const most = Math.max(1, ...snap.rh.flat());
    tasks.forEach((t) => {
      const row = h("div", "thread");
      const pill = h("span", "task");
      pill.append(h("em", "", (t[0] === "p" ? "PR #" : "issue #") + t[2]));
      if (t[3]) pill.append(" " + t[3]);
      const repo = h("small", "", snap.rp[t[1]] || "");
      const strip = h("span", "heat");
      (snap.rh[t[1]] || []).forEach((v, d) => {
        const cell = h("i"); cell.style.setProperty("--a", v ? 0.25 + (0.75 * v) / most : 0);
        cell.style.setProperty("--c", color(i % 8)); cell.style.animationDelay = d * 0.025 + "s"; strip.append(cell);
      });
      row.append(pill, repo, strip);
      list.append(row);
    });
    web.append(list);
    box.append(web);
    requestAnimationFrame(() => threads(web, lines, node, list, color(i % 8)));
    if (snap.rh.length) box.append(h("p", "hint", `клітинка — день періоду: коміти, PR і закриті issues репо`));
  } else {
    box.append(h("p", "hint", snap.md ? "Без задач GitHub: ручні записи, дзвінки, Signal." : "Без задач GitHub: таймер, ручні записи, дзвінки."));
  }
  box.append(agentRings(snap, use));
  return box;
}

function threads(web, g, node, list, c) {

}

// ---- views: the agent and you --------------------------------------------------------------
function agentShare(P) { // the agent's saved quarters split by its calls per client
  const known = P.g.bc.filter((r) => r[0] >= 0), weight = sum(known.map((r) => r[1]));
  const out = {};
  for (const [slot, w] of known) out[slot] = weight ? (P.g.sv * w) / weight : 0;
  return out;
}

function sankey(box, P) {
  const mine = P.cl.filter((c) => c[1]), agent = agentShare(P);
  if (!mine.length && !P.g.sv) return box.append(h("p", "empty", "За цей період ні годин, ні PR агента."));
  const slots = [...new Set([...mine.map((c) => c[0]), ...Object.keys(agent).map(Number)])];
  const you = Object.fromEntries(mine.map((c) => [c[0], c[1]]));
  const flows = slots.map((slot) => [slot, agent[slot] || 0, you[slot] || 0]).filter((f) => f[1] + f[2] > 0)
    .sort((a, b) => b[1] + b[2] - (a[1] + a[2]));
  const W = 318, H = 300, gap = 10, nodeW = 10, x0 = 66, x1 = W - 96;
  const total = sum(flows.map((f) => f[1] + f[2])), k = (H - gap * Math.max(1, flows.length - 1)) / Math.max(1, total);
  const g = svg(box, W, H), defs = s("defs", {}, g);
  const agentH = sum(flows.map((f) => f[1])) * k, youH = sum(flows.map((f) => f[2])) * k;
  const left = { agent: 0, you: agentH ? agentH + 30 : 0 };
  let ay = left.agent, yy = left.you, ry = 0;
  const m = (x0 + x1) / 2;
  flows.forEach(([slot, a, y], i) => {
    const top = ry;
    const ribbon = (sy, h0, ty, from, id) => {
      if (h0 <= 0) return;
      const gr = s("linearGradient", { id, x1: 0, x2: 1 }, defs);
      s("stop", { offset: 0, "stop-color": from }, gr); s("stop", { offset: 1, "stop-color": color(slot) }, gr);
      s("path", { d: `M${x0},${sy} C${m},${sy} ${m},${ty} ${x1},${ty} L${x1},${ty + h0} C${m},${ty + h0} ${m},${sy + h0} ${x0},${sy + h0}Z`, fill: `url(#${id})`, "fill-opacity": 0.62, class: "fade", style: `animation-delay:${i * 0.07}s` }, g);
    };
    ribbon(ay, a * k, ry, "var(--series-7)", "sa" + i); ay += a * k; ry += a * k;
    ribbon(yy, y * k, ry, "var(--ink-2)", "sy" + i); yy += y * k; ry += y * k;
    s("rect", { x: x1, y: top, width: nodeW, height: Math.max(2, ry - top), rx: 3, fill: color(slot) }, g);
    const mid = top + (ry - top) / 2;
    text(g, x1 + 18, mid - 1, client(slot)[1], { "font-weight": 600 });
    text(g, x1 + 18, mid + 15, `${hrs(Math.round(a + y))} год`, { fill: "var(--ink-2)", "font-size": 12 });
    ry += gap;
  });
  if (agentH) {
    s("rect", { x: x0 - nodeW, y: left.agent, width: nodeW, height: agentH, rx: 3, fill: "var(--series-7)" }, g);
    text(g, x0 - 16, left.agent + 13, "Агент", { "text-anchor": "end", "font-weight": 600 });
    text(g, x0 - 16, left.agent + 29, `≈${hrs(P.g.sv)}`, { "text-anchor": "end", fill: "var(--ink-2)", "font-size": 12 });
  }
  if (youH) {
    s("rect", { x: x0 - nodeW, y: left.you, width: nodeW, height: youH, rx: 3, fill: "var(--ink)" }, g);
    text(g, x0 - 16, left.you + youH / 2 - 1, "Ти", { "text-anchor": "end", "font-weight": 600 });
    text(g, x0 - 16, left.you + youH / 2 + 15, hrs(P.w), { "text-anchor": "end", fill: "var(--ink-2)", "font-size": 12 });
  }
}

function orbit(box, P) {
  const W = 318, H = 260, cx = 159, cy = 128, g = svg(box, W, H), defs = s("defs", {}, g);
  s("circle", { cx, cy, r: 74, fill: glow(defs, "core", "var(--series-7)") }, g);

  s("circle", { cx, cy, r: 114, fill: "none", stroke: "var(--grid)", "stroke-dasharray": "2 6" }, g);

  const legend = h("div", "legend");

  if (P.g.sh != null) { const it = h("span"); const sw = h("span", "sw"); sw.style.background = "var(--series-7)"; it.append(sw, `частка claude ${Math.round(P.g.sh * 100)}%`); legend.append(it); }
  if (P.g.f) legend.append(h("span", "", `збоїв ${P.g.f}`));
  box.append(legend);
}

function bars(box, P) {
  const W = 318, g = svg(box, W, 170), most = Math.max(1, P.g.sv, P.g.rv, P.g.tp);
  const rows = [

    const bar = s("rect", { x: 0, y: y + 20, width: Math.max(0, W * f), height: 8, rx: 4, fill: c }, g);
    bar.style.transformOrigin = "0 0"; bar.style.transformBox = "fill-box";
    bar.animate && !reduced && bar.animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 700, delay: i * 70, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
  });

  box.append(h("p", "soon", `PR агента: ${gh[0]} відкрито, ${gh[1]} змерджено · типовий твій PR ≈ ${hrs(P.g.tp)} год`));
}

// ---- views: the repos, as shapes only: no words, no numbers -------------------------------
function repoDays(R, i) { const out = new Array(R.n).fill(0); for (const [d, c, o, m, x] of R.days[i]) out[d] = c + o + m + x; return out; }
function spots(n) {
  const fixed = [[[159, 170]], [[96, 120], [222, 230]], [[92, 100], [232, 130], [150, 262]],
    [[90, 96], [234, 112], [100, 258], [230, 268]], [[78, 84], [222, 76], [250, 206], [86, 226], [172, 306]]];
  if (n <= fixed.length) return fixed[n - 1];
  return Array.from({ length: n }, (_, i) => { const r = 40 + 18 * Math.sqrt(i), a = i * 2.39996; return [159 + r * Math.cos(a) * 1.15, 180 + r * Math.sin(a)]; });
}

function sky(box, R) {
  const W = 318, H = 360, g = svg(box, W, H), defs = s("defs", {}, g), n = R.repos.length;
  if (!n) return box.replaceChildren(h("p", "empty", "Репозиторії клієнтів ще не прочитано."));
  let seed = 3; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 60; i++) s("circle", { cx: rnd() * W, cy: rnd() * H, r: rnd() * 0.9 + 0.2, fill: "var(--muted)", opacity: 0.45, class: i % 4 ? "" : "twinkle", style: `animation-delay:${rnd() * 2}s` }, g);
  const places = spots(n), activity = R.repos.map((_, i) => sum(repoDays(R, i)));
  const most = Math.max(1, ...activity);
  // repos of one client: a faint thread between them
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (R.slots[i] === R.slots[j] && R.slots[i] < 8)
    s("line", { x1: places[i][0], y1: places[i][1], x2: places[j][0], y2: places[j][1], stroke: color(R.slots[i]), "stroke-opacity": 0.3, "stroke-dasharray": "1 5" }, g);
  R.repos.forEach((_, i) => {
    const [cx, cy] = places[i], c = color(R.slots[i]), size = 22 + 30 * Math.sqrt(activity[i] / most);
    const days = repoDays(R, i), turn = (2 * Math.PI * 4.5) / R.n;
    s("circle", { cx, cy, r: size * 0.55, fill: glow(defs, "b" + i, c), class: "fade" }, g);
    days.forEach((v, d) => {
      const a = d * turn, r = 5 + (d / R.n) * size, x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      if (!v) { if (d % 2) s("circle", { cx: x, cy: y, r: 0.9, fill: "var(--track)" }, g); return; }
      s("circle", { cx: x, cy: y, r: 1.3 + Math.sqrt(v) * 1.4, fill: c, opacity: 0.3 + 0.7 * (d / R.n), class: "fade", style: `animation-delay:${(d / R.n) * 0.6}s` }, g);
    });
    R.prs.filter((p) => p[0] === i && p[2] == null).forEach((p, j) => {
      const a = -0.7 + j * 0.85, x = cx + (size + 18) * Math.cos(a), y = cy + (size + 18) * Math.sin(a);
      const stuck = p[4] === 4, old = p[4] === 3;
      s("line", { x1: cx, y1: cy, x2: x, y2: y, stroke: stuck ? "var(--muted)" : c, "stroke-opacity": 0.55, "stroke-dasharray": stuck ? "2 3" : "" }, g);
      if (old) s("circle", { cx: x, cy: y, r: 12, fill: glow(defs, `o${i}_${j}`, "var(--ink)"), class: "pulse" }, g);
      s("circle", { cx: x, cy: y, r: old ? 4.5 : 3, fill: stuck ? "var(--surface)" : old ? "var(--ink)" : "var(--ink-2)", stroke: stuck ? "var(--muted)" : "none", "stroke-width": 1.5 }, g);
    });
  });
}

function rivers(box, R) {
  const n = R.repos.length;
  if (!n) return box.append(h("p", "empty", "Репозиторії клієнтів ще не прочитано."));
  const W = 338, lane = 66, H = n * lane + 16, pad = 12, g = svg(box, W, H), defs = s("defs", {}, g);
  box.style.margin = "14px -10px 0";
  const x = (d) => pad + (Math.max(0, d) * (W - 2 * pad)) / Math.max(1, R.n - 1);
  s("line", { x1: x(R.n - 1), x2: x(R.n - 1), y1: 4, y2: H - 4, stroke: "var(--ink)", "stroke-opacity": 0.22, "stroke-dasharray": "2 4" }, g);
  R.repos.forEach((_, i) => {
    const base = i * lane + 48, c = color(R.slots[i]), days = repoDays(R, i);
    const amp = (v) => Math.min(13, v * 2.2);
    const top = days.map((v, d) => [x(d), base - amp(v)]), bottom = days.map((v, d) => [x(d), base + amp(v) * 0.45]).reverse();
    s("path", { d: smooth(top) + "L" + smooth(bottom).slice(1) + "Z", fill: c, "fill-opacity": 0.2, class: "fade" }, g);
    s("line", { x1: pad, x2: W - pad, y1: base, y2: base, stroke: c, "stroke-opacity": 0.45 }, g);
    R.prs.filter((p) => p[0] === i).forEach((p, j) => {
      const [, o, end, agent, st] = p, a = x(o);
      if (end != null) {
        const b = Math.max(x(end), a + 4), hgt = Math.min(36, 6 + (end - o) * 3.2);
        drawn(s("path", { d: `M${a},${base} Q${(a + b) / 2},${base - hgt * 2} ${b},${base}`, fill: "none", stroke: agent ? c : "var(--ink-2)", "stroke-width": st === 1 ? 1 : 1.8, "stroke-dasharray": st === 1 ? "1 3" : "", "stroke-linecap": "round", "stroke-opacity": st === 1 ? 0.6 : 1 }, g), (o / R.n) * 0.5);
        if (st === 0) s("circle", { cx: b, cy: base, r: 2.5, fill: agent ? c : "var(--ink-2)" }, g);
      } else {
        const stuck = st === 4, old = st === 3, yy = base - 20 - (j % 2) * 6, b = x(R.n - 1);
        const col = stuck ? "var(--muted)" : old ? "var(--ink)" : "var(--ink-2)";
        const d = o < 0 ? `M${pad},${yy} L${b},${yy}` : `M${a},${base} Q${a},${yy} ${a + 12},${yy} L${b},${yy}`;
        if (old) s("path", { d, fill: "none", stroke: col, "stroke-width": 7, "stroke-opacity": 0.25, "stroke-linecap": "round", class: "pulse" }, g);
        drawn(s("path", { d, fill: "none", stroke: col, "stroke-width": 2, "stroke-dasharray": stuck ? "3 4" : "", "stroke-linecap": "round" }, g), 0.3);
        if (old) s("circle", { cx: b, cy: yy, r: 10, fill: glow(defs, `r${i}_${j}`, col), class: "pulse" }, g);
        s("circle", { cx: b, cy: yy, r: 4.5, fill: stuck ? "var(--surface)" : col, stroke: stuck ? col : "none", "stroke-width": 2 }, g);
      }
    });
  });
}

function pulse(box, R) {
  const n = R.repos.length;
  if (!n) return box.append(h("p", "empty", "Репозиторії клієнтів ще не прочитано."));
  const first = day(R.first), offset = (first.getDay() + 6) % 7; // Monday on the top row
  const cols = Math.ceil((R.n + offset) / 7), cell = Math.min(8.5, 140 / cols - 2), gap = 2;
  const gw = cols * (cell + gap), block = 132, W = 318, perRow = 2, H = Math.ceil(n / perRow) * block, g = svg(box, W, H);
  R.repos.forEach((_, i) => {
    const x0 = (i % perRow) * (W / perRow) + (W / perRow - gw) / 2, y0 = Math.floor(i / perRow) * block;
    const c = color(R.slots[i]), days = repoDays(R, i);
    days.forEach((v, d) => {
      const k = d + offset, col = Math.floor(k / 7), row = k % 7;
      s("rect", { x: x0 + col * (cell + gap), y: y0 + row * (cell + gap), width: cell, height: cell, rx: 2, fill: v ? c : "var(--track)", "fill-opacity": v ? Math.min(1, 0.28 + v * 0.14) : 0.55, class: "fade", style: `animation-delay:${col * 0.03}s` }, g);
    });
    R.prs.filter((p) => p[0] === i && p[4] === 4).forEach((p, j) =>
      s("circle", { cx: x0 + gw + 8, cy: y0 + 5 + j * 13, r: 4.5, fill: "none", stroke: "var(--muted)", "stroke-width": 1.8, "stroke-dasharray": "2 2", class: "pulse" }, g));
    // the backlog: a stream whose thickness is the open issues, melting (or swelling) left to right
    const b = R.backlog[i], most = Math.max(1, ...R.backlog.flat()), mid = y0 + 7 * (cell + gap) + 24, half = 16;
    const xs = (j) => x0 + (j * gw) / Math.max(1, b.length - 1);
    const top = b.map((v, j) => [xs(j), mid - (v / most) * half]), bottom = b.map((v, j) => [xs(j), mid + (v / most) * half]).reverse();
    const grad = s("linearGradient", { id: "bl" + i, x1: 0, x2: 1 }, g);
    s("stop", { offset: 0, "stop-color": c, "stop-opacity": 0.3 }, grad); s("stop", { offset: 1, "stop-color": c, "stop-opacity": 0.95 }, grad);
    s("path", { d: smooth(top) + "L" + smooth(bottom).slice(1) + "Z", fill: `url(#bl${i})`, class: "fade" }, g);
  });
}

  } }]);
  screen.append(box);
  if (P.iv) screen.append(card("paid", "Оплата рахунків", [{ hint: "оплачене за період · чекає і прострочене — зараз", draw: (b) => {
    const grid = h("div", "names");
    grid.style.gridTemplateColumns = "1fr 1fr 1fr";
    for (const [k, word] of [["paid", "оплачено"], ["waiting", "чекає"], ["overdue", "прострочено"]]) {
      const it = h("div", "", word), sums = P.iv[k].money.map(([c, a]) => amount(a, c)).join(" + ");
      it.append(h("b", "", String(P.iv[k].n)));
      if (sums) it.append(h("span", "num", sums));
      grid.append(it);
    }
    b.append(grid);
  } }]));
}

const DRAW = { overview, weeks, agent, repos, invoice };

// ---- the frame ---------------------------------------------------------------------------
const main = document.getElementById("main");
const header = document.querySelector(".top");
function render(motion) {
  const P = panel();
  const screen = h("section", "screen on" + (motion ? " " + motion : ""));
  DRAW[state.screen](screen, P);
  main.replaceChildren(screen);
  header.hidden = state.screen === "repos";
  document.getElementById("period").textContent = state.screen === "repos" ? "" : P.t;
  document.getElementById("older").disabled = state.index >= S.p[state.span].length - 1;
  document.getElementById("newer").disabled = state.index === 0;
  const spans = [...document.querySelectorAll("#spans button")].filter((b) => { b.hidden = !S.p[b.dataset.span]; return !b.hidden; });
  spans.forEach((b, i) => {
    const on = b.dataset.span === state.span;
    b.classList.toggle("on", on);
    if (on) { const pill = document.getElementById("spans-pill"); pill.style.width = `calc((100% - 8px) / ${spans.length})`; pill.style.transform = `translateX(${i * 100}%)`; }
  });
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.screen === state.screen));
}
function step(by) {
  const next = state.index + by;
  if (next < 0 || next >= S.p[state.span].length) return;
  state.index = next; haptic("light"); render(by > 0 ? "slide-r" : "slide-l");
}

function wire() {
  document.querySelectorAll("#spans button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.span === state.span) return;
    state.span = b.dataset.span; state.index = 0; haptic("light"); render("slide-l");
  }));
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.screen === state.screen) return;
    state.screen = b.dataset.screen; haptic("select"); scrollTo(0, 0); render();
  }));
  document.getElementById("older").addEventListener("click", () => step(1));
  document.getElementById("newer").addEventListener("click", () => step(-1));
  let x0 = null, y0 = null;
  main.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  main.addEventListener("touchend", (e) => {
    if (x0 == null || state.screen === "repos") return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dy) < 40) step(dx > 0 ? 1 : -1); // swipe right: the window before
  }, { passive: true });
}

function gate(glyph, title, body) {
  document.querySelector(".top").hidden = true;
  document.getElementById("tabs").hidden = true;
  const box = h("section", "screen on gate");
  box.append(h("div", "glyph", glyph), h("h2", "", title), h("p", "", body));
  main.replaceChildren(box);
}

async function unpack(text) {
  const b64 = text.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "=".repeat((4 - (b64.length % 4)) % 4)), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

async function start() {
  theme(TG.theme);
  post("web_app_ready");
  post("web_app_expand");
  const local = location.protocol === "file:" || ["localhost", "127.0.0.1"].includes(location.hostname);
  if (!TG.inside && !local) return gate("✨", "Відкрий з Telegram", "Дашборд відкривається кнопкою «✨ Дашборд» у /stats у Vector.");
  if (launch.get("i")) return openEditor(launch.get("i"));
  const data = launch.get("d");
  if (!data) return gate("✨", "Немає знімка", "Натисни «✨ Дашборд» у /stats — я покладу в посилання свіжі цифри.");
  if (typeof DecompressionStream === "undefined") return gate("⬆️", "Онови Telegram", "Цьому дашборду потрібен новіший вбудований браузер.");
  try { S = await unpack(data); } catch (e) { return gate("⚠️", "Знімок пошкоджено", "Відкрий дашборд ще раз із /stats."); }
  if (S.v !== 1) return gate("⬆️", "Нова версія", "Відкрий дашборд ще раз із /stats.");
  // A display check, not a lock (#192 F10): launch data is unsigned here and the snapshot is
  // only deflated, so whoever holds the URL can read it. The link itself is the key.
  if (TG.inside && viewer() !== S.o) return gate("🔒", "Лише для власника", "Цей дашборд показує цифри тільки тому, для кого його зроблено.");
  if (Date.now() / 1000 > S.exp) return gate("⌛", "Знімок застарів", "Натисни «✨ Дашборд» у /stats ще раз — покажу свіжі цифри.");
  const span = launch.get("s");
  state.span = S.p[span] ? span : Object.keys(S.p)[0];
  const view = launch.get("v");
  state.screen = SCREENS.includes(view) ? view : SLICE_SCREEN[view] || "overview";
  wire();
  render();
}
// The invoice editor (#176): its own snapshot, from the 🎛 keyboard button of /invoice.
async function openEditor(data) {
  const again = "Натисни «🎛 Жестами» у картці /invoice ще раз.";
  if (typeof DecompressionStream === "undefined") return gate("⬆️", "Онови Telegram", "Редактору потрібен новіший вбудований браузер.");
  let E;
  try { E = await unpack(data); } catch (e) { return gate("⚠️", "Посилання пошкоджено", again); }
  if (E.v !== 1) return gate("⬆️", "Нова версія", again);
  // A keyboard button's launch names no user: only the owner's private chat has that button,
  // and the bot checks who sent the edits. A launch that names someone else is refused.
  const who = viewer();
  if (TG.inside && who != null && who !== E.o) return gate("🔒", "Лише для власника", "Цей рахунок показую тільки тому, для кого його зроблено.");
  if (Date.now() / 1000 > E.exp) return gate("⌛", "Редактор застарів", "Чернетка могла змінитися. " + again);
  editor(E);
}

start();
