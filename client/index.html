<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Your week</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --track: #d9d8d0;
  --good: #006300;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --text-hero: 52px;
  --text-title: 26px;
  --text-subtitle: 17px;
  --text-body: 16px;
  --text-label: 14px;
  --text-caption: 12px;
  --weight-regular: 400;
  --weight-medium: 510;
  --weight-semibold: 590;
  --weight-bold: 700;
  --chart-bar-max: 24;
  --chart-bar-radius: 4;
  --chart-line: 2;
  --chart-marker-radius: 4;
  --chart-gap: 2;
  --chart-grid: 1;
  --chart-area-alpha: 0.1;
  --chart-radius: 16;
  --chart-pad: 32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --track: #3a3a37;
    --good: #0ca30c;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --track: #3a3a37;
  --good: #0ca30c;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}

/* The client's app (#210), «B · Flow» (docs/design/client/README.md). Tokens from her.design. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--plane); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 104px); overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; overflow: visible; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: var(--weight-semibold) 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* the client's bar: their mark, their name, the period */
.bar { display: flex; align-items: center; gap: 10px; height: 40px; }
.bar .logo { width: 32px; height: 32px; border-radius: 10px; flex: none; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: center; font: var(--weight-bold) 14px/1 var(--font); }
.bar .logo img { width: 22px; height: 22px; }
.bar b { font: var(--weight-semibold) 16px/1.1 var(--font); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* heroes: a statement, or a sum */
.chip { display: inline-flex; align-items: center; gap: 8px; font: var(--weight-semibold) 13px/1 var(--font); padding: 7px 11px 7px 10px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 4px; background: var(--status-good); box-shadow: 0 0 0 4px color-mix(in oklab, var(--status-good) 22%, transparent); }
.chip.neutral i { background: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in oklab, var(--ink-2) 16%, transparent); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.statement { font: var(--weight-bold) 44px/1 var(--font); letter-spacing: -.045em; margin-top: 14px; text-wrap: balance; }
.statement em { font-style: normal; color: var(--muted); }
.money { font: var(--weight-bold) 80px/.95 var(--font); letter-spacing: -.05em; font-variant-numeric: tabular-nums; margin-top: 12px; white-space: nowrap; }
.money sup { font-size: 34px; letter-spacing: 0; vertical-align: 36px; margin-right: 4px; font-weight: var(--weight-semibold); }
.money .cents { font-size: 40px; letter-spacing: -.02em; color: var(--ink-2); }
.money.long { font-size: 60px; }
.sub { font: 15px/1.4 var(--font); color: var(--ink-2); }

/* cards, the dashboard's own */
.card { position: relative; background: var(--surface); border-radius: 24px; box-shadow: inset 0 0 0 1px var(--border); padding: 20px; margin-top: 12px; overflow: hidden; }
.card.deep { background: radial-gradient(130% 100% at 50% 0%, color-mix(in oklab, var(--series-7) 16%, var(--surface)), var(--surface)); }
.card h3 { font: var(--weight-semibold) 17px/1.2 var(--font); }
.card .hint { font: 13px/1.3 var(--font); color: var(--muted); margin-top: 3px; }
.card.tap { cursor: pointer; transition: transform .2s; }
.card.tap:active { transform: scale(.985); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dots { display: flex; gap: 6px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--track); transition: width .35s cubic-bezier(.3,1.3,.5,1), background .35s; }
.dots i.on { width: 18px; background: var(--ink); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 5px; flex: none; }
.sw.hollow { background: none !important; box-shadow: inset 0 0 0 1.5px var(--c); }
.zone { font: var(--weight-semibold) 11px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
.lbl { font: var(--weight-semibold) 12.5px/1 var(--font); fill: var(--ink); }
.lbl2 { font: 11.5px/1 var(--font); fill: var(--muted); }
.onfill { font: var(--weight-semibold) 12.5px/1 var(--font); fill: #fff; }
.onfill2 { font: 11.5px/1 var(--font); fill: rgba(255,255,255,.82); }

/* the road: done, now, next */
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--grid); }
.lanes .eyebrow { font-size: 11px; }
.lanes div div { font: var(--weight-medium) 14px/1.25 var(--font); margin-top: 9px; display: flex; gap: 6px; align-items: baseline; }
.lanes div div span:last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lanes .sw { width: 8px; height: 8px; }

/* the home (#231): the launch ring, the road of features, this week */
.launch { display: flex; align-items: center; gap: 18px; }
.launch .ring { flex: none; }
.ringnum { font: var(--weight-bold) 22px/1 var(--font); letter-spacing: -.03em; fill: var(--ink); font-variant-numeric: tabular-nums; }
.launch .when { font: var(--weight-bold) 26px/1.05 var(--font); letter-spacing: -.03em; margin-top: 6px; }
.launch .hint { font-size: 14px; margin-top: 4px; }
.path { position: relative; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); }
.path .road { position: absolute; left: 0; top: 0; }
.path .lane { font-size: 11px; padding-left: 36px; margin: 14px 0 6px; }
.path .lane:first-of-type { margin-top: 0; }
.stop { position: relative; padding: 2px 0 0 36px; min-height: 24px; margin-bottom: 8px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.stop b { font: var(--weight-semibold) 15.5px/20px var(--font); display: block; }
.stop.next b, .stop.rest span { color: var(--ink-2); font-weight: var(--weight-medium); }
.stop.rest span { font: 14px/20px var(--font); }
.stop .node { position: absolute; z-index: 1; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--c, var(--track)); display: grid; place-items: center; }
.stop.done .node { background: var(--c); box-shadow: none; }
.stop.done .node svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.stop.now .node { background: conic-gradient(var(--c) var(--p), var(--surface) 0); box-shadow: inset 0 0 0 2px var(--c), 0 0 0 4px color-mix(in oklab, var(--c) 18%, transparent); }
.stop.rest .node { width: 8px; height: 8px; left: 8px; top: 8px; box-shadow: none; background: var(--track); }
.stop.end .node { left: 0; top: 0; width: 24px; height: 24px; border-radius: 12px; background: var(--ink); box-shadow: 0 0 0 5px var(--surface), 0 0 0 6.5px color-mix(in oklab, var(--ink) 35%, transparent); }
.stop.end .node::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1.5px solid var(--ink); opacity: .4; animation: pulse 1.8s ease-in-out infinite; }
.stop.end b { line-height: 24px; padding-top: 0; }
.stop.end { padding-top: 0; margin: 14px 0 0; }
.meter { height: 6px; border-radius: 3px; background: var(--track); margin-top: 7px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.path > :nth-child(2) { animation-delay: .04s; } .path > :nth-child(3) { animation-delay: .08s; } .path > :nth-child(4) { animation-delay: .12s; }
.path > :nth-child(5) { animation-delay: .16s; } .path > :nth-child(6) { animation-delay: .2s; } .path > :nth-child(n+7) { animation-delay: .24s; }
.arc { animation: arc 1.1s cubic-bezier(.3,.7,.2,1) both; }
@keyframes arc { from { stroke-dasharray: 0 100; } }
.calm { display: flex; align-items: center; gap: 10px; margin-top: 12px; font: var(--weight-medium) 16px/1.3 var(--font); }
.calm i { width: 26px; height: 26px; border-radius: 13px; flex: none; display: grid; place-items: center; background: color-mix(in oklab, var(--status-good) 16%, var(--surface)); }
.calm svg { width: 15px; height: 15px; fill: none; stroke: var(--status-good); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.gains > div { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--grid); }
.gains > div:first-child { border-top: 0; margin-top: 8px; }
.gains .sw { width: 10px; height: 10px; transform: translateY(1px); }
.gains b { display: block; font: var(--weight-semibold) 16px/1.25 var(--font); }
.gains small { display: block; font: 14px/1.35 var(--font); color: var(--ink-2); margin-top: 3px; }
.more { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 4px; font: var(--weight-semibold) 14px/1 var(--font); color: var(--ink); }
.more svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* value: what we built flows into what it gives and the risk it takes away */
.flow { position: relative; margin-top: 16px; padding-left: 40px; }
.flow svg { position: absolute; left: 0; top: 0; }
.flow .st { position: relative; }
.flow .st + .st { margin-top: 18px; }
.flow .eyebrow { font-size: 11px; }
.flow .built { font: var(--weight-semibold) 17px/1.25 var(--font); margin-top: 5px; }
.flow .so { font: var(--weight-bold) 24px/1.12 var(--font); letter-spacing: -.025em; margin-top: 5px; }
.flow .risk { font: var(--weight-medium) 16px/1.3 var(--font); margin-top: 5px; color: var(--ink-2); }
.flow .eyebrow.good { color: var(--good); }

/* rows */
.row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--grid); font: 15px/1.25 var(--font); }
.row:first-child { border-top: 0; }
.row .n { flex: 1; min-width: 0; font-weight: var(--weight-medium); }
.row .h { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.row .a { font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; text-align: right; }
.row.total .n, .row.total .a { font-weight: var(--weight-bold); font-size: 17px; }
.step { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; padding: 12px 0; border-top: 1px solid var(--grid); }
.step:first-of-type { border-top: 0; }
.step i { grid-row: span 2; width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px var(--series-4); display: grid; place-items: center; font: var(--weight-semibold) 11px/1 var(--font); font-style: normal; color: var(--ink-2); }
.step b { font: var(--weight-semibold) 15px/1.3 var(--font); }
.step small { font: 13px/1.35 var(--font); color: var(--muted); grid-column: 2; }
.step em { font: var(--weight-medium) 12px/1.3 var(--font); font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

/* pay */
.btn { height: 48px; border-radius: 18px; padding: 0 18px; font: var(--weight-semibold) 15px/1 var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s; }
.btn:active { transform: scale(.96); }
.btn.ink { background: var(--ink); color: var(--plane); }
.btn.soft { background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btns { display: flex; gap: 8px; margin-top: 16px; }
.btns .ink { flex: 1; }
.pay { margin-top: 14px; display: grid; gap: 4px; }
.pay b { font: var(--weight-semibold) 15.5px/1.3 var(--font); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pay small { font: 13px/1.4 var(--font); color: var(--muted); }
.parties { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); }
.parties p { font: 13px/1.45 var(--font); color: var(--ink-2); overflow-wrap: anywhere; }
.parties b { display: block; font: var(--weight-semibold) 14px/1.3 var(--font); color: var(--ink); margin: 6px 0 2px; }

/* the bottom navigation, the dashboard's own */
.tabs { position: fixed; z-index: 4; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; padding: 6px; border-radius: 24px; background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.18); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 18px; font: var(--weight-medium) 11px/1 var(--font); color: var(--muted); transition: color .25s, background .25s; }
.tabs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--ink); background: var(--plane); }
.toast { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--plane); font: var(--weight-medium) 13px/1.35 var(--font); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* gates: unlock, unlocked, no data */
.gate { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 0 6px; }
.gate .mark { width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; background: radial-gradient(120% 120% at 30% 20%, color-mix(in oklab, var(--series-7) 30%, var(--surface)), var(--surface)); box-shadow: inset 0 0 0 1px var(--border); }
.gate .mark svg { width: 32px; height: 32px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gate h1 { font: var(--weight-bold) 38px/1.02 var(--font); letter-spacing: -.035em; margin-top: 22px; text-wrap: balance; }
.gate p { font: 16px/1.45 var(--font); color: var(--ink-2); margin-top: 12px; }

/* skeleton instead of a spinner */
.sk { border-radius: 16px; background: linear-gradient(90deg, var(--surface) 0%, var(--grid) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.sk-bar { height: 32px; width: 46%; }
.sk-hero { height: 96px; width: 86%; margin-top: 22px; }
.sk-card { height: 300px; margin-top: 18px; border-radius: 24px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* motion: the dashboard's verbs */
.screen { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.grow { transform-box: fill-box; transform-origin: left; animation: grow .9s cubic-bezier(.2,.8,.2,1) both; }
@keyframes grow { from { transform: scaleX(0); } }
.pour { transform-box: view-box; clip-path: inset(0 100% 0 0); animation: pour 1.1s cubic-bezier(.3,.7,.2,1) forwards; }
@keyframes pour { to { clip-path: inset(0 0 0 0); } }
.pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.5); opacity: .45; } }
.swap { animation: swap .42s cubic-bezier(.2,.8,.2,1) both; }
@keyframes swap { from { opacity: 0; transform: translateX(22px); } }
/* ?still=1: the preview's screenshots (headless Chrome keeps a window wider than a phone) */
html.still { width: 390px; overflow: hidden; }
html.still body { position: relative; }
html.still .tabs { position: absolute; }
html.still *, html.still *::before, html.still *::after { animation: none !important; transition: none !important; }
html.still .draw { stroke-dashoffset: 0; }
html.still .pour { clip-path: none; }
html.still .stop.end .node::after { display: none; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .draw { stroke-dashoffset: 0; }
  .pour { clip-path: none; }
  .stop.end .node::after { display: none; }
}

</style>
</head>
<body>
<main id="app" aria-live="polite">
  <section class="skeleton" aria-hidden="true"><div class="sk sk-bar"></div><div class="sk sk-hero"></div><div class="sk sk-card"></div></section>
</main>
<script>
// The client's app (#210): the week's report and invoice, «B · Flow» (docs/design/client/README.md),
// and the client's home (#231): status, the road to launch, this week, the invoice at a glance.
// Vanilla JS, no library, no network. The fragment holds either the sealed snapshot (#s=) or the
// viewer's key (#k=), never both: the key lives in the viewer's Telegram CloudStorage (her.seal),
// next to the newest home this viewer opened (an old button still shows the newest one).
"use strict";

// ---- Telegram: a tiny bridge instead of telegram-web-app.js (nothing loads from outside) ----
const launch = new URLSearchParams(location.hash.slice(1));
const QS = new URLSearchParams(location.search); // the local preview: ?theme=dark&still=1
const TG = { data: launch.get("tgWebAppData") || "", theme: json(launch.get("tgWebAppThemeParams")) };
TG.inside = Boolean(TG.data || launch.get("tgWebAppPlatform") || window.TelegramWebviewProxy || (window.external && "notify" in window.external));
// What a link cannot fake (#239 F14): a native client's bridge, or a frame of Telegram Web.
const WEB = "https://web.telegram.org";
const framed = window.parent !== window && ((location.ancestorOrigins && location.ancestorOrigins[0] === WEB) || document.referrer.startsWith(WEB + "/"));
TG.native = Boolean(window.TelegramWebviewProxy || (window.external && "notify" in window.external) || framed);
try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* file:// */ }
if (QS.get("still")) document.documentElement.classList.add("still");

function json(text) { try { return JSON.parse(text); } catch (e) { return null; } }
function post(type, data) {
  try {
    if (window.TelegramWebviewProxy) window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data || {}));
    else if (window.external && "notify" in window.external) window.external.notify(JSON.stringify({ eventType: type, eventData: data || {} }));
    else if (window.parent !== window) window.parent.postMessage(JSON.stringify({ eventType: type, eventData: data || {} }), WEB);
  } catch (e) { /* outside Telegram */ }
}
const pending = {};
function receive(type, data) {
  if (type === "theme_changed" && data && data.theme_params) theme(data.theme_params);
  if (type === "custom_method_invoked" && data && pending[data.req_id]) {

    const stations = [[W.built, l.t, "built"], [W.so, l.v, "so"], [W.less, l.r, "risk"]].filter((x) => x[1]);
    for (const [label, text, cls] of stations) {
      const st = h("div", "st"), e = h("div", cls === "risk" ? "eyebrow good" : "eyebrow", label);
      st.append(e, h("div", cls, text));
      flow.append(st);
    }
    body.replaceChildren(flow);
    requestAnimationFrame(() => { // the ribbon from the first station to the last, its knots at each
      const sts = [...flow.querySelectorAll(".st")], y0 = 6, ys = sts.map((n) => n.offsetTop + 6), y1 = ys[ys.length - 1];
      const rib = s("svg", { width: 24, height: y1 + 10, viewBox: `0 0 24 ${y1 + 10}` });
      s("path", { d: `M12,${y0} V${y1}`, stroke: color(l.slot), "stroke-width": 10, "stroke-linecap": "round", fill: "none", pathLength: 1, class: "draw", opacity: 0.9 }, rib);
      ys.forEach((y, i) => {

      });

  if (items.length > 1) card.onclick = () => { haptic("select"); at = (at + 1) % items.length; show(true); };
  else card.classList.remove("tap");
  show(false);

}

// ---- the home (#231): status, the road to launch, this week, the invoice ---------------------
function homeScreen(root) {
  root.append(bar(D.at ? W.updated(dateText(isoOf(new Date(D.at * 1000)))) : W.myProject));
  const top = h("div", "");
  top.style.marginTop = "20px";
  const left = D.deadline ? Math.round((day(D.deadline.date) - TODAY) / 864e5) : -1;
  if (left >= 0) { const chips = h("div", "chips"); chips.append(chip(W.daysTo(left, D.deadline.what))); top.append(chips); }
  top.append(h("div", "statement", D.status || (left >= 0 ? `${D.deadline.what}: ${dateText(D.deadline.date, true)}.` : D.client)));
  root.append(top);
  const road = launchCard(left);
  if (road) root.append(road);
  if (Array.isArray(D.asks)) root.append(asksCard()); // #216 fills it; without the key, no claim

// The features as stations on one road: done (filled, ✓), now (filled as far as it got), next
// (hollow), and the launch at the end. The ring: every feature's built share in its colour.
function stationsOf() {
  const slotOf = (title, fallback) => { const i = D.lines.findIndex((l) => l.t.toLowerCase() === title.toLowerCase()); return i >= 0 ? i : fallback; };
  const done = [], now = [], next = [];
  D.goals.forEach(([t, closed, total], i) => (total && closed >= total ? done : now).push({ t, slot: slotOf(t, D.lines.length + i), closed, total }));
  D.next.forEach(([t], i) => { if (!D.goals.some((g) => g[0].toLowerCase() === t.toLowerCase())) next.push({ t, slot: slotOf(t, D.lines.length + D.goals.length + i), closed: 0, total: 0 }); });
  return [done, now, next];
}
function launchCard(left) {
  const [done, now, next] = stationsOf(), deadline = left >= 0 ? D.deadline : null;
  if (!deadline && !done.length && !now.length && !next.length) return null;
  const card = h("section", "card deep"), head = h("div", "launch");
  const goals = [...done, ...now], total = sum(goals.map((g) => g.total));
  if (total) {
    const ring = s("svg", { viewBox: "0 0 96 96", width: 96, height: 96, role: "img", class: "ring" });
    s("circle", { cx: 48, cy: 48, r: 40, fill: "none", stroke: "var(--track)", "stroke-width": 10 }, ring);
    let at = 0;
    goals.forEach((g, i) => {
      const len = (g.closed / total) * 100;
      if (len <= 0) return;
      const arc = s("circle", { cx: 48, cy: 48, r: 40, fill: "none", stroke: color(g.slot), "stroke-width": 10, pathLength: 100, "stroke-dasharray": `${Math.max(0, len - 0.8)} ${100 - len + 0.8}`, "stroke-dashoffset": -at, class: "arc", transform: "rotate(-90 48 48)" }, ring);
      arc.style.animationDelay = `${i * 0.08}s`;
      at += len;
    });
    const pct = Math.round((sum(goals.map((g) => g.closed)) / total) * 100);
    txt(ring, 48, 50, `${pct}%`, { class: "ringnum", "text-anchor": "middle" });
    txt(ring, 48, 66, W.builtPct, { class: "lbl2", "text-anchor": "middle" });
    head.append(ring);
  }
  const words = h("div", "");
  if (deadline) words.append(h("div", "eyebrow", deadline.what || W.launchOn), h("div", "when", dateText(deadline.date, true)), h("div", "hint", W.daysLeft(left)));
  else words.append(h("h3", "", W.features), h("div", "hint", W.featuresHint));
  head.append(words);
  card.append(head);
  const path = h("div", "path"), stops = [];
  const lane = (name, items, kind, cap) => {
    if (!items.length) return;
    path.append(h("div", "eyebrow lane", name));
    const shown = items.length > cap ? items.slice(0, cap - 1) : items;
    shown.forEach((g) => {
      const stop = h("div", `stop ${kind}`), node = h("i", "node");
      node.style.setProperty("--c", color(g.slot));
      if (kind === "now") node.style.setProperty("--p", `${Math.round((g.closed / (g.total || 1)) * 100)}%`);
      if (kind === "done") node.innerHTML = icon(ICON.ok);
      stop.append(node, h("b", "", g.t));
      if (kind === "now" && g.total) {
        const meter = h("div", "meter"), fill = h("i", "grow");
        fill.style.cssText = `width:${Math.max(4, (g.closed / g.total) * 100)}%;background:${color(g.slot)}`;
        meter.append(fill);
        stop.append(meter);
      }
      path.append(stop); stops.push([stop, kind]);
    });
    if (shown.length < items.length) { const more = h("div", `stop ${kind} rest`); more.append(h("i", "node"), h("span", "", W.more(items.length - shown.length))); path.append(more); stops.push([more, kind]); }
  };
  lane(W.done, done, "done", 3);
  lane(W.now, now, "now", 4);
  lane(W.next, next, "next", 3);
  if (deadline && stops.length) { // with no feature on the road, the date above says it all
    const end = h("div", "stop end"), node = h("i", "node");
    end.append(node, h("b", "", `${deadline.what} · ${dateText(deadline.date)}`));
    path.append(end); stops.push([end, "next"]);
  }
  if (stops.length) card.append(path);
  requestAnimationFrame(() => { // the road through every station: solid up to now, dashed ahead
    if (stops.length < 2) return;
    const ys = stops.map(([n]) => n.offsetTop + 12), cut = stops.map(([, k]) => k).lastIndexOf("now");
    const split = cut >= 0 ? ys[cut] : stops[0][1] === "next" ? ys[0] : ys[stops.map(([, k]) => k).lastIndexOf("done")];
    const road = s("svg", { width: 24, height: ys[ys.length - 1] + 2, class: "road" });
    if (split > ys[0]) s("path", { d: `M12,${ys[0]} V${split}`, stroke: "var(--ink)", "stroke-width": 2, opacity: 0.28, pathLength: 1, class: "draw" }, road);
    s("path", { d: `M12,${split} V${ys[ys.length - 1]}`, stroke: "var(--ink)", "stroke-width": 1.5, opacity: 0.32, "stroke-dasharray": "3 4" }, road);
    path.prepend(road);
  });
  return card;
}

function sankeyCard() {
  const inv = D.invoice, card = h("section", "card deep");
  card.append(h("h3", "", W.paying), h("div", "hint", W.payingHint));
  const total = sum(D.lines.map((l) => l.q)) || 1, Wd = 318, gap = 8, x0 = 6, bw = 6, x1 = Wd - 12;
  const H = Math.max(180, Math.min(300, 60 * D.lines.length)), TH = H * 0.56, T0 = (H - TH) / 2;
  const k = (H - gap * (D.lines.length - 1)) / total;
  const svg = s("svg", { viewBox: `0 0 ${Wd} ${H}`, width: "100%", role: "img" }, card);
  svg.style.marginTop = "18px";
  const defs = s("defs", {}, svg), g = s("g", { class: "pour" }, svg);
  let y = 0, ty = T0;
  const small = [];
  D.lines.forEach((l, i) => {
    const hh = Math.max(l.q * k, 3), th = (l.q * TH) / total, id = `rb${i}`;
    const grad = s("linearGradient", { id, x1: 0, x2: 1 }, defs);
    s("stop", { offset: 0, "stop-color": color(i), "stop-opacity": 0.88 }, grad);
    s("stop", { offset: 1, "stop-color": color(i), "stop-opacity": 0.35 }, grad);
    const m1 = x0 + bw + 150, m2 = x1 - 90;
    s("path", { d: `M${x0 + bw},${y} C${m1},${y} ${m2},${ty} ${x1},${ty} L${x1},${ty + th} C${m2},${ty + th} ${m1},${y + hh} ${x0 + bw},${y + hh}Z`, fill: `url(#${id})` }, g);
    s("rect", { x: x0, y, width: bw, height: hh, rx: 2, fill: color(i) }, g);
    if (hh > 34) {
      txt(g, x0 + bw + 10, y + 18, l.t.length > 28 ? l.t.slice(0, 27) + "…" : l.t, { class: "onfill" });
      txt(g, x0 + bw + 10, y + 34, hours(l.q), { class: "onfill2" });
    } else small.push([l, i]);
    y += hh + gap; ty += th;
  });
  s("rect", { x: x1, y: T0, width: 12, height: TH, rx: 4, fill: "var(--ink)" }, g);
  if (small.length) {
    const legend = h("div", "");
    legend.style.cssText = "display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:12px;font:13px/1.2 var(--font);color:var(--ink-2)";
    for (const [l, i] of small) { const sw = h("span", "sw"); sw.style.cssText = `width:8px;height:8px;margin-right:6px;background:${color(i)}`; const t = h("span", ""); t.append(sw, document.createTextNode(`${l.t} · ${hours(l.q)}`)); legend.append(t); }
    card.append(legend);
  }
  const list = h("div", "");
  list.style.marginTop = "10px";
  D.lines.forEach((l, i) => {
    const row = h("div", "row"), sw = h("span", "sw");
    sw.style.background = color(i);
    row.append(sw, h("span", "n", l.t), h("span", "h", hours(l.q)));
    if (l.a) row.append(h("span", "a", moneyText(l.a, inv.currency)));
    list.append(row);
  });
  if (inv.total) { const row = h("div", "row total"); row.append(h("span", "n", W.total), h("span", "a", moneyText(inv.total, inv.currency))); list.append(row); }
  card.append(list);
  return card;
}

// An IBAN reads in groups of four; the copy keeps the bank's own form.
const spaced = (line) => line.replace(/\b([A-Z]{2}\d{2}[A-Z0-9]{10,30})\b/, (iban) => iban.match(/.{1,4}/g).join(" "));
function payCard() {
  const inv = D.invoice, card = h("section", "card");
  card.append(h("span", "eyebrow", inv.paid ? W.paidOn(dateText(inv.paid)) : W.payBy));
  const pay = h("div", "pay");
  for (const line of inv.from.lines) pay.append(h("b", "", spaced(line)));
  pay.append(h("small", "", [inv.from.name, inv.terms].filter(Boolean).join(" · ")));
  card.append(pay);
  const btns = h("div", "btns"), copy = h("button", "btn ink"), pdf = h("button", "btn soft");
  copy.innerHTML = icon(ICON.copy); copy.append(document.createTextNode(W.copy));
  pdf.innerHTML = icon(ICON.down); pdf.append(document.createTextNode(W.pdf));
  copy.onclick = async () => {
    const text = [...inv.from.lines, inv.total ? `${W.total}: ${moneyText(inv.total, inv.currency)}` : "", inv.number].filter(Boolean).join("\n");
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
      const area = h("textarea"); area.value = text; area.style.cssText = "position:fixed;opacity:0"; document.body.append(area); area.select();
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; } area.remove();
    }
    haptic(ok ? "medium" : "light");
    toast(ok ? W.copied : text.split("\n")[0]);
  };
  pdf.onclick = () => { haptic(); toast(W.pdfHint); setTimeout(() => post("web_app_close"), 900); };
  btns.append(copy, pdf);
  card.append(btns);
  const parties = h("div", "parties");
  for (const [label, who] of [[W.from, inv.from], [W.to, inv.to]]) {
    if (!who.name) continue;
    const p = h("p", "");
    p.append(h("span", "eyebrow", label), h("b", "", who.name));
    const rest = label === W.from ? [who.tagline].filter(Boolean) : who.lines;
    rest.forEach((line, i) => { if (i) p.append(h("br")); p.append(document.createTextNode(line)); });
    parties.append(p);
  }
  card.append(parties);
  return card;
}

// ---- gates ---------------------------------------------------------------------------------
function gate(glyph, title, text) {
  app.replaceChildren();
  const box = h("section", "gate screen"), mark = h("div", "mark");
  mark.innerHTML = icon(ICON[glyph]);
  box.append(mark, h("h1", "", title), h("p", "", text));
  if (TG.inside) {
    const back = h("button", "btn ink", W.back);
    back.style.cssText = "margin-top:28px;align-self:flex-start";
    back.onclick = () => post("web_app_close");
    box.append(back);
  }
  app.append(box);
}

async function start() {
  theme(TG.theme);
  post("web_app_ready");
  post("web_app_expand");
  const lang = (TG.data && json(new URLSearchParams(TG.data).get("user")) || {}).language_code || navigator.language || "en";
  if (/^uk/.test(lang)) { W = WORDS.uk; LANG = "uk"; }
  const key = launch.get("k"), sealed = launch.get("s");
  if (key) {
    // A plain browser keeps the key in localStorage: a link never replaces another one there.
    const held = TG.native ? null : local.get();
    if (held && held !== key) return gate("key", W.keyHeld, W.keyHeldText);
    const kept = await saveKey(key);
    haptic(kept ? "medium" : "light");
    return kept ? gate("ok", W.unlocked, W.unlockedText) : gate("key", W.unlockFail, W.unlockFailText);
  }
  const store = await loadStore();
  async function kept() { // the newest home this viewer opened, if this key still opens it
    if (!store.key || !store.home || store.home === sealed) return null;
    try { const k = await unseal(store.home, store.key); return k && k.home ? k : null; } catch (e) { return null; } // a new key
  }
  if (!sealed) { // the tour's «Open my week», a bare link: the newest home kept here
    D = await kept();
    if (!D) return gate("chat", W.nodata, W.nodataText);
  } else {
    if (!store.key) return gate("key", W.unlockTitle, W.unlockText);
    try { D = await unseal(sealed, store.key); } catch (e) { return gate("key", W.broken, W.brokenText); }
    if (D.home) { // an old «My project» button: the newest home wins, and a newer one is kept
      const newest = await kept();
      if (newest && newest.at > D.at) D = newest;
      else if (store.home !== sealed) keepHome(sealed);
    }
  }
  if (WORDS[D.lang]) { W = WORDS[D.lang]; LANG = D.lang; } // the client's language wins
  document.documentElement.lang = LANG;
  const tab = QS.get("tab");
  current = D.home ? (D.invoice && (tab === "week" || tab === "invoice") ? tab : "home") : tab === "invoice" ? "invoice" : "week";
  document.title = D.home ? `${D.client} · ${W.myProject}` : `${D.client} · ${weekLabel()}`;
  render();
}
start();
