<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Your week</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --plane: #f9f9f7;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --track: #d9d8d0;
  --good: #006300;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
  --text-hero: 52px;
  --text-title: 26px;
  --text-subtitle: 17px;
  --text-body: 16px;
  --text-label: 14px;
  --text-caption: 12px;
  --weight-regular: 400;
  --weight-medium: 510;
  --weight-semibold: 590;
  --weight-bold: 700;
  --chart-bar-max: 24;
  --chart-bar-radius: 4;
  --chart-line: 2;
  --chart-marker-radius: 4;
  --chart-gap: 2;
  --chart-grid: 1;
  --chart-area-alpha: 0.1;
  --chart-radius: 16;
  --chart-pad: 32;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19;
    --plane: #0d0d0d;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --track: #3a3a37;
    --good: #0ca30c;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19;
  --plane: #0d0d0d;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --track: #3a3a37;
  --good: #0ca30c;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
}

/* The client's app (#210), «B · Flow» (docs/design/client/README.md). Tokens from her.design. */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--plane); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 104px); overscroll-behavior-y: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
svg { display: block; overflow: visible; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: var(--weight-semibold) 12px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* the client's bar: their mark, their name, the period */
.bar { display: flex; align-items: center; gap: 10px; height: 40px; }
.bar .logo { width: 32px; height: 32px; border-radius: 10px; flex: none; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); display: grid; place-items: center; font: var(--weight-bold) 14px/1 var(--font); }
.bar .logo img { width: 22px; height: 22px; }
.bar b { font: var(--weight-semibold) 16px/1.1 var(--font); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* the owner's preview (#233): one quiet mark above the client's page, never a part of it */
.peek { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 6px); z-index: 4; display: flex; align-items: center; gap: 7px; width: max-content; max-width: 100%; margin: 0 auto 10px; padding: 6px 12px 6px 10px; border-radius: 99px; background: color-mix(in oklab, var(--plane) 82%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1px var(--border); font: var(--weight-semibold) 12px/1 var(--font); letter-spacing: .02em; color: var(--ink-2); }
.peek svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.peek span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* heroes: a statement, or a sum */
.chip { display: inline-flex; align-items: center; gap: 8px; font: var(--weight-semibold) 13px/1 var(--font); padding: 7px 11px 7px 10px; border-radius: 99px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); color: var(--ink); }
.chip i { width: 8px; height: 8px; border-radius: 4px; background: var(--status-good); box-shadow: 0 0 0 4px color-mix(in oklab, var(--status-good) 22%, transparent); }
.chip.neutral i { background: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in oklab, var(--ink-2) 16%, transparent); }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.statement { font: var(--weight-bold) 44px/1 var(--font); letter-spacing: -.045em; margin-top: 14px; text-wrap: balance; }
.statement em { font-style: normal; color: var(--muted); }
.money { font: var(--weight-bold) 80px/.95 var(--font); letter-spacing: -.05em; font-variant-numeric: tabular-nums; margin-top: 12px; white-space: nowrap; }
.money sup { font-size: 34px; letter-spacing: 0; vertical-align: 36px; margin-right: 4px; font-weight: var(--weight-semibold); }
.money .cents { font-size: 40px; letter-spacing: -.02em; color: var(--ink-2); }
.money.long { font-size: 60px; }
.sub { font: 15px/1.4 var(--font); color: var(--ink-2); }

/* cards, the dashboard's own */
.card { position: relative; background: var(--surface); border-radius: 24px; box-shadow: inset 0 0 0 1px var(--border); padding: 20px; margin-top: 12px; overflow: hidden; }
.card.deep { background: radial-gradient(130% 100% at 50% 0%, color-mix(in oklab, var(--series-7) 16%, var(--surface)), var(--surface)); }
.card h3 { font: var(--weight-semibold) 17px/1.2 var(--font); }
.card .hint { font: 13px/1.3 var(--font); color: var(--muted); margin-top: 3px; }
.card.tap { cursor: pointer; transition: transform .2s; }
.card.tap:active { transform: scale(.985); }
.head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.dots { display: flex; gap: 6px; height: 6px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--track); transition: width .35s cubic-bezier(.3,1.3,.5,1), background .35s; }
.dots i.on { width: 18px; background: var(--ink); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 5px; flex: none; }
.sw.hollow { background: none !important; box-shadow: inset 0 0 0 1.5px var(--c); }
.zone { font: var(--weight-semibold) 11px/1 var(--font); letter-spacing: .12em; text-transform: uppercase; fill: var(--muted); }
.lbl { font: var(--weight-semibold) 12.5px/1 var(--font); fill: var(--ink); }
.lbl2 { font: 11.5px/1 var(--font); fill: var(--muted); }
.onfill { font: var(--weight-semibold) 12.5px/1 var(--font); fill: #fff; }
.onfill2 { font: 11.5px/1 var(--font); fill: rgba(255,255,255,.82); }

/* the road: done, now, next */
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--grid); }
.lanes .eyebrow { font-size: 11px; }
.lanes div div { font: var(--weight-medium) 14px/1.25 var(--font); margin-top: 9px; display: flex; gap: 6px; align-items: baseline; }
.lanes div div span:last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.lanes .sw { width: 8px; height: 8px; }

/* the home (#231): the launch ring, the road of features, this week */
.launch { display: flex; align-items: center; gap: 18px; }
.launch .ring { flex: none; }
.ringnum { font: var(--weight-bold) 22px/1 var(--font); letter-spacing: -.03em; fill: var(--ink); font-variant-numeric: tabular-nums; }
.launch .when { font: var(--weight-bold) 26px/1.05 var(--font); letter-spacing: -.03em; margin-top: 6px; }
.launch .hint { font-size: 14px; margin-top: 4px; }
.path { position: relative; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); }
.path .road { position: absolute; left: 0; top: 0; }
.path .lane { font-size: 11px; padding-left: 36px; margin: 14px 0 6px; }
.path .lane:first-of-type { margin-top: 0; }
.stop { position: relative; padding: 2px 0 0 36px; min-height: 24px; margin-bottom: 8px; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.stop b { font: var(--weight-semibold) 15.5px/20px var(--font); display: block; }
.stop.next b, .stop.rest span { color: var(--ink-2); font-weight: var(--weight-medium); }
.stop.rest span { font: 14px/20px var(--font); }
.stop .node { position: absolute; z-index: 1; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 9px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--c, var(--track)); display: grid; place-items: center; }
.stop.done .node { background: var(--c); box-shadow: none; }
.stop.done .node svg { width: 12px; height: 12px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.stop.now .node { background: conic-gradient(var(--c) var(--p), var(--surface) 0); box-shadow: inset 0 0 0 2px var(--c), 0 0 0 4px color-mix(in oklab, var(--c) 18%, transparent); }
.stop.rest .node { width: 8px; height: 8px; left: 8px; top: 8px; box-shadow: none; background: var(--track); }
.stop.end .node { left: 0; top: 0; width: 24px; height: 24px; border-radius: 12px; background: var(--ink); box-shadow: 0 0 0 5px var(--surface), 0 0 0 6.5px color-mix(in oklab, var(--ink) 35%, transparent); }
.stop.end .node::after { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 1.5px solid var(--ink); opacity: .4; animation: pulse 1.8s ease-in-out infinite; }
.stop.end b { line-height: 24px; padding-top: 0; }
.stop.end { padding-top: 0; margin: 14px 0 0; }
.meter { height: 6px; border-radius: 3px; background: var(--track); margin-top: 7px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; }
.path > :nth-child(2) { animation-delay: .04s; } .path > :nth-child(3) { animation-delay: .08s; } .path > :nth-child(4) { animation-delay: .12s; }
.path > :nth-child(5) { animation-delay: .16s; } .path > :nth-child(6) { animation-delay: .2s; } .path > :nth-child(n+7) { animation-delay: .24s; }
.arc { animation: arc 1.1s cubic-bezier(.3,.7,.2,1) both; }
@keyframes arc { from { stroke-dasharray: 0 100; } }
.calm { display: flex; align-items: center; gap: 10px; margin-top: 12px; font: var(--weight-medium) 16px/1.3 var(--font); }
.calm i { width: 26px; height: 26px; border-radius: 13px; flex: none; display: grid; place-items: center; background: color-mix(in oklab, var(--status-good) 16%, var(--surface)); }
.calm svg { width: 15px; height: 15px; fill: none; stroke: var(--status-good); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.gains > div { display: flex; gap: 12px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--grid); }
.gains > div:first-child { border-top: 0; margin-top: 8px; }
.gains .sw { width: 10px; height: 10px; transform: translateY(1px); }
.gains b { display: block; font: var(--weight-semibold) 16px/1.25 var(--font); }
.gains small { display: block; font: 14px/1.35 var(--font); color: var(--ink-2); margin-top: 3px; }
.more { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 4px; font: var(--weight-semibold) 14px/1 var(--font); color: var(--ink); }
.more svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* the living river (#273, concept B): the flow and the road in one card */
.rhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.rbig { font: var(--weight-bold) 48px/.9 var(--font); letter-spacing: -.05em; margin-top: 8px; }
.rhead > div:first-child > .rbig:first-child { margin-top: 0; }
.rbig small { font: var(--weight-medium) 15px/1 var(--font); letter-spacing: 0; color: var(--muted); margin-left: 6px; }
.rwhen { text-align: right; flex: none; }
.rwhen b { display: block; font: var(--weight-bold) 20px/1.1 var(--font); letter-spacing: -.02em; margin-top: 5px; }
.rwhen span { font: 13px/1.3 var(--font); color: var(--muted); }
.rbox { position: relative; margin-top: 18px; }
canvas.river { display: block; width: 100%; touch-action: manipulation; cursor: pointer; }
.tip { position: absolute; z-index: 2; transform: translate(-50%, -135%); padding: 7px 11px; border-radius: 12px; background: var(--ink); color: var(--plane); font: var(--weight-semibold) 13px/1 var(--font); white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .25s; }
.tip.on { opacity: 1; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 7px; }
.rfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
.rfoot .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font: var(--weight-medium) 12px/1.2 var(--font); color: var(--muted); }
.rfoot .legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw.hatch { width: 8px; height: 8px; border-radius: 2px; background-image: repeating-linear-gradient(135deg, transparent 0 2px, color-mix(in oklab, var(--surface) 55%, transparent) 2px 3.4px) !important; }
.seg { display: inline-flex; flex: none; padding: 2px; border-radius: 99px; background: color-mix(in oklab, var(--ink) 6%, transparent); font: var(--weight-semibold) 11px/1 var(--font); }
.seg button { padding: 6px 10px; border-radius: 99px; color: var(--muted); font: inherit; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.rlanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--grid); }
.rlanes .eyebrow { font-size: 10.5px; }
.rlanes .it { margin-top: 10px; font: var(--weight-semibold) 13.5px/1.25 var(--font); }
.rlanes .it .t { display: flex; gap: 6px; align-items: baseline; }
.rlanes .it .t .sw { width: 8px; height: 8px; transform: translateY(-1px); }
.rlanes .it.next { color: var(--ink-2); font-weight: var(--weight-medium); }
.rlanes .meter { height: 4px; margin: 6px 0 0 14px; }

/* value: what we built flows into what it gives and the risk it takes away */
.flow { position: relative; margin-top: 16px; padding-left: 40px; }
.flow svg { position: absolute; left: 0; top: 0; }
.flow .st { position: relative; }
.flow .st + .st { margin-top: 18px; }
.flow .eyebrow { font-size: 11px; }
.flow .built { font: var(--weight-semibold) 17px/1.25 var(--font); margin-top: 5px; }
.flow .so { font: var(--weight-bold) 24px/1.12 var(--font); letter-spacing: -.025em; margin-top: 5px; }
.flow .risk { font: var(--weight-medium) 16px/1.3 var(--font); margin-top: 5px; color: var(--ink-2); }
.flow .eyebrow.good { color: var(--good); }

/* rows */
.row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--grid); font: 15px/1.25 var(--font); }
.row:first-child { border-top: 0; }
.row .n { flex: 1; min-width: 0; font-weight: var(--weight-medium); }
.row .h { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }
.row .a { font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; text-align: right; }
.row.total .n, .row.total .a { font-weight: var(--weight-bold); font-size: 17px; }
.step { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; padding: 12px 0; border-top: 1px solid var(--grid); }
.step:first-of-type { border-top: 0; }
.step i { grid-row: span 2; width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1.5px var(--series-4); display: grid; place-items: center; font: var(--weight-semibold) 11px/1 var(--font); font-style: normal; color: var(--ink-2); }
.step b { font: var(--weight-semibold) 15px/1.3 var(--font); }
.step small { font: 13px/1.35 var(--font); color: var(--muted); grid-column: 2; }
.step em { font: var(--weight-medium) 12px/1.3 var(--font); font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }

/* pay */
.btn { height: 48px; border-radius: 18px; padding: 0 18px; font: var(--weight-semibold) 15px/1 var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s; }
.btn:active { transform: scale(.96); }
.btn.ink { background: var(--ink); color: var(--plane); }
.btn.soft { background: var(--plane); box-shadow: inset 0 0 0 1px var(--border); }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btns { display: flex; gap: 8px; margin-top: 16px; }
.btns .ink { flex: 1; }
.acts { display: flex; gap: 8px; flex-shrink: 0; }
.btn.pdf { width: 42px; height: 42px; padding: 0; border-radius: 16px; }
.pay { margin-top: 14px; display: grid; gap: 4px; }
.pay b { font: var(--weight-semibold) 15.5px/1.3 var(--font); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pay small { font: 13px/1.4 var(--font); color: var(--muted); }
.parties { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--grid); }
.parties p { font: 13px/1.45 var(--font); color: var(--ink-2); overflow-wrap: anywhere; }
.parties b { display: block; font: var(--weight-semibold) 14px/1.3 var(--font); color: var(--ink); margin: 6px 0 2px; }

/* the bottom navigation, the dashboard's own */
.tabs { position: fixed; z-index: 4; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; padding: 6px; border-radius: 24px; background: color-mix(in oklab, var(--surface) 82%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); box-shadow: inset 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.18); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 6px; border-radius: 18px; font: var(--weight-medium) 11px/1 var(--font); color: var(--muted); transition: color .25s, background .25s; }
.tabs svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button.on { color: var(--ink); background: var(--plane); }
.toast { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translate(-50%, 12px); width: max-content; max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 14px; background: var(--ink); color: var(--plane); font: var(--weight-medium) 13px/1.35 var(--font); opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s cubic-bezier(.2,.8,.2,1); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* gates: unlock, unlocked, no data */
.gate { min-height: 70vh; display: flex; flex-direction: column; justify-content: center; padding: 0 6px; }
.gate .mark { width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; background: radial-gradient(120% 120% at 30% 20%, color-mix(in oklab, var(--series-7) 30%, var(--surface)), var(--surface)); box-shadow: inset 0 0 0 1px var(--border); }
.gate .mark svg { width: 32px; height: 32px; fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gate h1 { font: var(--weight-bold) 38px/1.02 var(--font); letter-spacing: -.035em; margin-top: 22px; text-wrap: balance; }
.gate p { font: 16px/1.45 var(--font); color: var(--ink-2); margin-top: 12px; }

/* skeleton instead of a spinner */
.sk { border-radius: 16px; background: linear-gradient(90deg, var(--surface) 0%, var(--grid) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.sk-bar { height: 32px; width: 46%; }
.sk-hero { height: 96px; width: 86%; margin-top: 22px; }
.sk-card { height: 300px; margin-top: 18px; border-radius: 24px; }
@keyframes shimmer { to { background-position: -200% 0; } }

/* motion: the dashboard's verbs */
.screen { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s cubic-bezier(.3,.7,.2,1) forwards; }

<body>
<main id="app" aria-live="polite">
  <section class="skeleton" aria-hidden="true"><div class="sk sk-bar"></div><div class="sk sk-hero"></div><div class="sk sk-card"></div></section>
</main>
<script>
// The sealed snapshot (her.seal): AES-GCM with the viewer's key, signed by Her (#191 F14), and
// Telegram's CloudStorage that keeps the key. Shared by the owner's pages (app.js) and the
// client's (client.js): each defines TG (TG.inside) and post() and hands its bridge events to
// sealEvent(). Vanilla JS, no library, no network.
"use strict";

const WEB = "https://web.telegram.org";
const SEAL_PUB = "BLayuElZ6dmnCOYFYxBR5eDkLJrUjesDaxqyMg4smN6mUTBd7WpdO51X5OZWOJRhFUQ8YcHpFl3VDg6UQ4X-B6Q"; // Her's public key, pinned at the build (her.seal.Signer.public)
const SEAL_CONTEXT = new TextEncoder().encode("her-seal/1\n");

function unb64(text) {
  const s = atob(text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4));
  return Uint8Array.from(s, (c) => c.charCodeAt(0));
}

// «unsigned»: a link from before the signature (#191), «forged»: a signature that is not Her's —
// both show nothing; «key»: Her's, but this key does not open it.
class SealError extends Error { constructor(kind) { super(kind); this.kind = kind; } }

async function openSealed(text, keyText) {
  const dot = text.indexOf(".");
  if (dot < 0) throw new SealError("unsigned");
  let raw, sig, pub;
  try {
    raw = unb64(text.slice(0, dot));
    sig = unb64(text.slice(dot + 1));
    pub = await crypto.subtle.importKey("raw", unb64(SEAL_PUB), { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
  } catch (e) { throw new SealError("forged"); }
  const signed = new Uint8Array(SEAL_CONTEXT.length + raw.length);
  signed.set(SEAL_CONTEXT);
  signed.set(raw, SEAL_CONTEXT.length);
  if (!(await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, pub, sig, signed))) throw new SealError("forged");
  let plain;
  try {
    const key = await crypto.subtle.importKey("raw", unb64(keyText), "AES-GCM", false, ["decrypt"]);
    plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: raw.slice(0, 12) }, key, raw.slice(12));
  } catch (e) { throw new SealError("key"); }
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

// ---- Telegram's CloudStorage, as telegram-web-app.js calls it --------------------------------
const pending = {};
let calls = 0;
function nonce() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
}
function invoke(method, params) {
  if (!TG.inside) return Promise.reject(new Error("outside Telegram"));
  return new Promise((ok, fail) => {
    const id = `her${++calls}_${nonce()}`; // unguessable: a framing page cannot answer for Telegram
    pending[id] = [ok, fail];
    post("web_app_invoke_custom_method", { req_id: id, method, params });
    setTimeout(() => { if (pending[id]) { delete pending[id]; fail(new Error("timeout")); } }, 2500);
  });
}
function sealEvent(type, data) { // CloudStorage's answers, from the page's receive()
  if (type !== "custom_method_invoked" || !data || !pending[data.req_id]) return;
  const [ok, fail] = pending[data.req_id];
  delete pending[data.req_id];
  if (data.error) fail(new Error(data.error)); else ok(data.result);
}
// This webview's own copy: a client that cannot keep the key in CloudStorage, a local preview.
const localKey = {
  get(slot) { try { return localStorage.getItem(slot); } catch (e) { return null; } },
  set(slot, v) { try { localStorage.setItem(slot, v); } catch (e) { /* private mode */ } },
};

// The living river (#273): a silhouette streamgraph whose bands breathe and flow, on Canvas 2D.
// One module for every page that draws it: the client's home and week (concept B, the owner's
// pick 2026-11-05), the owner's week (#274: hours over the days, a day by touch) and the tour's
// first step (#230). Built into the page like the tokens; no library, no network.
//
// The data stays the picture; physics only makes it breathe (docs/learn, «жива ріка»):
// 1. Shape: a monotone cubic between days (harmonic slopes, Fritsch–Butland), so a band never
//    overshoots or dips below zero between two days.
// 2. Breathing: thickness × (1 + A·Σ a_m sin(κ_m x − ω_m t + φ)), three waves with the
//    deep-water dispersion ω = √(gκ): the longest crosses the river in ~9 s, long waves run
//    faster than short ones, the frequencies are incommensurate, the pattern never repeats.
// 3. Meander: the centre line rides the two longest waves, 2.2 % of the height.
// 4. Surface: the damped wave equation u_tt = c² u_xx − γ u_t on the river's section, explicit
//    finite differences, CFL C = c·Δt/Δx ≈ 0.45 at any width, fixed 1/120 s steps, sponges at
//    the ends; a touch kicks u_t with a gaussian, two ripples run away and fade.
// 5. Entry: a damped spring per band (ω0 = 7 rad/s, ζ = 0.72: one soft overshoot), 70 ms
//    apart; the front pours in from the left.
// Only the lines move: no particles (owner, 2026-11-04). Reduced motion or `still`: one frame.
// `at` (seconds): a deterministic frame for screenshots and tests, `tap` (0..1) and `after`.
"use strict";

const River = (() => {
  const TAU = Math.PI * 2;
  const STEP = 1 / 120; // the surface's fixed step, whatever the display's rate
  const N = 120; // points on every edge
  const AMP = 0.07, QUIET = 0.4; // the breathing; with the days shown it is this much of it
  const LAMBDA = [0.92, 0.47, 0.26], WAVE = [0.55, 0.3, 0.15], CROSS = 9; // of the width; s
  const GAMMA = 1.6, SPONGE = 6, EDGE = 10, SPEED = 2.2; // the surface: damping, ends, c = L/2.2 s
  const KICK = 3.2, BULGE = [-0.15, 0.25]; // a touch, and how far the section may swell

  function monotone(xs, ys, x) { // Fritsch–Carlson monotone cubic at x (xs ascending)
    const n = xs.length;
    if (n === 1 || x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], t = (x - xs[i]) / h;
    const d = (k) => (ys[k + 1] - ys[k]) / (xs[k + 1] - xs[k]);
    const m = (k) => {
      if (k === 0) return d(0);
      if (k === n - 1) return d(n - 2);
      const a = d(k - 1), b = d(k);
      return a * b <= 0 ? 0 : (2 * a * b) / (a + b); // harmonic mean: monotone on equal steps
    };
    const m0 = m(i) * h, m1 = m(i + 1) * h, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[i] + (t3 - 2 * t2 + t) * m0 + (-2 * t3 + 3 * t2) * ys[i + 1] + (t3 - t2) * m1;
  }

  // ---- the physics: no DOM, so node runs it in the tests -------------------------------------
  // data: {days: [iso], bands: [{name, color, manual, done, v: [level a day]}], from, to,
  //        ahead?: {frac, label, exact?}, focus?: [first, last] day indexes, numbers?: [text a day],
  //        week?: [7 short weekday names, Monday first]}
  class Flow {
    constructor(data, o) {
      this.d = data;
      this.o = Object.assign({ amp: AMP, meander: 1, days: false, height: 150 }, o || {});
      this.t = 0; this.acc = 0;
      this.dayAlpha = this.o.days ? 1 : 0;
      this.spring = data.bands.map(() => ({ x: 0, v: 0 }));
      this.front = { x: 0, v: 0 };
    }

    layout(width) {
      const n = this.d.days.length, pad = 6, H = this.o.height, S = this.d.bands.length;
      // `exact`: the owner's cabinet lines its days ahead up with the river's (#315)
      const a = this.d.ahead, ahead = !a ? 0 : a.exact ? Math.max(0, Math.min(0.9, a.frac)) : Math.max(0.1, Math.min(0.4, a.frac));
      this.W = width; this.H = H;
      this.x0 = pad; this.xr = pad + (width - 2 * pad) * (1 - ahead); this.xe = width - pad - 6;
      this.xs = Float32Array.from({ length: N }, (_, j) => this.x0 + (j * (this.xr - this.x0)) / (N - 1));
      this.dx = (this.xr - this.x0) / (N - 1);
      this.dayX = this.d.days.map((_, i) => this.x0 + (i * (this.xr - this.x0)) / Math.max(1, n - 1));
      this.th0 = this.d.bands.map((b) => Float32Array.from(this.xs, (x) => Math.max(0, monotone(this.dayX, b.v, x))));
      let peak = 1e-6;
      for (let j = 0; j < N; j++) { let s = 0; for (const row of this.th0) s += row[j]; peak = Math.max(peak, s); }
      this.k = (H * 0.86) / peak;
      const L = this.xr - this.x0, k1 = TAU / (LAMBDA[0] * L), c1 = L / CROSS, g = c1 * c1 * k1;
      this.waves = LAMBDA.map((l, m) => { const k = TAU / (l * L); return { k, w: Math.sqrt(g * k), a: WAVE[m] }; });
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      this.phase = this.d.bands.map(() => this.waves.map(() => rnd() * TAU));
      this.c = L / SPEED;
      this.u = new Float32Array(N); this.uOld = new Float32Array(N); this.uNew = new Float32Array(N);
      this.th = this.d.bands.map(() => new Float32Array(N)); // reused every frame: no garbage
      this.edges = Array.from({ length: S + 1 }, () => new Float32Array(N));
      this.stars = this.d.bands.map((b) => { // ✦ where a closed feature's band last runs strong
        if (!b.done) return -1;
        const top = Math.max(...b.v);
        for (let i = b.v.length - 1; i >= 0; i--) if (top > 0 && b.v[i] >= top * 0.5) return Math.round((this.dayX[i] - this.x0) / this.dx);
        return -1;
      });
    }

    cfl() { return (this.c * STEP) / this.dx; }
    amplitude() { return this.o.amp * (1 - (1 - QUIET) * this.dayAlpha); }

    kick(f) { // a gaussian push on u_t at a fraction of the river
      const j0 = f * (N - 1);
      for (let j = 0; j < N; j++) this.uOld[j] -= (KICK * Math.exp(-((j - j0) ** 2) / 18)) / 120;
    }

    step(dt) { // the damped wave equation, explicit, CFL-safe, sponges at the ends
      const C2 = ((this.c * dt) / this.dx) ** 2, { u, uOld, uNew } = this;
      for (let j = 1; j < N - 1; j++) {
        const damp = ((GAMMA + (j < EDGE || j > N - 1 - EDGE ? SPONGE : 0)) * dt) / 2;
        uNew[j] = (2 * u[j] - uOld[j] * (1 - damp) + C2 * (u[j + 1] - 2 * u[j] + u[j - 1])) / (1 + damp);
      }
      uNew[0] = uNew[1]; uNew[N - 1] = uNew[N - 2];
      this.uOld = u; this.u = uNew; this.uNew = uOld;
    }

    advance(dt) {
      this.t += dt;
      const w0 = 7, z = 0.72;
      this.spring.forEach((sp, s) => {
        if (this.t < s * 0.07) return;
        sp.v += (-w0 * w0 * (sp.x - 1) - 2 * z * w0 * sp.v) * dt; sp.x += sp.v * dt;
      });
      this.front.v += (-36 * (this.front.x - 1.02) - 2 * 0.9 * 6 * this.front.v) * dt;

// The report's age against TODAY (#253): «This week» only for this week, a month as a month.
function ageLabel() {
  const week = D.period.key.match(/^(\d{4})-W(\d+)$/), month = D.period.key.match(/^(\d{4})-(\d{2})$/);
  const range = D.period.key.match(/\.\.(\d{4})-(\d{2})-(\d{2})$/); // #302: by its last day
  if (range) {
    const end = new Date(Number(range[1]), Number(range[2]) - 1, Number(range[3])), now = new Date(TODAY);
    end.setDate(end.getDate() - ((end.getDay() + 6) % 7));
    now.setDate(TODAY.getDate() - ((TODAY.getDay() + 6) % 7));
    const back = Math.round((now - end) / (7 * 864e5));
    return back === 0 ? W.thisWeek : back === 1 ? W.lastWeek : W.latest;
  }
  if (week) {
    const jan4 = new Date(Number(week[1]), 0, 4), mon = new Date(jan4);
    mon.setDate(jan4.getDate() - ((jan4.getDay() + 6) % 7) + (Number(week[2]) - 1) * 7);
    const now = new Date(TODAY);
    now.setDate(TODAY.getDate() - ((TODAY.getDay() + 6) % 7));
    const back = Math.round((now - mon) / (7 * 864e5));
    return back === 0 ? W.thisWeek : back === 1 ? W.lastWeek : W.latest;

// The features as stations on one road: done (filled, ✓), now (filled as far as it got), next
// (hollow), and the launch at the end. The ring: every feature's built share in its colour.
function stationsOf() {
  const slots = titleSlots(), slotOf = (title, fallback) => (slots.has(title.toLowerCase()) ? slots.get(title.toLowerCase()) : fallback);
  const done = [], now = [], next = [];
  D.goals.forEach(([t, closed, total], i) => (total && closed >= total ? done : now).push({ t, slot: slotOf(t, D.lines.length + i), closed, total }));
  D.next.forEach(([t], i) => { if (!D.goals.some((g) => g[0].toLowerCase() === t.toLowerCase())) next.push({ t, slot: slotOf(t, D.lines.length + D.goals.length + i), closed: 0, total: 0 }); });
  return [done, now, next];
}
function launchCard(left) {
  const [done, now, next] = stationsOf(), deadline = left >= 0 ? D.deadline : null;
  if (!deadline && !done.length && !now.length && !next.length) return null;
  const card = h("section", "card deep"), head = h("div", "launch");
  const goals = [...done, ...now], total = sum(goals.map((g) => g.total));
  if (total) {

    s("circle", { cx: 48, cy: 48, r: 40, fill: "none", stroke: "var(--track)", "stroke-width": 10 }, ring);
    let at = 0;
    goals.forEach((g, i) => {
      const len = (g.closed / total) * 100;

      const arc = s("circle", { cx: 48, cy: 48, r: 40, fill: "none", stroke: color(g.slot), "stroke-width": 10, pathLength: 100, "stroke-dasharray": `${Math.max(0, len - 0.8)} ${100 - len + 0.8}`, "stroke-dashoffset": -at, class: "arc", transform: "rotate(-90 48 48)" }, ring);

  const lane = (name, items, kind, cap) => {

    shown.forEach((g) => {

  };
  lane(W.done, done, "done", 3);

  lane(W.next, next, "next", 3);
  if (deadline && stops.length) { // with no feature on the road, the date above says it all

// ---- the living river (#273): the flow and the road in one card -------------------------------
// The snapshot's `flow` (monitor.client_lens): levels only, no hours. A band takes its invoice
// line's colour by title; a line not on the invoice (outside git, PM) the next free slot.
const rivers = [];
let screens = 0; // each new screen: a frame queued for an older one builds nothing (#291)
function clearRivers() { screens++; rivers.splice(0).forEach((r) => r.destroy()); }
function nextFrame(node, draw) { // laid out first; never on a screen replaced since, or a detached node
  const gen = screens;
  requestAnimationFrame(() => { if (gen === screens && node.isConnected) draw(); });
}
const RQ = { at: Number(QS.get("at")) || 0, tap: Number(QS.get("tap")) || 0, after: Number(QS.get("after")) || 0 };
function riverData(week) {
  const F = D.flow;
  if (!F || !(F.days > 1) || !Array.isArray(F.lines) || !F.lines.length || !/^\d{4}-\d{2}-\d{2}$/.test(F.first || "")) return null;
  const first = day(F.first), n = F.days;
  const days = Array.from({ length: n }, (_, i) => { const d = new Date(first); d.setDate(first.getDate() + i); return isoOf(d); });
  const closed = new Set(D.goals.filter(([, c, t]) => t && c >= t).map(([t]) => String(t).toLowerCase()));
  const slots = titleSlots();
  const ordered = F.lines.filter((l) => l.manual).concat(F.lines.filter((l) => !l.manual)); // outside git lies on top
  const bands = ordered.filter((l) => Array.isArray(l.v) && l.v.length === n && l.t && l.v.some((x) => Number(x) > 0)).map((l) => {
    const slot = slots.get(String(l.t).toLowerCase());
    return { name: String(l.t), color: color(slot), slot, manual: Boolean(l.manual), done: closed.has(String(l.t).toLowerCase()), v: l.v.map((x) => Math.max(0, Number(x) || 0)) };
  });
  if (!bands.length) return null;
  const last = days[n - 1];
  const data = { days, bands, from: dateText(F.first), to: last === isoOf(TODAY) ? W.today : dateText(last), week: W.weekdays };
  if (D.deadline && day(D.deadline.date) > day(last)) {
    const ahead = Math.round((day(D.deadline.date) - day(last)) / 864e5);
    data.ahead = { frac: Math.min(0.3, Math.max(0.18, ahead / (n - 1 + ahead))), label: dateText(D.deadline.date) };
  }
  if (week && D.period) { const i = days.indexOf(D.period.first); if (i > 0) data.focus = [i, n - 1]; }
  return data;
}

function viewerName() { // the receiver in the owner's preview, else the viewer's first name

function tourStep(i, dir) {

  });

}

function tourDue(wants, seen, preview) { return wants === "again" || (wants === "1" && (preview || !seen)); }

  if (D && WORDS[D.lang]) { W = WORDS[D.lang]; LANG = D.lang; }

// What a report or home link opens: {D} (and `keep`: it becomes the newest home kept here), or
// {gate} with the gate's glyph and words. An unsigned link (#291) is a /start card from before
// the signature (#191) that Signal cannot edit: the newest home kept here stands in for it, and
// without one the gate points to the menu button, since 🔑 cannot help an unsigned link.
async function opening(sealed, store) {
  async function kept() { // the newest home this viewer opened, if this key still opens it
    if (!store.key || !store.home || store.home === sealed) return null;
    try { const k = await openSealed(store.home, store.key); return k && k.home ? k : null; } catch (e) { return null; } // a new key, an unsigned one
  }
  if (!sealed) { // the tour's «Open my week», a bare link: the newest home kept here
    const k = await kept();
    return k ? { D: k } : { gate: ["chat", W.nodata, W.nodataText] };
  }
  if (!store.key) return { gate: ["key", W.unlockTitle, W.unlockText] };
  let d;
  try { d = await openSealed(sealed, store.key); } catch (e) {
    if (e.kind === "forged") return { gate: ["chat", W.forged, W.forgedText] };
    if (e.kind !== "unsigned") return { gate: ["key", W.broken, W.brokenText] };
    const k = await kept();
    return k ? { D: k } : { gate: ["chat", W.stale, W.staleText] };
  }
  if (d.home && !d.preview) { // an old «My project» button: the newest home wins, a newer one is kept
    const newest = await kept();
    if (newest && newest.at > d.at) return { D: newest };
    return { D: d, keep: store.home !== sealed };
  }
  return { D: d };
}

async function start() {
  theme(TG.theme);
  post("web_app_ready");
  post("web_app_expand");
  const lang = (TG.data && json(new URLSearchParams(TG.data).get("user")) || {}).language_code || navigator.language || "en";
  if (/^uk/.test(lang)) { W = WORDS.uk; LANG = "uk"; }
  const key = launch.get("k"), sealed = launch.get("s");
  const wants = launch.get("tour") || ""; // the tour (#230): "1" the first time only, "again" always
  if (key) {
    // A plain browser keeps the key in localStorage: a link never replaces another one there.
    const held = TG.native ? null : local.get();
    if (held && held !== key) return gate("key", W.keyHeld, W.keyHeldText);
    const store = await loadStore(), made = Number(launch.get("m")) || 0;
    const newer = newerKept(store, key, made); // an old ✨ after ♻️: the new key stays, the tour still runs
    const kept = newer || (await saveKey(key, made));
    haptic(kept ? "medium" : "light");
    if (!kept) return gate("key", W.unlockFail, W.unlockFailText);
    if (wants) { // ✨ one tap keeps the key and runs the tour, on the newest home kept here if any
      try { const k = store.home ? await openSealed(store.home, newer ? store.key : key) : null; D = k && k.home ? k : null; } catch (e) { D = null; } // an older key's home
      speak();
      if (tourDue(wants, store.seen, false)) return tour(D ? () => showHome(true) : leave);
      if (D) return showHome(false);
    }
    return gate("ok", W.unlocked, W.unlockedText);
  }
  const store = await loadStore();
  const opened = await opening(sealed, store);
  if (opened.gate) return gate(...opened.gate);
  D = opened.D;
